<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;color:#172033}.box{max-width:460px;margin:70px auto;padding:30px;background:#fff;border:1px solid #e3e7ef;border-radius:24px;box-shadow:0 14px 40px #26345a12}h1{margin:0 0 8px;text-align:center}.sub{text-align:center;color:#697386;margin-bottom:25px}label{display:block;font-weight:800;margin:13px 0 7px}input{width:100%;padding:14px;border:1px solid #d8deea;border-radius:12px;font-size:16px}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#5538c8;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.new{text-align:center;margin-top:18px}.new a{color:#5538c8;font-weight:800;text-decoration:none}.back{display:block;text-align:center;margin-top:15px;color:#697386;text-decoration:none}</style></head><body><main class="box"><h1>تسجيل الدخول إلى نافس</h1><div class="sub">حساب نافس مستقل للوصول إلى الخطط المشمولة في الاشتراك</div><form id="login"><label>البريد الإلكتروني</label><input type="email" required autocomplete="email" placeholder="name@example.com"><label>كلمة المرور</label><input type="password" required autocomplete="current-password" placeholder="••••••••"><button type="submit">تسجيل الدخول</button></form><div class="new">ليس لديك حساب؟ <a href="nafs-subscribe.html">إنشاء حساب والاشتراك</a></div><a class="back" href="nafs.html">العودة إلى نافس</a></main><script>document.getElementById('login').addEventListener('submit',function(e){e.preventDefault();alert('واجهة الدخول جاهزة. سيتم تفعيل الدخول الفعلي عند ربط حسابات نافس بقاعدة البيانات.');});</script></body></html>
