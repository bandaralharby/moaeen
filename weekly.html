<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero,.panel{border-radius:20px;padding:22px;margin:16px 0}.hero{background:linear-gradient(135deg,#5036c7,#735be4);color:#fff}.panel{background:#fff;border:1px solid #e7e3f1}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-weight:900;margin-bottom:6px}.field select,.field input{width:100%;padding:12px;border:1px solid #dcd7ea;border-radius:11px;background:#fff}.lessons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.lesson{padding:11px;border:1px solid #e3dff0;border-radius:11px;background:#faf9ff}.lesson input{margin-left:7px}.note{color:#706b7d;font-size:13px}.btn{border:0;border-radius:11px;padding:12px 18px;background:#5b3fd6;color:#fff;font-weight:900;margin-top:12px}@media(max-width:650px){.grid,.lessons{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI</div><a class="back" href="index.html">← الرئيسية</a></div><div class="hero"><h1>📅 الخطة الأسبوعية</h1><p>اختر الصف والمادة ثم حدد الوحدة ودروس الأسبوع.</p></div><div class="panel"><div class="grid"><div class="field"><label>المرحلة</label><select><option>ابتدائي</option></select></div><div class="field"><label>الصف</label><select id="grade" onchange="fillSubjects()"><option>الأول الابتدائي</option><option>الثاني الابتدائي</option><option>الثالث الابتدائي</option><option>الرابع الابتدائي</option><option>الخامس الابتدائي</option><option>السادس الابتدائي</option></select></div><div class="field"><label>المادة</label><select id="subject" onchange="fillUnits()"></select></div><div class="field"><label>الوحدة</label><select id="unit" onchange="fillLessons()"></select></div></div><h3>دروس الأسبوع</h3><div id="lessons" class="lessons"></div><p id="note" class="note"></p><button class="btn">حفظ الاختيار</button></div></div><script>const base=['القرآن الكريم والدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];const subjects={ 'الأول الابتدائي':base,'الثاني الابتدائي':base,'الثالث الابتدائي':base,'الرابع الابتدائي':[...base,'الدراسات الاجتماعية','المهارات الرقمية'],'الخامس الابتدائي':[...base,'الدراسات الاجتماعية','المهارات الرقمية'],'السادس الابتدائي':[...base,'الدراسات الاجتماعية','المهارات الرقمية']};const digital={ 'الرابع الابتدائي':{'الوحدة الأولى: تعلم الأساسيات':['الحاسب','سطح المكتب','إعدادات جهاز الحاسب'],'الوحدة الثانية: العمل على النص':['لوحة المفاتيح','تحرير النص','تنسيق النص','تنسيق الفقرة'],'الوحدة الثالثة: عالمي المتصل':['الموقع الإلكتروني','البحث في الإنترنت','مصادر المعلومات','السلامة على الإنترنت'],'الوحدة الرابعة: العمل مع البرمجة باستخدام سكراتش':['أساسيات سكراتش','استخدام اللبنات البرمجية','التكرارات في سكراتش','الرسم بواسطة سكراتش']},'الخامس الابتدائي':{'الوحدة الأولى: تعلم الأساسيات':['أجهزة الحاسب','أجزاء الحاسب','الملفات والمجلدات'],'الوحدة الثانية: التعامل مع المستندات':['الصور والرسومات','التنسيق المتقدم','إدراج الرسومات التوضيحية','التدقيق والطباعة'],'الوحدة الثالثة: الوسائط المتعددة':['استخدام أجهزة الالتقاط وتحرير مقاطع الصوت','البحث عن الوسائط المتعددة وإنشاء وتحرير مقاطع الفيديو'],'الوحدة الرابعة: البرمجة والتفاعل في سكراتش':['كيفية تصميم برنامج','الكائنات في سكراتش','المعاملات الشرطية','الحركة في سكراتش','رسائل البث','الاستشعار']},'السادس الابتدائي':{'الوحدة الأولى: التصميم ثلاثي الأبعاد':['مقدمة إلى النمذجة ثلاثية الأبعاد','معالجة الأشكال ثلاثية الأبعاد'],'الوحدة الثانية: جداول البيانات':['تنفيذ العمليات الحسابية','المخططات البيانية'],'الوحدة الثالثة: قواعد البيانات':['مقدمة عن قواعد البيانات','إنشاء قاعدة بيانات','الفرز والتصفية'],'الوحدة الرابعة: البرمجة باستخدام سكراتش':['التكرار في سكراتش','برمجة العمليات الحسابية','اتخاذ القرارات','الإحداثيات في سكراتش','القرارات المركبة في سكراتش','الألعاب في سكراتش']}};function fillSubjects(){subject.innerHTML=(subjects[grade.value]||[]).map(x=>`<option>${x}</option>`).join('');if(['الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'].includes(grade.value)){subject.value='المهارات الرقمية'}fillUnits()}function fillUnits(){const d=subject.value==='المهارات الرقمية'?digital[grade.value]:null;if(!d){unit.innerHTML='<option>الدروس قيد الإضافة</option>';lessons.innerHTML='';note.textContent='سيتم إضافة وحدات ودروس هذه المادة تباعًا.';return}unit.innerHTML=Object.keys(d).map(x=>`<option>${x}</option>`).join('');note.textContent='يمكن اختيار أكثر من درس للأسبوع.';fillLessons()}function fillLessons(){const d=digital[grade.value],a=d?.[unit.value]||[];lessons.innerHTML=a.map(x=>`<label class="lesson"><input type="checkbox">${x}</label>`).join('')}fillSubjects();</script></body></html>
