<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية النهائية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;background:#edf1f2;font-family:Tahoma,Arial,sans-serif;color:#20373d}.tools{position:sticky;top:0;z-index:10;background:#183e48;padding:10px;text-align:center}.tools button{border:0;border-radius:22px;background:#fff;color:#183e48;padding:10px 24px;font-weight:900;cursor:pointer}.page{width:297mm;min-height:210mm;margin:10px auto;background:#fff;padding:7mm 9mm;box-shadow:0 7px 28px #60757c38}.head{display:grid;grid-template-columns:135px 1fr 135px;align-items:center;border-bottom:3px solid #16a085;padding-bottom:5mm;margin-bottom:4mm}.logoBox{text-align:right}.logoBox img{width:122px;height:62px;object-fit:contain}.headCenter{text-align:center}.headCenter h1{margin:0;color:#173e48;font-size:20px}.headCenter p{margin:5px 0 0;color:#6b7e82;font-size:9px}.weekBox{text-align:center;border:1px solid #c7dcda;border-radius:12px;background:#f4faf8;padding:9px 5px}.weekBox small{display:block;color:#71868a;font-size:7px}.weekBox b{color:#147969;font-size:11px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:5px}.m{border:1px solid #d6e3e2;border-radius:8px;background:#fbfdfd;padding:6px 8px}.m small{display:block;color:#738589;font-size:7px;margin-bottom:2px}.m b{font-size:9px;color:#27484f}.status{background:#f0f8f5;border-right:4px solid #16a085;border-radius:7px;padding:6px 9px;margin:5px 0 7px;font-size:8px}.status b{color:#087864}.tableWrap{border:1px solid #c3d6d5;border-radius:9px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7.7px}thead{display:table-header-group}thead th{background:#1c5662;color:#fff;padding:6px 5px;border-left:1px solid #ffffff35;font-weight:900}tbody td{padding:5px 6px;border-top:1px solid #dce8e7;border-left:1px solid #dce8e7;vertical-align:top;line-height:1.45;overflow-wrap:anywhere}tbody tr:nth-child(even){background:#f8fbfa}tbody tr{break-inside:avoid;page-break-inside:avoid}.sub{font-weight:900;color:#176b65}.unit{display:block;color:#74898c;font-size:6.6px;margin-top:2px}.empty{color:#a1abad}.sign{display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:8px;text-align:center;font-size:8px;break-inside:avoid}.line{border-bottom:1px solid #668086;width:55%;height:13px;margin:auto}.foot{text-align:center;color:#7b8c8f;font-size:6.5px;margin-top:6px}@media(max-width:900px){.page{width:100%;min-height:100vh;margin:0;padding:12px}.head{grid-template-columns:100px 1fr 100px}.logoBox img{width:90px;height:50px}.tableWrap{overflow-x:auto}table{min-width:850px}}@media print{body{background:#fff}.tools{display:none}.page{margin:0;box-shadow:none;width:100%;min-height:0;padding:5mm 7mm}.head{margin-top:0}.tableWrap{overflow:visible}table{font-size:8px}.sign{page-break-inside:avoid}@page{size:A4 landscape;margin:7mm}}</style></head><body><div class="tools"><button onclick="window.print()">طباعة / حفظ PDF</button></div><main class="page"><header class="head"><div class="logoBox"><img src="https://www.moe.gov.sa/_layouts/15/MOE/PortalAssets/images/logo.png" alt="شعار وزارة التعليم" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/7/76/Ministry_of_Education_%28Saudi_Arabia%29_%28logo%29.png'"></div><div class="headCenter"><h1>الخطة الأسبوعية الموحدة</h1><p><span id="school">اسم المدرسة</span> · وزارة التعليم</p></div><div class="weekBox"><small>الأسبوع الدراسي</small><b id="week">الأسبوع</b></div></header><section class="meta" id="meta"></section><div class="status" id="status"></div><div class="tableWrap"><table><thead><tr><th style="width:15%">المادة</th><th style="width:15%">المعلم/ة</th><th style="width:34%">الدروس / الموضوعات</th><th style="width:23%">الواجبات والتكليفات</th><th style="width:13%">ملاحظات</th></tr></thead><tbody id="rows"></tbody></table></div><div class="sign"><div><b>إعداد ومتابعة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot">تم إعداد الخطة الأسبوعية إلكترونيًا عبر أنجز AI</div></main><script>const q=new URLSearchParams(location.search),id=q.get('plan');let p=null,parts=[];try{p=JSON.parse(localStorage.getItem('anjz_weekly_'+id)||'null');parts=JSON.parse(localStorage.getItem('anjz_weekly_parts_'+id)||'[]')}catch(e){}if(!p){document.querySelector('.page').innerHTML='<h2 style="text-align:center;margin-top:80px">لم يتم العثور على بيانات الخطة على هذا الجهاز.</h2>'}else{school.textContent=p.school||'اسم المدرسة';week.textContent=p.week||'الأسبوع';meta.innerHTML=[['المرحلة',p.stage],['الصف',p.grade],['الفصل الدراسي',p.term],['بداية الأسبوع',p.start||'—']].map(x=>`<div class="m"><small>${x[0]}</small><b>${x[1]||'—'}</b></div>`).join('');const done=new Set(parts.map(x=>x.subject)),total=(p.subs||[]).length;status.innerHTML=`<b>اكتمال الخطة:</b> ${done.size} من ${total} مواد — ${done.size>=total?'اكتملت جميع المشاركات ✓':'بانتظار '+Math.max(0,total-done.size)+' مادة'}`;rows.innerHTML=(p.subs||[]).map(s=>{const a=parts.filter(x=>x.subject===s);if(!a.length)return `<tr><td class="sub">${s}</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">لم تُعبأ</td></tr>`;return a.map(x=>`<tr><td class="sub">${s}${x.unit?`<span class="unit">${x.unit}</span>`:''}</td><td><b>${x.teacher||'—'}</b></td><td>${(x.lessons||[]).join('، ')||x.manualLessons||'—'}</td><td>${x.homework||'—'}</td><td>${x.notes||'—'}</td></tr>`).join('')}).join('')}</script></body></html>
