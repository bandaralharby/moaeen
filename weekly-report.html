<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية النهائية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eff2;font-family:Tahoma,Arial,sans-serif;color:#17364a}.tools{position:sticky;top:0;z-index:10;background:#073f5d;padding:12px;text-align:center}.tools button{border:0;border-radius:24px;background:#fff;color:#073f5d;padding:11px 25px;font-weight:900}.page{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:10mm;box-shadow:0 6px 25px #71858e44}.head{background:linear-gradient(115deg,#07577b,#0b8d83,#14a271);border-radius:0 0 24px 24px;color:#fff;margin:-10mm -10mm 8mm;padding:9mm 10mm 7mm}.headrow{display:grid;grid-template-columns:140px 1fr 140px;align-items:center}.logo{background:#fff;border-radius:13px;padding:7px;width:135px}.logo img{width:120px;height:45px;object-fit:contain}.org{text-align:center;line-height:1.7}.org b{font-size:18px}.week{text-align:center;background:#ffffff22;border:1px solid #ffffff55;border-radius:16px;padding:8px;font-weight:900}.title{text-align:center;margin-top:12px}.title span{display:inline-block;background:#fff;color:#07577b;border-radius:25px;padding:9px 40px;font-size:22px;font-weight:900}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}.m{border:1px solid #cde3e1;border-radius:10px;background:#f8fcfb;padding:8px}.m small{display:block;color:#71888e;margin-bottom:3px}.m b{font-size:11px}.status{background:#eef9f5;border:1px solid #c6e7da;border-radius:12px;padding:9px 12px;margin:10px 0;font-size:11px}.status b{color:#08775f}.subject{border:1.5px solid #c7dedf;border-radius:14px;margin:9px 0;overflow:hidden;break-inside:avoid}.subjectHead{background:linear-gradient(90deg,#07577b,#0b9181);color:#fff;padding:8px 12px;display:flex;justify-content:space-between;gap:10px}.subjectHead b{font-size:13px}.subjectHead span{font-size:10px}.body{display:grid;grid-template-columns:1.25fr .9fr .8fr;gap:0}.cell{padding:9px;border-left:1px solid #e0eceb;min-height:55px}.cell:last-child{border-left:0}.cell small{display:block;color:#789095;font-size:9px;margin-bottom:4px}.cell div{font-size:10px;line-height:1.65}.empty{color:#9aa9ad}.sign{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:18px;text-align:center;font-size:10px}.line{border-bottom:1px solid #56747b;width:70%;height:20px;margin:auto}.foot{text-align:center;color:#72898d;font-size:8px;margin-top:15px}@media(max-width:800px){.page{width:100%;min-height:100vh;margin:0;padding:12px}.head{margin:-12px -12px 12px;padding:18px 10px}.headrow{grid-template-columns:95px 1fr 90px}.logo{width:92px}.logo img{width:78px;height:35px}.org b{font-size:13px}.org div{font-size:9px}.week{font-size:9px}.title span{font-size:17px;padding:8px 20px}.meta{grid-template-columns:1fr 1fr}.body{grid-template-columns:1fr}.cell{border-left:0;border-bottom:1px solid #e0eceb}.cell:last-child{border-bottom:0}}@media print{body{background:#fff}.tools{display:none}.page{margin:0;box-shadow:none;width:210mm;min-height:297mm}@page{size:A4;margin:0}}</style></head><body><div class="tools"><button onclick="window.print()">طباعة / حفظ PDF</button></div><main class="page"><header class="head"><div class="headrow"><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/7/76/Ministry_of_Education_%28Saudi_Arabia%29_%28logo%29.png"></div><div class="org"><b>وزارة التعليم</b><div id="school">اسم المدرسة</div><div>الخطة الأسبوعية التعليمية</div></div><div class="week" id="week">الأسبوع</div></div><div class="title"><span>الخطة الأسبوعية الموحدة</span></div></header><section class="meta" id="meta"></section><div class="status" id="status"></div><section id="rows"></section><div class="sign"><div><b>إعداد ومتابعة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot">تم إعداد الخطة الأسبوعية إلكترونيًا عبر أنجز AI</div></main><script>const q=new URLSearchParams(location.search),id=q.get('plan');let p=null,parts=[];try{p=JSON.parse(localStorage.getItem('anjz_weekly_'+id)||'null');parts=JSON.parse(localStorage.getItem('anjz_weekly_parts_'+id)||'[]')}catch(e){}if(!p){document.querySelector('.page').innerHTML='<h2 style="text-align:center;margin-top:80px">لم يتم العثور على بيانات الخطة على هذا الجهاز.</h2>'}else{school.textContent=p.school||'اسم المدرسة';week.textContent=p.week||'الأسبوع';meta.innerHTML=[['المرحلة',p.stage],['الصف',p.grade],['الفصل الدراسي',p.term],['بداية الأسبوع',p.start||'—']].map(x=>`<div class="m"><small>${x[0]}</small><b>${x[1]||'—'}</b></div>`).join('');const done=new Set(parts.map(x=>x.subject)),total=(p.subs||[]).length;status.innerHTML=`<b>اكتمال الخطة:</b> ${done.size} من ${total} مواد — ${done.size>=total?'اكتملت جميع المشاركات ✓':'بانتظار '+Math.max(0,total-done.size)+' مادة'}`;rows.innerHTML=(p.subs||[]).map(s=>{const a=parts.filter(x=>x.subject===s);if(!a.length)return `<article class="subject"><div class="subjectHead"><b>${s}</b><span>لم تُعبأ بعد</span></div><div class="body"><div class="cell"><small>الدروس / الموضوعات</small><div class="empty">—</div></div><div class="cell"><small>الواجبات والتكليفات</small><div class="empty">—</div></div><div class="cell"><small>المعلم/ة</small><div class="empty">—</div></div></div></article>`;return a.map(x=>`<article class="subject"><div class="subjectHead"><b>${s}</b><span>${x.unit||''}</span></div><div class="body"><div class="cell"><small>الدروس / الموضوعات</small><div>${(x.lessons||[]).join('، ')||x.manualLessons||'—'}</div></div><div class="cell"><small>الواجبات والتكليفات</small><div>${x.homework||'—'}${x.notes?'<br><small>ملاحظات: '+x.notes+'</small>':''}</div></div><div class="cell"><small>المعلم/ة</small><div><b>${x.teacher||'—'}</b></div></div></div></article>`).join('')}).join('')}</script></body></html>
