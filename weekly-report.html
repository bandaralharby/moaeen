<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية النهائية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eff2;font-family:Tahoma,Arial,sans-serif;color:#17364a}.tools{position:sticky;top:0;z-index:10;background:#073f5d;padding:10px;text-align:center}.tools button{border:0;border-radius:22px;background:#fff;color:#073f5d;padding:10px 22px;font-weight:900}.page{width:297mm;min-height:210mm;margin:10px auto;background:#fff;padding:6mm 8mm;box-shadow:0 6px 25px #71858e44}.head{background:linear-gradient(115deg,#07577b,#0b8d83,#14a271);border-radius:0 0 18px 18px;color:#fff;margin:-6mm -8mm 4mm;padding:5mm 8mm 4mm}.headrow{display:grid;grid-template-columns:115px 1fr 115px;align-items:center}.logo{background:#fff;border-radius:10px;padding:4px;width:108px}.logo img{width:98px;height:34px;object-fit:contain}.org{text-align:center;line-height:1.45}.org b{font-size:15px}.org div{font-size:9px}.week{text-align:center;background:#ffffff22;border:1px solid #ffffff55;border-radius:12px;padding:6px;font-size:10px;font-weight:900}.title{text-align:center;margin-top:7px}.title span{display:inline-block;background:#fff;color:#07577b;border-radius:20px;padding:6px 28px;font-size:17px;font-weight:900}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:5px}.m{border:1px solid #cde3e1;border-radius:7px;background:#f8fcfb;padding:5px 7px}.m small{display:block;color:#71888e;font-size:7px}.m b{font-size:9px}.status{background:#eef9f5;border:1px solid #c6e7da;border-radius:8px;padding:5px 8px;margin:5px 0;font-size:8px}.status b{color:#08775f}.tableWrap{border:1px solid #bcd6d5;border-radius:10px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7.5px}thead th{background:#07577b;color:#fff;padding:5px 4px;border-left:1px solid #ffffff33}tbody td{padding:4px 5px;border-top:1px solid #dbe9e8;border-left:1px solid #dbe9e8;vertical-align:top;line-height:1.35;word-wrap:break-word}tbody tr:nth-child(even){background:#f7fbfa}.sub{font-weight:900;color:#07577b}.unit{display:block;color:#6d8588;font-size:6.5px;margin-top:2px}.empty{color:#a0aaad}.sign{display:grid;grid-template-columns:1fr 1fr;gap:70px;margin-top:7px;text-align:center;font-size:8px}.line{border-bottom:1px solid #56747b;width:55%;height:12px;margin:auto}.foot{text-align:center;color:#72898d;font-size:6.5px;margin-top:5px}@media(max-width:900px){.page{width:100%;min-height:100vh;margin:0;padding:10px}.head{margin:-10px -10px 10px}.tableWrap{overflow-x:auto}table{min-width:850px}}@media print{body{background:#fff}.tools{display:none}.page{margin:0;box-shadow:none;width:297mm;height:210mm;min-height:210mm;overflow:hidden;padding:5mm 7mm}.head{margin:-5mm -7mm 3mm;padding:4mm 7mm 3mm}.meta{margin-bottom:4px}.status{margin:4px 0}.sign{margin-top:5px}@page{size:A4 landscape;margin:0}}</style></head><body><div class="tools"><button onclick="window.print()">طباعة / حفظ PDF</button></div><main class="page"><header class="head"><div class="headrow"><div class="logo"><img src="https://upload.wikimedia.org/wikipedia/commons/7/76/Ministry_of_Education_%28Saudi_Arabia%29_%28logo%29.png"></div><div class="org"><b>وزارة التعليم</b><div id="school">اسم المدرسة</div><div>الخطة الأسبوعية التعليمية</div></div><div class="week" id="week">الأسبوع</div></div><div class="title"><span>الخطة الأسبوعية الموحدة</span></div></header><section class="meta" id="meta"></section><div class="status" id="status"></div><div class="tableWrap"><table><thead><tr><th style="width:16%">المادة</th><th style="width:16%">المعلم/ة</th><th style="width:34%">الدروس / الموضوعات</th><th style="width:22%">الواجبات والتكليفات</th><th style="width:12%">ملاحظات</th></tr></thead><tbody id="rows"></tbody></table></div><div class="sign"><div><b>إعداد ومتابعة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot">تم إعداد الخطة الأسبوعية إلكترونيًا عبر أنجز AI</div></main><script>const q=new URLSearchParams(location.search),id=q.get('plan');let p=null,parts=[];try{p=JSON.parse(localStorage.getItem('anjz_weekly_'+id)||'null');parts=JSON.parse(localStorage.getItem('anjz_weekly_parts_'+id)||'[]')}catch(e){}if(!p){document.querySelector('.page').innerHTML='<h2 style="text-align:center;margin-top:80px">لم يتم العثور على بيانات الخطة على هذا الجهاز.</h2>'}else{school.textContent=p.school||'اسم المدرسة';week.textContent=p.week||'الأسبوع';meta.innerHTML=[['المرحلة',p.stage],['الصف',p.grade],['الفصل الدراسي',p.term],['بداية الأسبوع',p.start||'—']].map(x=>`<div class="m"><small>${x[0]}</small><b>${x[1]||'—'}</b></div>`).join('');const done=new Set(parts.map(x=>x.subject)),total=(p.subs||[]).length;status.innerHTML=`<b>اكتمال الخطة:</b> ${done.size} من ${total} مواد — ${done.size>=total?'اكتملت جميع المشاركات ✓':'بانتظار '+Math.max(0,total-done.size)+' مادة'}`;rows.innerHTML=(p.subs||[]).map(s=>{const a=parts.filter(x=>x.subject===s);if(!a.length)return `<tr><td class="sub">${s}</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">لم تُعبأ</td></tr>`;return a.map((x,i)=>`<tr><td class="sub">${s}${x.unit?`<span class="unit">${x.unit}</span>`:''}</td><td><b>${x.teacher||'—'}</b></td><td>${(x.lessons||[]).join('، ')||x.manualLessons||'—'}</td><td>${x.homework||'—'}</td><td>${x.notes||'—'}</td></tr>`).join('')}).join('')}</script></body></html>
