<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>تقرير الأسبوع الكامل</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden}body{background:#eef3f4;font-family:Tahoma,Arial,sans-serif;color:#153b45}.tools{position:sticky;top:0;z-index:9;background:#153f49;padding:11px;text-align:center}.tools button{border:0;border-radius:24px;background:#fff;color:#153f49;padding:11px 28px;font-weight:900;cursor:pointer}.sheet{width:297mm;height:210mm;margin:12px auto;background:#fff;box-shadow:0 8px 28px #45636b25;overflow:hidden;page-break-after:always;display:flex;align-items:center;justify-content:center}.sheet:last-child{page-break-after:auto}.reportBox{width:230mm}.page{width:100%;display:flex;flex-direction:column;gap:2mm}.head{display:grid;grid-template-columns:125px 1fr 115px;align-items:center;gap:10px;padding:2mm 1mm;border-top:4px solid #0b8f83;border-bottom:1px solid #d7e7e4}.logo img{width:108px;height:50px;object-fit:contain}.title{text-align:center}.title .tag{display:inline-block;padding:3px 13px;border-radius:20px;background:#edf8f4;color:#13806f;font-size:8px;font-weight:900}.title h1{margin:4px 0 1px;font-size:17px}.title p{margin:0;color:#809194;font-size:7.5px}.week{text-align:center;border:1px solid #cce1dd;border-radius:10px;background:#f7fbfa;padding:6px}.week small{display:block;color:#819294;font-size:7.5px}.week b{display:block;margin-top:2px;color:#087867;font-size:10px}.infoBand{display:grid;grid-template-columns:1.35fr .8fr .8fr .9fr;gap:6px}.schoolCard{background:#174f5b;color:#fff;border-radius:8px;padding:5px 10px}.schoolCard small{display:block;color:#cce1df;font-size:7px}.schoolCard b{display:block;font-size:9.5px;margin-top:1px}.m{border:1px solid #d4e4e1;border-radius:8px;background:#fbfdfd;padding:4px 3px;text-align:center}.m small{display:block;color:#829295;font-size:7px}.m b{display:block;color:#284e55;font-size:8px;margin-top:1px}.status{background:#f0f8f5;border:1px solid #d0e7df;border-radius:7px;padding:5px 8px;font-size:7.5px}.status b{color:#087965}.tableWrap{border:1px solid #bfd6d2;border-radius:8px;overflow:hidden}.tableWrap table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8px}.tableWrap th{background:#176b79;color:#fff;padding:5px 4px;font-size:8px}.tableWrap td{padding:4px 6px;border-top:1px solid #dce9e7;border-left:1px solid #dce9e7;vertical-align:middle;line-height:1.2;overflow-wrap:anywhere}.tableWrap tbody tr:nth-child(even){background:#f8fbfa}.sub{font-weight:900;color:#08766d;font-size:8px}.empty{color:#9ba9aa}.detail{display:block;margin-top:1px;color:#51686d}.sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin:0 17mm;text-align:center;font-size:7.5px}.line{border-bottom:1px solid #71878b;width:60%;height:6px;margin:auto}.foot{text-align:center;border-top:1px solid #e2ecea;color:#849496;font-size:6px;padding-top:1px}.loading{text-align:center;padding:70px 10px;font-size:18px}@media screen and (max-width:900px){body{background:#f4f7f7}.tools{width:100%}.sheet{width:100%!important;height:auto!important;min-height:0!important;margin:8px 0!important;padding:8px!important;box-shadow:none!important;display:block!important;overflow:hidden!important}.reportBox{width:100%!important;max-width:100%!important;margin:0!important}.page{width:100%!important;max-width:100%!important;gap:5px}.head{grid-template-columns:64px minmax(0,1fr) 62px;gap:4px;padding:5px 2px}.logo img{width:60px;height:38px}.title .tag{font-size:6px;padding:2px 6px}.title h1{font-size:11px;margin:2px 0}.title p{font-size:5.5px}.week{padding:4px 2px}.week small{font-size:5.5px}.week b{font-size:7px}.infoBand{grid-template-columns:1.35fr .8fr .8fr .9fr;gap:3px}.schoolCard,.m{padding:4px 2px;border-radius:5px}.schoolCard small,.m small{font-size:5.5px}.schoolCard b,.m b{font-size:6.5px}.status{font-size:6px;padding:4px 5px}.tableWrap{width:100%;overflow:hidden}.tableWrap table{width:100%;font-size:5.5px;table-layout:fixed}.tableWrap th{font-size:5.5px;padding:4px 2px}.tableWrap td{font-size:5.5px;padding:4px 2px;word-break:break-word;overflow-wrap:anywhere}.sub{font-size:5.5px}.sign{gap:20px;margin:3px 8px;font-size:5.5px}.foot{font-size:5px}}@media print{html,body{width:297mm!important;background:#fff!important;margin:0!important;padding:0!important;overflow:visible!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.tools{display:none!important}.sheet{width:297mm!important;height:210mm!important;margin:0!important;padding:0!important;box-shadow:none!important;overflow:hidden!important;display:flex!important;align-items:center!important;justify-content:center!important;break-after:page!important;page-break-after:always!important}.sheet:last-child{break-after:auto!important;page-break-after:auto!important}.reportBox{width:230mm!important;margin:auto!important}.page{width:230mm!important}@page{size:A4 landscape;margin:0}}</style></head><body><div class="tools"><button id="printBtn" type="button">طباعة / حفظ PDF كامل</button></div><div id="reports"><div class="loading">جاري تحميل تقرير الأسبوع الكامل...</div></div><script>
const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/weekly-plan-api',q=new URLSearchParams(location.search),admin=q.get('admin'),week=Number(q.get('week')||1),term=q.get('term')||'الفصل الدراسي الأول',grades=['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'];const base=['القرآن الكريم','الدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];function subjects(g){return ['الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'].includes(g)?[...base,'الدراسات الاجتماعية','المهارات الرقمية']:base}function weekName(n){const a=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر'];return 'الأسبوع '+(a[n]||n)}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر تحميل التقرير');return d}function splitLegacy(rows){const out=rows.filter(e=>e.subject!=='القرآن الكريم والدراسات الإسلامية').map(e=>({...e}));const old=rows.find(e=>e.subject==='القرآن الكريم والدراسات الإسلامية');if(old){if(!out.some(e=>e.subject==='القرآن الكريم'))out.push({...old,subject:'القرآن الكريم'});if(!out.some(e=>e.subject==='الدراسات الإسلامية'))out.push({...old,subject:'الدراسات الإسلامية'})}return out}function lessonText(x){const main=(x.lessons||[]).join('، '),detail=(x.manual_lessons||'').trim();if(main&&detail)return main+`<span class="detail">تفاصيل: ${detail}</span>`;return main||detail||'—'}function page(s,parts,g){const subs=subjects(g),rows=splitLegacy(parts.filter(x=>x.grade===g)),done=new Set(rows.map(x=>x.subject));return `<section class="sheet"><div class="reportBox"><main class="page"><header class="head"><div class="logo"><img src="Moelogo.jpg?v=3"></div><div class="title"><span class="tag">الخطة التعليمية الأسبوعية</span><h1>الخطة الأسبوعية الموحدة</h1><p>تقرير المدرسة الأسبوعي — صفحة مستقلة لكل صف</p></div><div class="week"><small>الأسبوع الدراسي</small><b>${weekName(week)}</b></div></header><section class="infoBand"><div class="schoolCard"><small>المدرسة</small><b>${s.name}</b></div><div class="m"><small>المرحلة</small><b>الابتدائية</b></div><div class="m"><small>الصف</small><b>${g}</b></div><div class="m"><small>الفصل الدراسي</small><b>${term}</b></div></section><div class="status"><b>اكتمال الخطة:</b> ${done.size} من ${subs.length} مواد — ${done.size>=subs.length?'مكتملة':'بانتظار '+Math.max(0,subs.length-done.size)+' مادة'}</div><div class="tableWrap"><table><thead><tr><th style="width:15%">المادة</th><th style="width:15%">المعلم/ة</th><th style="width:34%">الدروس / الموضوعات</th><th style="width:23%">الواجبات والتكليفات</th><th style="width:13%">ملاحظات</th></tr></thead><tbody>${subs.map(sub=>{const x=rows.find(e=>e.subject===sub);return x?`<tr><td class="sub">${sub}</td><td><b>${x.teacher||'—'}</b></td><td>${lessonText(x)}</td><td>${x.homework||'—'}</td><td>${x.notes||'—'}</td></tr>`:`<tr><td class="sub">${sub}</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">لم تُعبأ</td></tr>`}).join('')}</tbody></table></div><div class="sign"><div><b>إعداد ومتابعة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot">${g}</div></main></div></section>`}async function load(){try{if(!admin)throw Error('رابط التقرير غير مكتمل');const s=await api({action:'school',admin}),parts=await api({action:'list',admin,week,term});document.getElementById('reports').innerHTML=grades.map(g=>page(s,parts,g)).join('')}catch(e){document.getElementById('reports').innerHTML='<div class="loading">'+e.message+'</div>'}}document.getElementById('printBtn').onclick=function(){window.print()};load();
</script></body></html>
