<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير الأسبوع الكامل</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f4;font-family:Tahoma,Arial,sans-serif;color:#153b45}.tools{position:sticky;top:0;z-index:9;background:#153f49;padding:11px;text-align:center}.tools button{border:0;border-radius:24px;background:#fff;color:#153f49;padding:11px 28px;font-weight:900}.sheet{width:297mm;height:210mm;margin:12px auto;background:#fff;box-shadow:0 8px 28px #45636b25;overflow:hidden;page-break-after:always}.sheet:last-child{page-break-after:auto}.page{width:100%;height:100%;padding:18mm 9mm 5mm;display:flex;flex-direction:column}.head{display:grid;grid-template-columns:145px 1fr 135px;align-items:center;gap:10px;padding:3.5mm 1mm;border-top:4px solid #0b8f83;border-bottom:1px solid #d7e7e4;flex:0 0 auto}.logo img{width:125px;height:68px;object-fit:contain}.title{text-align:center}.title .tag{display:inline-block;padding:4px 14px;border-radius:20px;background:#edf8f4;color:#13806f;font-size:8px;font-weight:900}.title h1{margin:5px 0 2px;font-size:19px}.title p{margin:0;color:#809194;font-size:7.5px}.week{text-align:center;border:1px solid #cce1dd;border-radius:12px;background:#f7fbfa;padding:8px}.week small{display:block;color:#819294;font-size:7px}.week b{display:block;margin-top:3px;color:#087867;font-size:11px}.infoBand{display:grid;grid-template-columns:1.35fr .8fr .8fr .9fr;gap:6px;margin:2.5mm 0;flex:0 0 auto}.schoolCard{background:#174f5b;color:#fff;border-radius:9px;padding:7px 11px}.schoolCard small{display:block;color:#cce1df;font-size:7px}.schoolCard b{display:block;font-size:11px;margin-top:2px}.m{border:1px solid #d4e4e1;border-radius:9px;background:#fbfdfd;padding:6px 4px;text-align:center}.m small{display:block;color:#829295;font-size:7px}.m b{display:block;color:#284e55;font-size:8.5px;margin-top:2px}.status{background:#f0f8f5;border:1px solid #d0e7df;border-radius:8px;padding:6px 9px;margin-bottom:5px;font-size:8px;flex:0 0 auto}.status b{color:#087965}.reportBody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center}.tableWrap{border:1px solid #bfd6d2;border-radius:9px;overflow:hidden;margin:0}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8px}th{background:#176b79;color:#fff;padding:6px 4px}td{padding:5px 6px;border-top:1px solid #dce9e7;border-left:1px solid #dce9e7;vertical-align:top;line-height:1.4;overflow-wrap:anywhere}tbody tr:nth-child(even){background:#f8fbfa}.sub{font-weight:900;color:#08766d}.empty{color:#9ba9aa}.detail{display:block;margin-top:3px;color:#51686d}.sign{display:grid;grid-template-columns:1fr 1fr;gap:80px;margin:6px 20mm 0;text-align:center;font-size:8px}.line{border-bottom:1px solid #71878b;width:58%;height:11px;margin:auto}.foot{text-align:center;border-top:1px solid #e2ecea;color:#849496;font-size:6.5px;margin-top:5px;padding-top:3px}.loading{text-align:center;padding:70px 10px;font-size:18px}@media(max-width:900px){body{background:#fff;overflow-x:auto}.sheet{width:100%;height:auto;min-height:70vw;margin:0 0 12px;box-shadow:none}.page{padding:22px 8px 10px;min-height:70vw}.head{grid-template-columns:88px 1fr 76px;gap:4px}.logo img{width:82px;height:50px}.title h1{font-size:13px}.infoBand{grid-template-columns:1.3fr .8fr .8fr .9fr}.reportBody{min-height:35vw}table{font-size:6.2px}}@media print{html,body{background:#fff;margin:0;padding:0}.tools{display:none}.sheet{width:297mm;height:210mm;margin:0;box-shadow:none;overflow:hidden;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.page{height:210mm;padding:18mm 8mm 4mm}.reportBody{flex:1 1 auto;justify-content:center}@page{size:A4 landscape;margin:0}}</style></head><body><div class="tools"><button onclick="window.print()">طباعة / حفظ PDF كامل</button></div><div id="reports"><div class="loading">جاري تحميل تقرير الأسبوع الكامل...</div></div><script>
const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/weekly-plan-api',q=new URLSearchParams(location.search),admin=q.get('admin'),week=Number(q.get('week')||1),term=q.get('term')||'الفصل الدراسي الأول',grades=['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'];const base=['القرآن الكريم','الدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];function subjects(g){return ['الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'].includes(g)?[...base,'الدراسات الاجتماعية','المهارات الرقمية']:base}function weekName(n){const a=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر'];return 'الأسبوع '+(a[n]||n)}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر تحميل التقرير');return d}function splitLegacy(rows){const out=rows.filter(e=>e.subject!=='القرآن الكريم والدراسات الإسلامية').map(e=>({...e}));const old=rows.find(e=>e.subject==='القرآن الكريم والدراسات الإسلامية');if(old){if(!out.some(e=>e.subject==='القرآن الكريم'))out.push({...old,subject:'القرآن الكريم'});if(!out.some(e=>e.subject==='الدراسات الإسلامية'))out.push({...old,subject:'الدراسات الإسلامية'})}return out}function lessonText(x){const main=(x.lessons||[]).join('، '),detail=(x.manual_lessons||'').trim();if(main&&detail)return main+`<span class="detail">تفاصيل: ${detail}</span>`;return main||detail||'—'}function page(s,parts,g){const subs=subjects(g),rows=splitLegacy(parts.filter(x=>x.grade===g)),done=new Set(rows.map(x=>x.subject));return `<section class="sheet"><main class="page"><header class="head"><div class="logo"><img src="Moelogo.jpg?v=3"></div><div class="title"><span class="tag">الخطة التعليمية الأسبوعية</span><h1>الخطة الأسبوعية الموحدة</h1><p>تقرير المدرسة الأسبوعي — صفحة مستقلة لكل صف</p></div><div class="week"><small>الأسبوع الدراسي</small><b>${weekName(week)}</b></div></header><section class="infoBand"><div class="schoolCard"><small>المدرسة</small><b>${s.name}</b></div><div class="m"><small>المرحلة</small><b>الابتدائية</b></div><div class="m"><small>الصف</small><b>${g}</b></div><div class="m"><small>الفصل الدراسي</small><b>${term}</b></div></section><div class="status"><b>اكتمال الخطة:</b> ${done.size} من ${subs.length} مواد — ${done.size>=subs.length?'مكتملة':'بانتظار '+Math.max(0,subs.length-done.size)+' مادة'}</div><div class="reportBody"><div class="tableWrap"><table><thead><tr><th style="width:15%">المادة</th><th style="width:15%">المعلم/ة</th><th style="width:34%">الدروس / الموضوعات</th><th style="width:23%">الواجبات والتكليفات</th><th style="width:13%">ملاحظات</th></tr></thead><tbody>${subs.map(sub=>{const x=rows.find(e=>e.subject===sub);return x?`<tr><td class="sub">${sub}</td><td><b>${x.teacher||'—'}</b></td><td>${lessonText(x)}</td><td>${x.homework||'—'}</td><td>${x.notes||'—'}</td></tr>`:`<tr><td class="sub">${sub}</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">لم تُعبأ</td></tr>`}).join('')}</tbody></table></div><div class="sign"><div><b>إعداد ومتابعة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot">${g}</div></div></main></section>`}async function load(){try{if(!admin)throw Error('رابط التقرير غير مكتمل');const s=await api({action:'school',admin}),parts=await api({action:'list',admin,week,term});reports.innerHTML=grades.map(g=>page(s,parts,g)).join('')}catch(e){reports.innerHTML='<div class="loading">'+e.message+'</div>'}}load();
</script></body></html>
