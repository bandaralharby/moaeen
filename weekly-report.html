<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية النهائية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eff1;font-family:Tahoma,Arial,sans-serif;color:#183b43}.tools{position:sticky;top:0;z-index:10;background:#123f4b;padding:11px;text-align:center}.tools button{border:0;border-radius:22px;background:#fff;color:#123f4b;padding:10px 26px;font-weight:900;cursor:pointer}.page{width:297mm;min-height:210mm;margin:12px auto;background:#fff;padding:0 9mm 7mm;box-shadow:0 8px 30px #48646d30}.identityBar{height:6px;background:linear-gradient(90deg,#12a889,#28b67e,#3fc178)}.head{display:grid;grid-template-columns:150px 1fr 150px;align-items:center;padding:7mm 2mm 5mm;border-bottom:1px solid #d8e8e5}.logoBox{text-align:right}.logoBox img{width:132px;height:66px;object-fit:contain}.headCenter{text-align:center}.eyebrow{display:inline-block;color:#128b75;background:#edf9f5;border-radius:20px;padding:4px 14px;font-size:8px;font-weight:900;margin-bottom:5px}.headCenter h1{margin:0;font-size:22px;color:#123f4b}.headCenter p{margin:5px 0 0;font-size:9px;color:#6e8589}.weekBox{justify-self:end;width:132px;border:1px solid #c9e2dc;border-radius:14px;background:linear-gradient(145deg,#f8fdfb,#eef8f5);padding:10px;text-align:center}.weekBox small{display:block;font-size:7px;color:#78908f;margin-bottom:3px}.weekBox b{font-size:11px;color:#087866}.schoolBand{display:flex;justify-content:space-between;align-items:center;background:#123f4b;color:#fff;margin:4mm 0 3mm;border-radius:10px;padding:7px 12px}.schoolBand .school{font-size:12px;font-weight:900}.schoolBand .caption{font-size:8px;color:#cde5e2}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}.m{border:1px solid #d7e6e3;border-radius:9px;background:#fbfdfd;padding:6px 9px}.m small{display:block;color:#7a8e91;font-size:7px;margin-bottom:2px}.m b{font-size:9px;color:#234b52}.status{display:flex;align-items:center;gap:7px;background:#f0f9f6;border:1px solid #d0e9e1;border-radius:9px;padding:6px 9px;margin:5px 0 7px;font-size:8px}.status:before{content:'✓';display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#13a27f;color:#fff;font-weight:900}.status b{color:#087864}.tableWrap{border:1px solid #bfd6d2;border-radius:11px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7.8px}thead{display:table-header-group}thead th{background:#126779;color:#fff;padding:7px 5px;border-left:1px solid #ffffff30;font-weight:900}tbody td{padding:5px 6px;border-top:1px solid #dce9e7;border-left:1px solid #dce9e7;vertical-align:top;line-height:1.5;overflow-wrap:anywhere}tbody tr:nth-child(even){background:#f7fbfa}tbody tr{break-inside:avoid;page-break-inside:avoid}.sub{font-weight:900;color:#08766d}.unit{display:block;color:#768b8d;font-size:6.6px;margin-top:2px}.empty{color:#9ca9ab}.sign{display:grid;grid-template-columns:1fr 1fr;gap:90px;margin:9px 20mm 0;text-align:center;font-size:8px;break-inside:avoid}.sign b{color:#31565c}.line{border-bottom:1px solid #6e878b;width:60%;height:14px;margin:auto}.foot{border-top:1px solid #e2ecea;text-align:center;color:#819295;font-size:6.5px;margin-top:7px;padding-top:5px}@media(max-width:900px){.page{width:100%;min-height:100vh;margin:0;padding:0 11px 12px}.head{grid-template-columns:100px 1fr 100px;padding-top:18px}.logoBox img{width:94px;height:50px}.weekBox{width:95px}.headCenter h1{font-size:16px}.schoolBand{margin-top:12px}.tableWrap{overflow-x:auto}table{min-width:850px}}@media print{body{background:#fff}.tools{display:none}.page{margin:0;box-shadow:none;width:100%;min-height:0;padding:0 5mm 4mm}.identityBar{height:5px}.head{padding:4mm 2mm 3mm}.schoolBand{margin:2mm 0}.tableWrap{overflow:visible}table{font-size:8px}.sign{page-break-inside:avoid}@page{size:A4 landscape;margin:6mm}}</style></head><body><div class="tools"><button onclick="window.print()">طباعة / حفظ PDF</button></div><main class="page"><div class="identityBar"></div><header class="head"><div class="logoBox"><img src="https://www.moe.gov.sa/_layouts/15/MOE/PortalAssets/images/logo.png" alt="وزارة التعليم"></div><div class="headCenter"><div class="eyebrow">الخطة التعليمية الأسبوعية</div><h1>الخطة الأسبوعية الموحدة</h1><p>نموذج موحد لمتابعة وتنظيم الخطة الدراسية</p></div><div class="weekBox"><small>الأسبوع الدراسي</small><b id="week">الأسبوع</b></div></header><div class="schoolBand"><div><div class="caption">المدرسة</div><div class="school" id="school">اسم المدرسة</div></div><div class="caption">وزارة التعليم</div></div><section class="meta" id="meta"></section><div class="status" id="status"></div><div class="tableWrap"><table><thead><tr><th style="width:15%">المادة</th><th style="width:15%">المعلم/ة</th><th style="width:34%">الدروس / الموضوعات</th><th style="width:23%">الواجبات والتكليفات</th><th style="width:13%">ملاحظات</th></tr></thead><tbody id="rows"></tbody></table></div><div class="sign"><div><b>إعداد ومتابعة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot">تم إعداد الخطة الأسبوعية إلكترونيًا عبر أنجز AI</div></main><script>const q=new URLSearchParams(location.search),id=q.get('plan');let p=null,parts=[];try{p=JSON.parse(localStorage.getItem('anjz_weekly_'+id)||'null');parts=JSON.parse(localStorage.getItem('anjz_weekly_parts_'+id)||'[]')}catch(e){}if(!p){document.querySelector('.page').innerHTML='<h2 style="text-align:center;margin-top:80px">لم يتم العثور على بيانات الخطة على هذا الجهاز.</h2>'}else{school.textContent=p.school||'اسم المدرسة';week.textContent=p.week||'الأسبوع';meta.innerHTML=[['المرحلة',p.stage],['الصف',p.grade],['الفصل الدراسي',p.term],['بداية الأسبوع',p.start||'—']].map(x=>`<div class="m"><small>${x[0]}</small><b>${x[1]||'—'}</b></div>`).join('');const done=new Set(parts.map(x=>x.subject)),total=(p.subs||[]).length;status.innerHTML=`<span><b>اكتمال الخطة:</b> ${done.size} من ${total} مواد — ${done.size>=total?'اكتملت جميع المشاركات':'بانتظار '+Math.max(0,total-done.size)+' مادة'}</span>`;rows.innerHTML=(p.subs||[]).map(s=>{const a=parts.filter(x=>x.subject===s);if(!a.length)return `<tr><td class="sub">${s}</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">لم تُعبأ</td></tr>`;return a.map(x=>`<tr><td class="sub">${s}${x.unit?`<span class="unit">${x.unit}</span>`:''}</td><td><b>${x.teacher||'—'}</b></td><td>${(x.lessons||[]).join('، ')||x.manualLessons||'—'}</td><td>${x.homework||'—'}</td><td>${x.notes||'—'}</td></tr>`).join('')}).join('')}</script></body></html>
