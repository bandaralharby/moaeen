<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية النهائية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f4;font-family:Tahoma,Arial,sans-serif;color:#153b45}.tools{position:sticky;top:0;z-index:9;background:#153f49;padding:11px;text-align:center}.tools button{border:0;border-radius:24px;background:#fff;color:#153f49;padding:11px 28px;font-weight:900}.page{width:297mm;min-height:210mm;margin:12px auto;background:#fff;padding:0 10mm 7mm;box-shadow:0 8px 28px #45636b25}.head{display:grid;grid-template-columns:155px 1fr 155px;align-items:center;gap:12px;padding:7mm 2mm 5mm;border-top:5px solid #0b8f83;border-bottom:1px solid #d7e7e4}.logo img{width:135px;height:82px;object-fit:contain}.title{text-align:center}.title .tag{display:inline-block;padding:4px 14px;border-radius:20px;background:#edf8f4;color:#13806f;font-size:8px;font-weight:900}.title h1{margin:7px 0 3px;font-size:22px}.title p{margin:0;color:#809194;font-size:8px}.week{text-align:center;border:1px solid #cce1dd;border-radius:14px;background:#f7fbfa;padding:10px}.week small{display:block;color:#819294;font-size:7px}.week b{display:block;margin-top:4px;color:#087867;font-size:12px}.infoBand{display:grid;grid-template-columns:1.35fr .8fr .8fr .8fr;gap:6px;margin:4mm 0 3mm}.schoolCard{background:#174f5b;color:#fff;border-radius:11px;padding:9px 13px}.schoolCard small{display:block;color:#cce1df;font-size:7px}.schoolCard b{display:block;font-size:12px;margin-top:3px}.m{border:1px solid #d4e4e1;border-radius:10px;background:#fbfdfd;padding:7px 6px;text-align:center}.m small{display:block;color:#829295;font-size:7px}.m b{display:block;color:#284e55;font-size:8.5px;margin-top:3px}.status{background:#f0f8f5;border:1px solid #d0e7df;border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:8px}.status b{color:#087965}.tableWrap{border:1px solid #bfd6d2;border-radius:10px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7.8px}th{background:#176b79;color:#fff;padding:7px 5px}td{padding:5px 6px;border-top:1px solid #dce9e7;border-left:1px solid #dce9e7;vertical-align:top;line-height:1.5;overflow-wrap:anywhere}tbody tr:nth-child(even){background:#f8fbfa}.sub{font-weight:900;color:#08766d}.empty{color:#9ba9aa}.sign{display:grid;grid-template-columns:1fr 1fr;gap:90px;margin:9px 20mm 0;text-align:center;font-size:8px}.line{border-bottom:1px solid #71878b;width:58%;height:14px;margin:auto}.foot{text-align:center;border-top:1px solid #e2ecea;color:#849496;font-size:6.5px;margin-top:7px;padding-top:5px}.loading{text-align:center;padding:70px 10px;font-size:18px}@media(max-width:900px){body{background:#fff}.page{width:100%;min-height:0;margin:0;padding:0 10px 14px;box-shadow:none}.head{grid-template-columns:92px 1fr 76px;gap:4px;padding:18px 1px 14px}.logo img{width:88px;height:60px}.title h1{font-size:14px}.infoBand{grid-template-columns:1.3fr repeat(3,.85fr);gap:4px}.schoolCard b{font-size:9px}table{font-size:6.2px}th{padding:6px 2px}td{padding:5px 3px}.sign{margin:9px 5mm 0;gap:20px}}@media print{body{background:#fff}.tools{display:none}.page{width:100%;min-height:0;margin:0;box-shadow:none;padding:0 5mm 4mm}@page{size:A4 landscape;margin:6mm}}</style></head><body><div class="tools"><button onclick="window.print()">طباعة / حفظ PDF</button></div><main class="page" id="page"><div class="loading">جاري تحميل التقرير...</div></main><script>
const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/weekly-plan-api',q=new URLSearchParams(location.search),admin=q.get('admin'),week=Number(q.get('week')||1),grade=q.get('grade')||'',term=q.get('term')||'الفصل الدراسي الأول';const base=['القرآن الكريم والدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];function subjects(g){return ['الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'].includes(g)?[...base,'الدراسات الاجتماعية','المهارات الرقمية']:base}function weekName(n){const a=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر'];return 'الأسبوع '+(a[n]||n)}function stageOf(g){return g.includes('الابتدائي')?'الابتدائية':g.includes('المتوسط')?'المتوسطة':'الثانوية'}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر تحميل التقرير');return d}async function load(){try{if(!admin)throw Error('رابط التقرير غير مكتمل');const s=await api({action:'school',admin}),parts=await api({action:'list',admin,week,term}),subs=subjects(grade),done=new Set(parts.filter(x=>x.grade===grade).map(x=>x.subject));document.getElementById('page').innerHTML=`<header class="head"><div class="logo"><img src="Moelogo.jpg?v=3" alt="شعار وزارة التعليم"></div><div class="title"><span class="tag">الخطة التعليمية الأسبوعية</span><h1>الخطة الأسبوعية الموحدة</h1><p>تنظيم ومتابعة الخطة الدراسية للمدرسة</p></div><div class="week"><small>الأسبوع الدراسي</small><b>${weekName(week)}</b></div></header><section class="infoBand"><div class="schoolCard"><small>المدرسة</small><b>${s.name}</b></div><div class="m"><small>المرحلة</small><b>${stageOf(grade)}</b></div><div class="m"><small>الصف</small><b>${grade}</b></div><div class="m"><small>الفصل الدراسي</small><b>${term}</b></div></section><div class="status"><b>اكتمال الخطة:</b> ${done.size} من ${subs.length} مواد — ${done.size>=subs.length?'اكتملت جميع المشاركات':'بانتظار '+Math.max(0,subs.length-done.size)+' مادة'}</div><div class="tableWrap"><table><thead><tr><th style="width:15%">المادة</th><th style="width:15%">المعلم/ة</th><th style="width:34%">الدروس / الموضوعات</th><th style="width:23%">الواجبات والتكليفات</th><th style="width:13%">ملاحظات</th></tr></thead><tbody>${subs.map(sub=>{const x=parts.find(e=>e.grade===grade&&e.subject===sub);return x?`<tr><td class="sub">${sub}</td><td><b>${x.teacher||'—'}</b></td><td>${(x.lessons||[]).join('، ')||x.manual_lessons||'—'}</td><td>${x.homework||'—'}</td><td>${x.notes||'—'}</td></tr>`:`<tr><td class="sub">${sub}</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">لم تُعبأ</td></tr>`}).join('')}</tbody></table></div><div class="sign"><div><b>إعداد ومتابعة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot">تم إعداد الخطة الأسبوعية إلكترونيًا عبر أنجز AI</div>`}catch(e){document.getElementById('page').innerHTML='<div class="loading">'+e.message+'</div>'}}load();
</script></body></html>
