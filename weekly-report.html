<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية النهائية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f4;font-family:Tahoma,Arial,sans-serif;color:#153b45}.tools{position:sticky;top:0;z-index:9;background:#153f49;padding:11px;text-align:center}.tools button{border:0;border-radius:24px;background:#fff;color:#153f49;padding:11px 28px;font-weight:900}.sheet{width:210mm;height:297mm;margin:12px auto;background:#fff;box-shadow:0 8px 28px #45636b25;overflow:hidden}.page{width:100%;padding:8mm 9mm 6mm;transform-origin:top center}.head{display:grid;grid-template-columns:115px 1fr 110px;align-items:center;gap:9px;padding:4mm 1mm;border-top:4px solid #0b8f83;border-bottom:1px solid #d7e7e4}.logo img{width:105px;height:62px;object-fit:contain}.title{text-align:center}.title .tag{display:inline-block;padding:4px 12px;border-radius:20px;background:#edf8f4;color:#13806f;font-size:8px;font-weight:900}.title h1{margin:6px 0 2px;font-size:18px}.title p{margin:0;color:#809194;font-size:7.5px}.week{text-align:center;border:1px solid #cce1dd;border-radius:12px;background:#f7fbfa;padding:8px 4px}.week small{display:block;color:#819294;font-size:7px}.week b{display:block;margin-top:4px;color:#087867;font-size:11px}.infoBand{display:grid;grid-template-columns:1.3fr .8fr .9fr 1fr;gap:5px;margin:3mm 0}.schoolCard{background:#174f5b;color:#fff;border-radius:9px;padding:8px 10px}.schoolCard small{display:block;color:#cce1df;font-size:7px}.schoolCard b{display:block;font-size:10px;margin-top:3px}.m{border:1px solid #d4e4e1;border-radius:9px;background:#fbfdfd;padding:6px 4px;text-align:center}.m small{display:block;color:#829295;font-size:7px}.m b{display:block;color:#284e55;font-size:8px;margin-top:3px}.status{background:#f0f8f5;border:1px solid #d0e7df;border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:8px}.status b{color:#087965}.tableWrap{border:1px solid #bfd6d2;border-radius:9px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8px}th{background:#176b79;color:#fff;padding:7px 4px}td{padding:7px 5px;border-top:1px solid #dce9e7;border-left:1px solid #dce9e7;vertical-align:top;line-height:1.45;overflow-wrap:anywhere;white-space:normal}tbody tr:nth-child(even){background:#f8fbfa}.sub{font-weight:900;color:#08766d}.empty{color:#9ba9aa}.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin:8px 12mm 0;text-align:center;font-size:8px}.line{border-bottom:1px solid #71878b;width:62%;height:13px;margin:auto}.foot{text-align:center;border-top:1px solid #e2ecea;color:#849496;font-size:6.5px;margin-top:6px;padding-top:4px}.loading{text-align:center;padding:70px 10px;font-size:18px}@media(max-width:900px){body{background:#fff}.sheet{width:100%;height:auto;min-height:100vh;margin:0;box-shadow:none}.page{padding:12px 10px}.head{grid-template-columns:82px 1fr 72px}.logo img{width:78px;height:52px}.title h1{font-size:13px}.title p{font-size:6px}.week b{font-size:9px}.infoBand{grid-template-columns:1.25fr .75fr .9fr 1fr}.schoolCard b{font-size:8px}table{font-size:6.4px}th{padding:6px 2px}td{padding:5px 3px}.sign{gap:20px;margin:7px 4mm 0}}@media print{html,body{width:210mm;height:297mm;background:#fff;margin:0;padding:0;overflow:hidden}.tools{display:none}.sheet{width:210mm;height:297mm;margin:0;box-shadow:none;overflow:hidden}.page{padding:7mm 8mm 5mm}@page{size:A4 portrait;margin:0}}</style></head><body><div class="tools"><button onclick="fitPage();setTimeout(()=>window.print(),80)">طباعة / حفظ PDF</button></div><div class="sheet" id="sheet"><main class="page" id="page"><div class="loading">جاري تحميل التقرير...</div></main></div><script>
const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/weekly-plan-api',q=new URLSearchParams(location.search),admin=q.get('admin'),week=Number(q.get('week')||1),grade=q.get('grade')||'',term=q.get('term')||'الفصل الدراسي الأول';const base=['القرآن الكريم والدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];function subjects(g){return ['الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'].includes(g)?[...base,'الدراسات الاجتماعية','المهارات الرقمية']:base}function weekName(n){const a=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر'];return 'الأسبوع '+(a[n]||n)}function stageOf(g){return g.includes('الابتدائي')?'الابتدائية':g.includes('المتوسط')?'المتوسطة':'الثانوية'}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر تحميل التقرير');return d}function fitPage(){const p=document.getElementById('page'),s=document.getElementById('sheet');p.style.transform='none';p.style.width='100%';const max=s.clientHeight-2,actual=p.scrollHeight;if(actual>max){const scale=Math.max(.62,max/actual);p.style.transform=`scale(${scale})`;p.style.width=(100/scale)+'%'}else{p.style.transform='none';p.style.width='100%'}}async function load(){try{if(!admin)throw Error('رابط التقرير غير مكتمل');const s=await api({action:'school',admin}),parts=await api({action:'list',admin,week,term}),subs=subjects(grade),done=new Set(parts.filter(x=>x.grade===grade).map(x=>x.subject));document.getElementById('page').innerHTML=`<header class="head"><div class="logo"><img src="Moelogo.jpg?v=3" alt="شعار وزارة التعليم"></div><div class="title"><span class="tag">الخطة التعليمية الأسبوعية</span><h1>الخطة الأسبوعية الموحدة</h1><p>تنظيم ومتابعة الخطة الدراسية للمدرسة</p></div><div class="week"><small>الأسبوع الدراسي</small><b>${weekName(week)}</b></div></header><section class="infoBand"><div class="schoolCard"><small>المدرسة</small><b>${s.name}</b></div><div class="m"><small>المرحلة</small><b>${stageOf(grade)}</b></div><div class="m"><small>الصف</small><b>${grade}</b></div><div class="m"><small>الفصل الدراسي</small><b>${term}</b></div></section><div class="status"><b>اكتمال الخطة:</b> ${done.size} من ${subs.length} مواد — ${done.size>=subs.length?'اكتملت جميع المشاركات':'بانتظار '+Math.max(0,subs.length-done.size)+' مادة'}</div><div class="tableWrap"><table><thead><tr><th style="width:15%">المادة</th><th style="width:15%">المعلم/ة</th><th style="width:34%">الدروس / الموضوعات</th><th style="width:23%">الواجبات والتكليفات</th><th style="width:13%">ملاحظات</th></tr></thead><tbody>${subs.map(sub=>{const x=parts.find(e=>e.grade===grade&&e.subject===sub);return x?`<tr><td class="sub">${sub}</td><td><b>${x.teacher||'—'}</b></td><td>${(x.lessons||[]).join('، ')||x.manual_lessons||'—'}</td><td>${x.homework||'—'}</td><td>${x.notes||'—'}</td></tr>`:`<tr><td class="sub">${sub}</td><td class="empty">—</td><td class="empty">—</td><td class="empty">—</td><td class="empty">لم تُعبأ</td></tr>`}).join('')}</tbody></table></div><div class="sign"><div><b>إعداد ومتابعة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot">تم إعداد الخطة الأسبوعية إلكترونيًا عبر أنجز AI</div>`;requestAnimationFrame(()=>{fitPage();setTimeout(fitPage,250)})}catch(e){document.getElementById('page').innerHTML='<div class="loading">'+e.message+'</div>'}}window.addEventListener('beforeprint',fitPage);window.addEventListener('resize',()=>setTimeout(fitPage,80));load();
</script></body></html>
