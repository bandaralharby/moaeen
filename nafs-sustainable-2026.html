<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة المستدامة | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:960px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{margin:0;color:#177344}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tab{padding:13px;text-align:center;border:1px solid #dce2ea;border-radius:11px;font-weight:700}.active{background:#218b55;color:#fff}.off{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{margin-top:8px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.checks{border:1px solid #dbe3dd;border-radius:11px;overflow:hidden}.check{display:flex;gap:9px;padding:11px 13px;border-bottom:1px solid #edf0ee;line-height:1.65}.check input{width:auto;margin-top:6px}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#218b55;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.note{color:#667085;font-size:13px}.report{display:none;background:#fff;padding:24px;width:794px}.empty{padding:14px;color:#667085}.box{border:1px solid #d8dedb;border-radius:8px;padding:9px;margin:6px 0;line-height:1.7}.ttl{font-weight:700;color:#17653e;margin-top:10px}.sig{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:28px;text-align:center}.sig div{border-top:1px solid #777;padding-top:8px}.meta{display:flex;justify-content:space-between;gap:15px;margin-top:8px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>خطة نافس المستدامة</h1><div class="tabs"><div class="tab active">المهارات</div><div class="tab off">البرامج — لاحقًا</div><div class="tab off">المبادرات — لاحقًا</div></div><div class="grid"><div class="f full"><label>اسم المدرسة</label><input id="school"></div><div class="f full"><label>مديرة المدرسة</label><input id="principal"></div><div class="f full"><label>اسم المعلمة</label><input id="teacher"></div><div class="f"><label>اليوم</label><select id="day"><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option></select></div><div class="f"><label>التاريخ الهجري</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><select id="hday"></select><select id="hmonth"><option>محرم</option><option>صفر</option><option>ربيع الأول</option><option>ربيع الآخر</option><option>جمادى الأولى</option><option>جمادى الآخرة</option><option>رجب</option><option>شعبان</option><option>رمضان</option><option>شوال</option><option>ذو القعدة</option><option>ذو الحجة</option></select><select id="hyear"><option>1447</option><option selected>1448</option><option>1449</option></select></div></div><div class="f"><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6" selected>الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط (التاسع)</option></select></div><div class="f"><label>المادة</label><select id="subject" onchange="loadDomains()"></select></div><div class="f full"><label>المجال</label><select id="domain" onchange="loadSubs()"></select></div><div class="f full"><label>المجال الفرعي</label><select id="sub" onchange="loadOutcomes()"></select></div><div class="f full"><label>ناتج التعلم</label><select id="outcome" onchange="loadIndicators()"></select></div><div class="f full"><label>المهارات / المؤشرات</label><div id="indicators" class="checks"></div></div></div><p class="note">يُنشأ التقرير حسب المهارة المختارة وبصياغة استدامة تركز على التفكير العليا.</p><div class="actions"><button class="btn" onclick="pdf()">تنزيل تقرير PDF</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><section id="pdfReport" class="report"><div style="text-align:center;border-bottom:3px solid #218b55;padding-bottom:10px"><h1>تقرير خطة نافس المستدامة</h1><div class="meta"><span id="rmeta"></span><span id="rdate"></span></div></div><div id="reportBody"></div></section><script src="nafs-ms-data.js"></script><script src="nafs-corrections-2026.js?v=1"></script><script src="nafs-reading-data.js"></script><script src="nafs-pdf.js?v=1"></script><script>const $=id=>document.getElementById(id);let rows=[],domainValues=[],subValues=[],outcomeRows=[];function data(s,g){return s==='reading'?(window.NAFS_READING?.[g]||[]):(window.NAFS_MS?.[s]?.[g]||[])}function subjects(){const g=$('grade').value,a=[];if(data('reading',g).length)a.push(['reading','القراءة']);if(data('math',g).length)a.push(['math','الرياضيات']);if(data('science',g).length)a.push(['science','العلوم الطبيعية']);return a}function loadSubjects(){$('subject').innerHTML=subjects().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');loadDomains()}function split(v){const p=String(v||'').split(' — ');return{domain:p[0]||'',sub:p.slice(1).join(' — ')||''}}function loadDomains(){rows=data($('subject').value,$('grade').value);domainValues=[...new Set(rows.map(r=>split(r[0]).domain))];$('domain').innerHTML=domainValues.map(x=>`<option>${x}</option>`).join('');loadSubs()}function loadSubs(){const d=$('domain').value;subValues=[...new Set(rows.filter(r=>split(r[0]).domain===d).map(r=>split(r[0]).sub||d))];$('sub').innerHTML=subValues.map(x=>`<option>${x}</option>`).join('');loadOutcomes()}function loadOutcomes(){const d=$('domain').value,s=$('sub').value;outcomeRows=rows.filter(r=>{const x=split(r[0]);return x.domain===d&&(x.sub||d)===s});$('outcome').innerHTML=outcomeRows.map((r,i)=>`<option value="${i}">${r[1]}</option>`).join('');loadIndicators()}function row(){return outcomeRows[+$('outcome').value]||null}function loadIndicators(){const r=row();$('indicators').innerHTML=r?.[2]?.map((x,i)=>`<label class="check"><input type="checkbox" value="${i}"><span>${x}</span></label>`).join('')||'<div class="empty">لا توجد مؤشرات.</div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function hdate(){return `${$('hday').value} ${$('hmonth').value} ${$('hyear').value} هـ`}function profile(skill,subj){const x=skill;let hot='التحليل، الاستدلال، التقويم، الإبداع',act='مهام أدائية ومواقف حياتية وأسئلة مفتوحة تتطلب تفسير الإجابة وتبريرها.';if(subj==='الرياضيات'){hot='حل المشكلات، الاستدلال الرياضي، التحليل، التقويم';act='مسائل غير روتينية ومواقف حياتية متعددة الحلول، مع تفسير خطوات الحل ومقارنة الاستراتيجيات والتحقق من معقولية الناتج.'}else if(subj==='القراءة'){hot='الاستدلال، التحليل، النقد، التقويم';act='نصوص متنوعة وأسئلة استنتاج ومقارنة ونقد وتبرير، مع توظيف الدليل من النص في مواقف جديدة.'}else if(subj==='العلوم الطبيعية'){hot='الاستقصاء، الاستدلال العلمي، التحليل، التقويم';act='مواقف استقصائية وتفسير بيانات ونتائج وتجارب، وبناء تفسيرات علمية مدعومة بالأدلة.'}return{hot,act,goal:`استدامة إتقان المهارة «${x}» وتوسيع توظيفها في مواقف جديدة تتطلب مستويات تفكير أعلى.`,success:`استمرار إتقان المهارة «${x}» في القياسات الدورية وقدرة الطالبات على توظيفها باستقلالية في مهام جديدة.`}}async function pdf(){const r=row();if(!r)return;const sel=[...document.querySelectorAll('#indicators input:checked')].map(x=>r[2][+x.value]);if(!sel.length)return alert('اختر مهارة أو مؤشرًا واحدًا على الأقل');const g=$('grade').selectedOptions[0].text,s=$('subject').selectedOptions[0].text,d=$('domain').value,sd=$('sub').value,sc=$('school').value,t=$('teacher').value,p=$('principal').value,dy=$('day').value,dt=hdate();$('rmeta').textContent=`${sc||'المدرسة'} | ${g} | ${s}`;$('rdate').textContent=`اليوم: ${dy} | التاريخ: ${dt}`;const blocks=sel.map(skill=>{const q=profile(skill,s);return `<div class="ttl">المهارة المستهدفة للاستدامة</div><div class="box">${esc(skill)}</div><div class="ttl">هدف الاستدامة</div><div class="box">${esc(q.goal)}</div><div class="ttl">مهارات التفكير العليا المرتبطة بها</div><div class="box">${q.hot}</div><div class="ttl">إجراءات وأنشطة الاستدامة</div><div class="box">${q.act} مع أنشطة إثرائية وتغذية راجعة دورية.</div><div class="ttl">مؤشر النجاح</div><div class="box">${esc(q.success)}</div>`}).join('');$('reportBody').innerHTML=`<div class="ttl">المجال / المجال الفرعي</div><div class="box">${esc(d)} — ${esc(sd)}</div><div class="ttl">ناتج التعلم</div><div class="box">${esc(r[1])}</div>${blocks}<div class="ttl">أدوات القياس والمتابعة</div><div class="box">مهام أدائية، أسئلة تفكير عليا، اختبارات قصيرة، ملاحظة الأداء، تحليل النتائج وملف الإنجاز.</div><div class="sig"><div>المعلمة<br><b>${esc(t||'........................')}</b></div><div>مديرة المدرسة<br><b>${esc(p||'........................')}</b></div></div>`;await NAFS_PDF.download($('pdfReport'),'خطة-نافس-المستدامة.pdf')}$('hday').innerHTML=Array.from({length:30},(_,i)=>`<option>${i+1}</option>`).join('');loadSubjects();</script></body></html>
