<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة المستدامة | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:960px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{margin:0;color:#177344}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tab{padding:13px;text-align:center;border:1px solid #dce2ea;border-radius:11px;font-weight:700}.active{background:#218b55;color:#fff}.off{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{margin-top:8px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}select{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.checks{border:1px solid #dbe3dd;border-radius:11px;overflow:hidden}.check{display:flex;gap:9px;padding:11px 13px;border-bottom:1px solid #edf0ee;line-height:1.65}.check:last-child{border:0}.check input{margin-top:6px}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#218b55;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.note{color:#667085;font-size:13px}.report{display:none}.empty{padding:14px;color:#667085}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}@media print{.chooser{display:none}.report{display:block}.head{text-align:center;border-bottom:3px solid #218b55;padding-bottom:12px}.box{border:1px solid #ccc;border-radius:8px;padding:9px;margin:8px 0}.ttl{font-weight:700;color:#17653e;margin-top:12px}@page{size:A4;margin:14mm}}</style></head><body><div class="wrap chooser"><div class="card"><h1>خطة نافس المستدامة</h1><div class="tabs"><div class="tab active">المهارات</div><div class="tab off">البرامج — لاحقًا</div><div class="tab off">المبادرات — لاحقًا</div></div><div class="grid"><div class="f"><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6" selected>الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط (التاسع)</option></select></div><div class="f"><label>المادة</label><select id="subject" onchange="loadDomains()"></select></div><div class="f full"><label>المجال</label><select id="domain" onchange="loadSubs()"></select></div><div class="f full"><label>المجال الفرعي</label><select id="sub" onchange="loadOutcomes()"></select></div><div class="f full"><label>ناتج التعلم</label><select id="outcome" onchange="loadIndicators()"></select></div><div class="f full"><label>المهارات / المؤشرات</label><div id="indicators" class="checks"></div></div></div><p class="note">المجالات ونواتج التعلم والمؤشرات مأخوذة من وثيقة نواتج التعلم للاختبارات الوطنية 2026.</p><div class="actions"><button class="btn" onclick="pdf()">إنشاء تقرير PDF</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><section class="wrap report"><div class="head"><h1>تقرير خطة نافس المستدامة</h1></div><div id="reportBody"></div></section><script src="nafs-ms-data.js"></script><script src="nafs-corrections-2026.js?v=1"></script><script src="nafs-reading-data.js"></script><script>const $=id=>document.getElementById(id);let rows=[],domainValues=[],subValues=[],outcomeRows=[];function data(s,g){if(s==='reading')return window.NAFS_READING?.[g]||[];return window.NAFS_MS?.[s]?.[g]||[]}function subjects(){const g=$('grade').value,a=[];if(data('reading',g).length)a.push(['reading','القراءة']);if(data('math',g).length)a.push(['math','الرياضيات']);if(data('science',g).length)a.push(['science','العلوم الطبيعية']);return a}function loadSubjects(){$('subject').innerHTML=subjects().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');loadDomains()}function current(){return data($('subject').value,$('grade').value)}function split(v){const p=String(v||'').split(' — ');return{domain:p[0]||'',sub:p.slice(1).join(' — ')||''}}function loadDomains(){rows=current();domainValues=[...new Set(rows.map(r=>split(r[0]).domain))];$('domain').innerHTML=domainValues.map((x,i)=>`<option value="${i}">${x}</option>`).join('');loadSubs()}function loadSubs(){const d=domainValues[$('domain').selectedIndex]||'';subValues=[...new Set(rows.filter(r=>split(r[0]).domain===d).map(r=>split(r[0]).sub||d))];$('sub').innerHTML=subValues.map((x,i)=>`<option value="${i}">${x}</option>`).join('');loadOutcomes()}function loadOutcomes(){const d=domainValues[$('domain').selectedIndex]||'',s=subValues[$('sub').selectedIndex]||'';outcomeRows=rows.filter(r=>{const x=split(r[0]);return x.domain===d&&(x.sub||d)===s});$('outcome').innerHTML=outcomeRows.map((r,i)=>`<option value="${i}">${r[1]}</option>`).join('');loadIndicators()}function selectedRow(){return outcomeRows[$('outcome').selectedIndex]||null}function loadIndicators(){const r=selectedRow();$('indicators').innerHTML=r&&r[2]?.length?r[2].map((x,i)=>`<label class="check"><input type="checkbox" value="${i}"><span>${x}</span></label>`).join(''):'<div class="empty">لا توجد مؤشرات.</div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function pdf(){const r=selectedRow();if(!r)return;const sel=[...document.querySelectorAll('#indicators input:checked')].map(x=>r[2][+x.value]);if(!sel.length){alert('اختر مهارة أو مؤشرًا واحدًا على الأقل');return}const g=$('grade').options[$('grade').selectedIndex]?.text||'',s=$('subject').options[$('subject').selectedIndex]?.text||'',d=domainValues[$('domain').selectedIndex]||'',sd=subValues[$('sub').selectedIndex]||'';$('reportBody').innerHTML=`<div class="ttl">الصف</div><div class="box">${esc(g)}</div><div class="ttl">المادة</div><div class="box">${esc(s)}</div><div class="ttl">المجال</div><div class="box">${esc(d)}</div><div class="ttl">المجال الفرعي</div><div class="box">${esc(sd)}</div><div class="ttl">ناتج التعلم</div><div class="box">${esc(r[1])}</div><div class="ttl">المهارات / المؤشرات المختارة</div>${sel.map(x=>`<div class="box">• ${esc(x)}</div>`).join('')}`;window.print()}loadSubjects();</script></body></html>
