<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة المستدامة | نافس</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Tahoma,Arial}.wrap{max-width:960px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:22px}h1{margin:0;color:#177344}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tab{padding:13px;text-align:center;border:1px solid #dce2ea;border-radius:11px;font-weight:700}.active{background:#218b55;color:#fff}.off{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.f{margin-top:8px}.full{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}select,input{width:100%;padding:12px;border:1px solid #d4dbe5;border-radius:10px;background:#fff;font:inherit}.checks{border:1px solid #dbe3dd;border-radius:11px;overflow:hidden}.check{display:flex;gap:9px;padding:11px 13px;border-bottom:1px solid #edf0ee;line-height:1.65}.check input{width:auto;margin-top:6px}.actions{display:flex;gap:9px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#218b55;color:#fff;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.back{background:#edf0f5;color:#344054}.note{color:#667085;font-size:13px}.report{display:none;background:#fff;padding:0;width:794px;font-size:12.5px;line-height:1.4;border:1px solid #dfe9e3}.rhead{background:linear-gradient(135deg,#146c43,#279861);color:#fff;padding:17px 24px 14px;position:relative}.rhead:after{content:'';position:absolute;bottom:-5px;right:24px;width:72px;height:5px;background:#d9b45b;border-radius:4px}.rhead h1{color:#fff;font-size:23px;margin:0 0 5px}.rsub{font-size:11px;opacity:.92}.metaCards{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px;padding:11px 20px 6px}.metaCard{background:#f5faf7;border:1px solid #dcebe2;border-radius:9px;padding:6px 9px}.metaCard b{display:block;color:#17653e;font-size:10px;margin-bottom:2px}.rbody{padding:2px 20px 12px}.section{margin-top:6px;border:1px solid #e1e8e4;border-radius:9px;overflow:hidden}.stitle{display:flex;align-items:center;gap:7px;background:#f3f8f5;color:#17653e;font-weight:700;padding:5px 8px}.ico{width:24px;height:24px;border-radius:7px;background:#218b55;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:0 0 24px}.scontent{padding:6px 9px;background:#fff}.skillHero{border-right:4px solid #d9b45b;background:#fffaf0}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.sig{display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:12px;text-align:center}.sig div{border-top:1px solid #aeb9b2;padding-top:5px}.footer{text-align:center;color:#718078;font-size:9px;margin-top:7px}.empty{padding:14px;color:#667085}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>خطة نافس المستدامة</h1><div class="tabs"><div class="tab active">المهارات</div><div class="tab off">البرامج — لاحقًا</div><div class="tab off">المبادرات — لاحقًا</div></div><div class="grid"><div class="f full"><label>اسم المدرسة</label><input id="school"></div><div class="f full"><label>مديرة المدرسة</label><input id="principal"></div><div class="f full"><label>اسم المعلمة</label><input id="teacher"></div><div class="f"><label>اليوم</label><select id="day"><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option></select></div><div class="f"><label>التاريخ الهجري</label><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px"><select id="hday"></select><select id="hmonth"><option>محرم</option><option>صفر</option><option>ربيع الأول</option><option>ربيع الآخر</option><option>جمادى الأولى</option><option>جمادى الآخرة</option><option>رجب</option><option>شعبان</option><option>رمضان</option><option>شوال</option><option>ذو القعدة</option><option>ذو الحجة</option></select><select id="hyear"><option>1447</option><option selected>1448</option><option>1449</option></select></div></div><div class="f"><label>الصف</label><select id="grade" onchange="loadSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6" selected>الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط (التاسع)</option></select></div><div class="f"><label>المادة</label><select id="subject" onchange="loadDomains()"></select></div><div class="f full"><label>المجال</label><select id="domain" onchange="loadSubs()"></select></div><div class="f full"><label>المجال الفرعي</label><select id="sub" onchange="loadOutcomes()"></select></div><div class="f full"><label>ناتج التعلم</label><select id="outcome" onchange="loadIndicators()"></select></div><div class="f full"><label>المهارات / المؤشرات</label><div id="indicators" class="checks"></div></div></div><p class="note">يُنشأ التقرير حسب المهارة المختارة وبصياغة استدامة تركز على التفكير العليا.</p><div class="actions"><button class="btn" onclick="pdf()">تنزيل تقرير PDF</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><section id="pdfReport" class="report"><header class="rhead"><h1>تقرير خطة نافس المستدامة</h1><div class="rsub">تعزيز الإتقان • تنمية مهارات التفكير العليا • استدامة أثر التعلم</div></header><div id="metaCards" class="metaCards"></div><div id="reportBody" class="rbody"></div></section><script src="nafs-ms-data.js"></script><script src="nafs-corrections-2026.js?v=1"></script><script src="nafs-reading-data.js"></script><script src="nafs-pdf.js?v=4"></script><script>const $=id=>document.getElementById(id);let rows=[],domainValues=[],subValues=[],outcomeRows=[];function data(s,g){return s==='reading'?(window.NAFS_READING?.[g]||[]):(window.NAFS_MS?.[s]?.[g]||[])}function subjects(){const g=$('grade').value,a=[];if(data('reading',g).length)a.push(['reading','القراءة']);if(data('math',g).length)a.push(['math','الرياضيات']);if(data('science',g).length)a.push(['science','العلوم الطبيعية']);return a}function loadSubjects(){$('subject').innerHTML=subjects().map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');loadDomains()}function split(v){const p=String(v||'').split(' — ');return{domain:p[0]||'',sub:p.slice(1).join(' — ')||''}}function loadDomains(){rows=data($('subject').value,$('grade').value);domainValues=[...new Set(rows.map(r=>split(r[0]).domain))];$('domain').innerHTML=domainValues.map(x=>`<option>${x}</option>`).join('');loadSubs()}function loadSubs(){const d=$('domain').value;subValues=[...new Set(rows.filter(r=>split(r[0]).domain===d).map(r=>split(r[0]).sub||d))];$('sub').innerHTML=subValues.map(x=>`<option>${x}</option>`).join('');loadOutcomes()}function loadOutcomes(){const d=$('domain').value,s=$('sub').value;outcomeRows=rows.filter(r=>{const x=split(r[0]);return x.domain===d&&(x.sub||d)===s});$('outcome').innerHTML=outcomeRows.map((r,i)=>`<option value="${i}">${r[1]}</option>`).join('');loadIndicators()}function row(){return outcomeRows[+$('outcome').value]||null}function loadIndicators(){const r=row();$('indicators').innerHTML=r?.[2]?.map((x,i)=>`<label class="check"><input type="checkbox" value="${i}"><span>${x}</span></label>`).join('')||'<div class="empty">لا توجد مؤشرات.</div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function hdate(){return `${$('hday').value} ${$('hmonth').value} ${$('hyear').value} هـ`}function sec(icon,title,content,cls=''){return `<div class="section ${cls}"><div class="stitle"><span class="ico">${icon}</span>${title}</div><div class="scontent">${content}</div></div>`}function profile(skill,subj){let hot='التحليل، الاستدلال، التقويم، الإبداع',act='مهام أدائية ومواقف حياتية وأسئلة مفتوحة تتطلب تفسير الإجابة وتبريرها.';if(subj==='الرياضيات'){hot='حل المشكلات، الاستدلال الرياضي، التحليل، التقويم';act='مسائل غير روتينية ومواقف حياتية، مع تفسير خطوات الحل ومقارنة الاستراتيجيات والتحقق من الناتج.'}else if(subj==='القراءة'){hot='الاستدلال، التحليل، النقد، التقويم';act='نصوص متنوعة وأسئلة استنتاج ومقارنة ونقد وتبرير، مع توظيف الدليل من النص في مواقف جديدة.'}else if(subj==='العلوم الطبيعية'){hot='الاستقصاء، الاستدلال العلمي، التحليل، التقويم';act='مواقف استقصائية وتفسير بيانات ونتائج، وبناء تفسيرات علمية مدعومة بالأدلة.'}return{hot,act,goal:`استدامة إتقان المهارة «${skill}» وتوسيع توظيفها في مواقف جديدة تتطلب تفكيرًا أعلى.`,success:`استمرار إتقان المهارة «${skill}» في القياسات الدورية وتوظيفها باستقلالية في مهام جديدة.`}}async function pdf(){const r=row();if(!r)return;const sel=[...document.querySelectorAll('#indicators input:checked')].map(x=>r[2][+x.value]);if(!sel.length)return alert('اختر مهارة أو مؤشرًا واحدًا على الأقل');const g=$('grade').selectedOptions[0].text,s=$('subject').selectedOptions[0].text,d=$('domain').value,sd=$('sub').value,sc=$('school').value,t=$('teacher').value,p=$('principal').value,dy=$('day').value,dt=hdate();$('metaCards').innerHTML=`<div class="metaCard"><b>🏫 المدرسة</b>${esc(sc||'—')}</div><div class="metaCard"><b>📚 الصف والمادة</b>${esc(g)} • ${esc(s)}</div><div class="metaCard"><b>📅 اليوم والتاريخ</b>${esc(dy)} • ${esc(dt)}</div>`;let blocks='';sel.forEach(skill=>{const q=profile(skill,s);blocks+=sec('★','المهارة المستهدفة للاستدامة',esc(skill),'skillHero')+`<div class="two">${sec('◎','هدف الاستدامة',esc(q.goal))}${sec('◆','مهارات التفكير العليا',q.hot)}</div>`+sec('↗','إجراءات وأنشطة الاستدامة',q.act)+sec('✓','مؤشر النجاح',esc(q.success))});$('reportBody').innerHTML=sec('▦','المجال والمسار',`${esc(d)} <b>←</b> ${esc(sd)}`)+sec('🎯','ناتج التعلم',esc(r[1]))+blocks+sec('⌁','أدوات القياس والمتابعة','مهام أدائية، أسئلة تفكير عليا، اختبارات قصيرة، ملاحظة الأداء وتحليل النتائج.')+`<div class="sig"><div>المعلمة<br><b>${esc(t||'........................')}</b></div><div>مديرة المدرسة<br><b>${esc(p||'........................')}</b></div></div><div class="footer">خطة نافس المستدامة • تقرير مبني على المهارة المختارة</div>`;await NAFS_PDF.download($('pdfReport'),'خطة-نافس-المستدامة.pdf')}$('hday').innerHTML=Array.from({length:30},(_,i)=>`<option>${i+1}</option>`).join('');loadSubjects();</script></body></html>
