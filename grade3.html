<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أنجز AI | منهج ثالث ابتدائي</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:900;color:#5538c8}.brand span{background:#eee9ff;border-radius:999px;padding:6px 10px}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero{text-align:center;padding:36px 0 22px}.hero h1{font-size:clamp(30px,6vw,50px);margin:8px}.hero p{color:#716d83}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e9e6f3;border-radius:18px;padding:20px;cursor:pointer}.card:hover{border-color:#684ae1}.card b{display:block;font-size:18px;margin-bottom:8px}.card small{color:#777286;line-height:1.7}.details{display:none;background:#fff;border:1px solid #e6e2f0;border-radius:20px;padding:22px;margin-top:18px}.details.show{display:block}.unit{background:#faf9fe;border:1px solid #ebe8f4;border-radius:14px;padding:15px;margin:10px 0}.unit b{color:#5538c8}.unit p{line-height:1.9;margin:7px 0 0;color:#555}.note{margin-top:20px;background:#eef9f3;border:1px solid #ccebd9;border-radius:12px;padding:13px;color:#2e6846}@media(max-width:720px){.subjects{grid-template-columns:1fr 1fr}}@media(max-width:480px){.subjects{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز <span>AI</span></div><a class="back" href="index.html">الرئيسية</a></div><section class="hero"><h1>منهج الصف الثالث الابتدائي</h1><p>الفصل الدراسي الأول — اختر المادة لعرض محتواها.</p></section><div class="subjects" id="subjects"></div><div class="details" id="details"></div><div class="note">تم بناء هذه النسخة من فهارس كتب الصف الثالث المرسلة، ويمكن توسيعها لاحقًا وربطها بأدوات التحليل والتقارير.</div></div><script>const data=[{n:'الدراسات الإسلامية',i:'🕌',d:'القرآن الكريم، التوحيد، الفقه والسلوك',u:[['التوحيد','مراتب الدين؛ أركان الإسلام؛ شهادة أن لا إله إلا الله؛ شهادة أن محمدًا رسول الله؛ إقام الصلاة؛ إيتاء الزكاة؛ صوم رمضان؛ حج بيت الله الحرام'],['الفقه والسلوك','آداب قضاء الحاجة؛ إزالة النجاسة عن البدن والملابس ومكان الصلاة؛ التيمم؛ مكانة الصلاة؛ شروط الصلاة؛ آداب دخول المسجد والخروج منه؛ صلاة الجماعة']]},{n:'لغتي',i:'📚',d:'وحدات القراءة واللغة والتواصل',u:[['الوحدة الأولى','التعامل مع الآخرين'],['الوحدة الثانية','ربوع من بلادي'],['الوحدة الثالثة','أخلاق المسلم'],['الوحدة الرابعة','وسائل الاتصالات']]},{n:'الرياضيات',i:'➗',d:'الأعداد والعمليات والضرب',u:[['الفصل 1: القيمة المنزلية','الأنماط العددية؛ مهارة حل المسألة؛ القيمة المنزلية ضمن الألوف؛ مقارنة الأعداد؛ ترتيب الأعداد؛ التقريب'],['الفصل 2: الجمع','خصائص الجمع؛ تقدير نواتج الجمع؛ جمع الأعداد المكونة من رقمين؛ جمع الأعداد المكونة من ثلاثة أرقام'],['الفصل 3: الطرح','طرح الأعداد المكونة من رقمين؛ تقدير نواتج الطرح؛ الطرح مع وجود الأصفار؛ تحديد العملية المناسبة'],['الفصل 4: الضرب (1)','معنى الضرب؛ الشبكات وعملية الضرب؛ الضرب في 2 و4 و5 و10؛ استقصاء حل المسألة؛ الضرب في الصفر والواحد'],['الفصل 5: الضرب (2)','جدول الضرب؛ الضرب في 3 و6 و7 و8 و9؛ الخاصية التجميعية؛ استقصاء حل المسألة']]},{n:'العلوم',i:'🔬',d:'المخلوقات الحية والأنظمة البيئية والأرض',u:[['الوحدة الأولى: المخلوقات الحية','المخلوقات الحية وحاجاتها؛ النباتات وأجزاؤها؛ دورات حياة النباتات؛ دورات حياة الحيوانات'],['الوحدة الثانية: النظام البيئي','السلاسل والشبكات الغذائية؛ التكيف؛ المخلوقات الحية تغير بيئاتها؛ تغيرات تؤثر في المخلوقات الحية'],['الوحدة الثالثة: الأرض ومواردها','تغيرات الأرض الفجائية؛ التجوية والتعرية؛ التربة؛ الأحافير والوقود الأحفوري؛ موارد الطاقة المتجددة']]},{n:'اللغة الإنجليزية',i:'🔤',d:'We Can 3',u:[['Unit 1','It’s Nice to Meet You!'],['Unit 2','Sea Animals'],['Unit 3','Sports and Activities'],['Unit 4','Chores'],['Unit 5','Yesterday and Today'],['Unit 6','Jobs'],['إضافي','Phonics Practice؛ Picture Dictionary؛ Word List']]},{n:'التربية الفنية',i:'🎨',d:'الرسم والزخرفة والطباعة والنسيج',u:[['الوحدة الأولى: مجال الرسم','عناصر التصميم؛ التخطيط الأولي والاستكشاف'],['الوحدة الثانية: مجال الزخرفة','الزخرفة البدائية والشعبية؛ الزخارف الشعبية السعودية'],['الوحدة الثالثة: مجال الطباعة','أطبع بوحداتي الهندسية؛ تكوينات ملامس مطبوعة؛ طباعة وحدات ذات ملامس مختلفة'],['الوحدة الرابعة: مجال النسيج','النسيج البسيط الملون']]},{n:'المهارات الحياتية والأسرية',i:'🏡',d:'الصحة والشخصية والوقت',u:[['صحتي وسلامتي','معاني الرموز الإرشادية؛ السلامة في تناول الدواء؛ القامة الصحيحة؛ حمل الأشياء بطريقة صحيحة'],['شخصيتي','كيف أتصرف إذا خرج والدي من المنزل؟؛ كيف أتصرف بملابسي التي لا أحتاجها؟'],['وقتي','الساعة'],['تمارين عامة','تطبيقات ومراجعة']]}];const subjects=document.getElementById('subjects'),details=document.getElementById('details');data.forEach((s,x)=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<b>${s.i} ${s.n}</b><small>${s.d}</small>`;c.onclick=()=>openS(x);subjects.appendChild(c)});function openS(x){let s=data[x];details.innerHTML=`<h2>${s.i} ${s.n}</h2>`+s.u.map(u=>`<div class="unit"><b>${u[0]}</b><p>${u[1]}</p></div>`).join('');details.classList.add('show');details.scrollIntoView({behavior:'smooth',block:'start'})}</script></body></html>
