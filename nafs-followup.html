<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة مهارات نافس | أنجز</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font-size:25px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e8ef;border-radius:20px;padding:24px}.title{text-align:center;font-size:26px}.sub{text-align:center;color:#687386}.fields{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:12px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #d9deea;border-radius:11px;padding:12px;font:inherit}.bar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.bar h2{font-size:18px;margin:0}.selectall,.btn{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.selectall{background:#f0edff;color:#5538c8}.checks{display:grid;gap:10px}.check{display:flex;gap:10px;border:1px solid #e3e6ee;border-radius:12px;padding:13px;font-weight:700}.check input{width:20px;height:20px;accent-color:#5b3fd6}.actions{display:flex;gap:10px;justify-content:center;margin-top:22px}.primary{background:#5b3fd6;color:#fff}.secondary{background:#eef0f5}.report{display:none;margin-top:24px}.sheet{background:#fff;padding:8px}.sheet h2{text-align:center;font-size:21px;margin:8px 0 16px}.follow-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}.follow-table th,.follow-table td{border:1px solid #9da95b;padding:8px;vertical-align:middle}.follow-table th{background:#e8edbd;font-weight:800}.follow-table th:nth-child(1){width:25%}.follow-table th:nth-child(2){width:12%}.follow-table th:nth-child(3){width:16%}.follow-table th:nth-child(4){width:47%}.follow-table td{height:128px}.items{line-height:2;text-align:right}.item{white-space:normal}.box{display:inline-block;width:13px;height:13px;border:1px solid #333;margin-left:6px;vertical-align:-2px}.box.on:after{content:'✓';font-size:13px;position:relative;top:-7px;right:1px;font-weight:bold}.muted{color:#aaa}.report-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}@media(max-width:700px){.fields{grid-template-columns:1fr}.wrap{padding:12px}.report{overflow:auto}.sheet{min-width:760px}}@media print{body{background:#fff}.top,.formpart,.report-actions{display:none!important}.wrap{padding:0;max-width:none}.card{border:0;padding:0}.report{display:block!important;margin:0;overflow:visible}.sheet{padding:0;min-width:0}.follow-table{font-size:12px}.follow-table td{height:105px}.sheet h2{margin-top:0}@page{size:A4 portrait;margin:12mm}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز</div><a class="back" href="index.html">العودة للرئيسية</a></div><div class="card"><div class="formpart"><h1 class="title">نموذج متابعة تدريب الطالبات على مهارات نافس</h1><p class="sub">أدخلي بيانات الحصة وحددي بنود المتابعة.</p><div class="fields"><div class="field"><label>اسم المعلمة</label><input id="teacher"></div><div class="field"><label>الحصة</label><input id="period" placeholder="مثال: الثالثة"></div><div class="field"><label>تاريخ الحصة</label><input id="date" type="date"></div></div><div class="bar"><h2>بنود المتابعة</h2><button class="selectall" type="button" onclick="toggleAll(this)">تحديد الكل</button></div><div class="checks" id="checks"><label class="check"><input type="checkbox" value="0">اختيار التدريبات من بنوك نافس</label><label class="check"><input type="checkbox" value="1">استهداف مهارات التفكير العليا</label><label class="check"><input type="checkbox" value="2">تدريب الطالبات على مفاتيح الحل وتقديم تغذية راجعة</label><label class="check"><input type="checkbox" value="3">تشخيص الطالبات حسب النموذج المرفق سابقًا</label></div><div class="actions"><button class="btn primary" onclick="addEntry()">إضافة الحصة للتقرير</button><button class="btn secondary" onclick="showReport()">عرض التقرير</button></div></div><section class="report" id="report"><div class="sheet"><h2>نموذج متابعة تدريب الطالبات على مهارات نافس</h2><table class="follow-table"><thead><tr><th>اسم المعلمة</th><th>الحصة</th><th>تاريخ الحصة</th><th>بنود المتابعة</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="report-actions"><button class="btn primary" onclick="window.print()">حفظ PDF / طباعة</button><button class="btn secondary" onclick="editForm()">إضافة / تعديل</button></div></section></div></div><script>const labels=['اختيار التدريبات من بنوك نافس','استهداف مهارات التفكير العليا','تدريب الطالبات على مفاتيح الحل وتقديم تغذية راجعة','تشخيص الطالبات حسب النموذج المرفق سابقًا'];let entries=[];function toggleAll(b){let xs=[...document.querySelectorAll('#checks input')],all=xs.every(x=>x.checked);xs.forEach(x=>x.checked=!all);b.textContent=all?'تحديد الكل':'إلغاء تحديد الكل'}function addEntry(){let teacher=document.getElementById('teacher').value.trim(),period=document.getElementById('period').value.trim(),date=document.getElementById('date').value,selected=[...document.querySelectorAll('#checks input')].map(x=>x.checked);entries.push({teacher,period,date,selected});document.getElementById('period').value='';document.getElementById('date').value='';document.querySelectorAll('#checks input').forEach(x=>x.checked=false);render();showReport()}function render(){let tb=document.getElementById('tbody');tb.innerHTML='';entries.forEach(e=>{let tr=document.createElement('tr'),date=e.date?new Date(e.date+'T00:00:00').toLocaleDateString('ar-SA'):'—';tr.innerHTML='<td>'+esc(e.teacher||'—')+'</td><td>'+esc(e.period||'—')+'</td><td>'+date+'</td><td class="items">'+labels.map((t,i)=>'<div class="item"><span class="box '+(e.selected[i]?'on':'')+'"></span>'+t+'</div>').join('')+'</td>';tb.appendChild(tr)});if(!entries.length)tb.innerHTML='<tr><td colspan="4" style="text-align:center;height:90px">لم تتم إضافة حصص بعد</td></tr>'}function showReport(){render();document.querySelector('.formpart').style.display='none';document.getElementById('report').style.display='block'}function editForm(){document.getElementById('report').style.display='none';document.querySelector('.formpart').style.display='block'}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();</script></body></html>
