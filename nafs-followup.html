<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة نافس | أنجز</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:820px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e5e8ef;border-radius:20px;padding:24px}.title{text-align:center}.sub{text-align:center;color:#687386}.fields{display:grid;grid-template-columns:1fr 2fr 1fr 1.2fr;gap:12px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #d9deea;border-radius:11px;padding:12px;font:inherit}.checks{display:grid;gap:10px;margin-top:18px}.check{display:flex;gap:10px;border:1px solid #e3e6ee;border-radius:12px;padding:13px;font-weight:700}.check input{width:20px;height:20px}.actions{text-align:center;margin-top:22px}.btn{border:0;border-radius:11px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer;background:#5b3fd6;color:#fff}.msg{text-align:center;margin-top:15px;font-weight:800}.ok{color:#17803d}.err{color:#b42318}@media(max-width:700px){.fields{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1 class="title">متابعة تدريب الطالبات على مهارات نافس</h1><p class="sub">تُحفظ المشاركة تلقائيًا ضمن تقرير المدرسة.</p><div class="fields"><div class="field"><label>رمز المدرسة</label><input id="school" value="ANJZ-4821"></div><div class="field"><label>اسم المعلمة</label><input id="teacher"></div><div class="field"><label>الحصة</label><input id="period"></div><div class="field"><label>تاريخ الحصة</label><input id="date" type="date"></div></div><div class="checks" id="checks"><label class="check"><input type="checkbox">اختيار التدريبات من بنوك نافس</label><label class="check"><input type="checkbox">استهداف مهارات التفكير العليا</label><label class="check"><input type="checkbox">تدريب الطالبات على مفاتيح الحل وتقديم تغذية راجعة</label><label class="check"><input type="checkbox">تشخيص الطالبات حسب النموذج المرفق سابقًا</label></div><div class="actions"><button id="send" class="btn" onclick="send()">إرسال المتابعة</button></div><div id="msg" class="msg"></div></div></div><script>const ENDPOINT='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/nafs-submit';async function send(){let v=id=>document.getElementById(id).value.trim(),x=[...document.querySelectorAll('#checks input')],b={school_code:v('school'),teacher_name:v('teacher'),period:v('period'),lesson_date:v('date'),item_bank:x[0].checked,item_hots:x[1].checked,item_keys_feedback:x[2].checked,item_diagnosis:x[3].checked},m=document.getElementById('msg'),btn=document.getElementById('send');if(!b.school_code||!b.teacher_name||!b.period||!b.lesson_date){m.className='msg err';m.textContent='أكملي جميع البيانات';return}btn.disabled=true;btn.textContent='جارٍ الإرسال...';try{let r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw 0;localStorage.setItem('anjz_school',b.school_code);m.className='msg ok';m.textContent='✓ تم حفظ المتابعة ضمن تقرير المدرسة';document.getElementById('period').value='';document.getElementById('date').value='';x.forEach(i=>i.checked=false)}catch{m.className='msg err';m.textContent='تعذر الإرسال. تأكدي من رمز المدرسة.'}finally{btn.disabled=false;btn.textContent='إرسال المتابعة'}}let q=new URLSearchParams(location.search).get('school')||localStorage.getItem('anjz_school');if(q)document.getElementById('school').value=q;</script></body></html>
