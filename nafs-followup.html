<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>متابعة تدريب الطالبات على مهارات نافس | أنجز</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:25px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e8ef;border-radius:20px;padding:24px;box-shadow:0 8px 28px #1e293b0d}.title{text-align:center;margin:0 0 6px;font-size:27px}.sub{text-align:center;color:#687386;margin:0 0 24px}.fields{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:12px}.field label{display:block;font-weight:800;margin:0 0 7px}.field input{width:100%;border:1px solid #d9deea;border-radius:11px;padding:12px;font:inherit;background:#fff}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}.bar h2{font-size:18px;margin:0}.selectall{border:1px solid #d8d1fa;background:#f5f2ff;color:#5538c8;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.checks{display:grid;gap:10px}.check{display:flex;gap:11px;align-items:flex-start;border:1px solid #e3e6ee;border-radius:13px;padding:14px;cursor:pointer;background:#fff}.check:hover{border-color:#b9aaf5;background:#fbfaff}.check input{width:20px;height:20px;accent-color:#5b3fd6;flex:0 0 auto;margin-top:1px}.check span{font-weight:700;line-height:1.65}.actions{display:flex;gap:10px;justify-content:center;margin-top:24px}.btn{border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:900;cursor:pointer}.primary{background:#5b3fd6;color:#fff}.secondary{background:#eef0f5;color:#273248}.report{display:none;margin-top:24px}.report-head{text-align:center;border-bottom:2px solid #5538c8;padding-bottom:14px;margin-bottom:16px}.report-head h2{margin:0 0 5px}.meta{display:grid;grid-template-columns:2fr 1fr 1.2fr;border:1px solid #b9c0cc;border-bottom:0}.meta div{padding:10px;border-left:1px solid #b9c0cc}.meta div:last-child{border-left:0}.meta b{display:block;font-size:12px;color:#596579;margin-bottom:4px}.table{border:1px solid #b9c0cc}.row{display:grid;grid-template-columns:1fr;min-height:48px;border-top:1px solid #d2d7df;padding:12px}.row:first-child{border-top:0}.yes{font-weight:800}.empty{color:#8b93a2}.print-title{display:none}@media(max-width:700px){.wrap{padding:14px}.fields,.meta{grid-template-columns:1fr}.meta div{border-left:0;border-bottom:1px solid #b9c0cc}.meta div:last-child{border-bottom:0}.bar{align-items:flex-start}.actions{flex-wrap:wrap}}
@media print{body{background:#fff}.top,.formpart,.actions{display:none!important}.wrap{max-width:none;padding:0}.card{box-shadow:none;border:0;padding:0}.report{display:block!important;margin:0}.print-title{display:block}.report-head h2{font-size:20px}.row{break-inside:avoid}.meta,.table{font-size:13px}@page{size:A4;margin:14mm}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><div class="brand">أنجز</div><a class="back" href="index.html">العودة للرئيسية</a></div>
 <div class="card">
  <div class="formpart">
   <h1 class="title">نموذج متابعة تدريب الطالبات على مهارات نافس</h1>
   <p class="sub">حددي بنود المتابعة المنفذة في الحصة، ثم أنشئي التقرير.</p>
   <div class="fields">
    <div class="field"><label>اسم المعلمة</label><input id="teacher" placeholder="اكتبي اسم المعلمة"></div>
    <div class="field"><label>الحصة</label><input id="period" placeholder="مثال: الثالثة"></div>
    <div class="field"><label>تاريخ الحصة</label><input id="date" type="date"></div>
   </div>
   <div class="bar"><h2>بنود المتابعة</h2><button class="selectall" type="button" onclick="toggleAll()">تحديد الكل</button></div>
   <div class="checks" id="checks">
    <label class="check"><input type="checkbox" value="اختيار التدريبات من بنوك نافس"><span>اختيار التدريبات من بنوك نافس</span></label>
    <label class="check"><input type="checkbox" value="استهداف مهارات التفكير العليا"><span>استهداف مهارات التفكير العليا</span></label>
    <label class="check"><input type="checkbox" value="تدريب الطالبات على مفاتيح الحل وتقديم تغذية راجعة"><span>تدريب الطالبات على مفاتيح الحل وتقديم تغذية راجعة</span></label>
    <label class="check"><input type="checkbox" value="تشخيص الطالبات حسب النموذج المرفق سابقًا"><span>تشخيص الطالبات حسب النموذج المرفق سابقًا</span></label>
   </div>
   <div class="actions"><button class="btn primary" onclick="buildReport()">إنشاء التقرير</button><button class="btn secondary" onclick="clearForm()">مسح</button></div>
  </div>
  <section class="report" id="report">
   <div class="report-head"><h2>نموذج متابعة تدريب الطالبات على مهارات نافس</h2><div>تقرير متابعة الحصة</div></div>
   <div class="meta"><div><b>اسم المعلمة</b><span id="rTeacher">—</span></div><div><b>الحصة</b><span id="rPeriod">—</span></div><div><b>تاريخ الحصة</b><span id="rDate">—</span></div></div>
   <div class="table" id="rItems"></div>
   <div class="actions"><button class="btn primary" onclick="window.print()">حفظ PDF / طباعة</button><button class="btn secondary" onclick="editForm()">تعديل البيانات</button></div>
  </section>
 </div>
</div>
<script>
function toggleAll(){const xs=[...document.querySelectorAll('#checks input')],all=xs.every(x=>x.checked);xs.forEach(x=>x.checked=!all);event.currentTarget.textContent=all?'تحديد الكل':'إلغاء تحديد الكل'}
function buildReport(){
 const teacher=document.getElementById('teacher').value.trim(),period=document.getElementById('period').value.trim(),date=document.getElementById('date').value;
 document.getElementById('rTeacher').textContent=teacher||'—';document.getElementById('rPeriod').textContent=period||'—';document.getElementById('rDate').textContent=date?new Date(date+'T00:00:00').toLocaleDateString('ar-SA'):'—';
 const selected=[...document.querySelectorAll('#checks input:checked')].map(x=>x.value),box=document.getElementById('rItems');box.innerHTML='';
 if(!selected.length){box.innerHTML='<div class="row empty">لم يتم تحديد أي بند متابعة.</div>'}else selected.forEach(t=>{const d=document.createElement('div');d.className='row yes';d.textContent='✓ '+t;box.appendChild(d)});
 document.getElementById('report').style.display='block';document.querySelector('.formpart').style.display='none';document.getElementById('report').scrollIntoView({behavior:'smooth'});
}
function editForm(){document.getElementById('report').style.display='none';document.querySelector('.formpart').style.display='block'}
function clearForm(){document.getElementById('teacher').value='';document.getElementById('period').value='';document.getElementById('date').value='';document.querySelectorAll('#checks input').forEach(x=>x.checked=false)}
</script>
</body></html>
