<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة مهارات نافس | أنجز</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:820px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font-size:25px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #e5e8ef;border-radius:20px;padding:24px}.title{text-align:center;font-size:26px}.sub{text-align:center;color:#687386}.fields{display:grid;grid-template-columns:2fr 1fr 1.2fr;gap:12px}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #d9deea;border-radius:11px;padding:12px;font:inherit}.bar{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.bar h2{font-size:18px;margin:0}.selectall,.btn{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.selectall{background:#f0edff;color:#5538c8}.checks{display:grid;gap:10px}.check{display:flex;gap:10px;border:1px solid #e3e6ee;border-radius:12px;padding:13px;font-weight:700}.check input{width:20px;height:20px;accent-color:#5b3fd6}.actions{text-align:center;margin-top:22px}.primary{background:#5b3fd6;color:#fff;min-width:180px}.primary:disabled{opacity:.65}.msg{text-align:center;margin-top:15px;font-weight:800}.ok{color:#17803d}.err{color:#b42318}@media(max-width:700px){.fields{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز</div><a class="back" href="index.html">العودة للرئيسية</a></div><div class="card"><h1 class="title">نموذج متابعة تدريب الطالبات على مهارات نافس</h1><p class="sub">أدخلي بيانات الحصة وحددي بنود المتابعة، ثم اضغطي إرسال.</p><div class="fields"><div class="field"><label>اسم المعلمة</label><input id="teacher" maxlength="120"></div><div class="field"><label>الحصة</label><input id="period" maxlength="50" placeholder="مثال: الثالثة"></div><div class="field"><label>تاريخ الحصة</label><input id="date" type="date"></div></div><div class="bar"><h2>بنود المتابعة</h2><button class="selectall" type="button" onclick="toggleAll(this)">تحديد الكل</button></div><div class="checks" id="checks"><label class="check"><input type="checkbox">اختيار التدريبات من بنوك نافس</label><label class="check"><input type="checkbox">استهداف مهارات التفكير العليا</label><label class="check"><input type="checkbox">تدريب الطالبات على مفاتيح الحل وتقديم تغذية راجعة</label><label class="check"><input type="checkbox">تشخيص الطالبات حسب النموذج المرفق سابقًا</label></div><div class="actions"><button id="send" class="btn primary" onclick="submitForm()">إرسال المتابعة</button></div><div id="msg" class="msg"></div></div></div><script>const API='https://cixwjisioawswnnwwswf.supabase.co/rest/v1/nafs_followups';const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpeHdqaXNpb2F3c3dubnd3c3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTQwMDMsImV4cCI6MjEwMzI5MDAwM30.TQ4MalV4rO-g7qc7tQS5VfpKE4NO9WG_rzynOqrsG3Q';function toggleAll(b){const xs=[...document.querySelectorAll('#checks input')],all=xs.every(x=>x.checked);xs.forEach(x=>x.checked=!all);b.textContent=all?'تحديد الكل':'إلغاء تحديد الكل'}async function submitForm(){const teacher=document.getElementById('teacher').value.trim(),period=document.getElementById('period').value.trim(),date=document.getElementById('date').value,x=[...document.querySelectorAll('#checks input')],msg=document.getElementById('msg'),btn=document.getElementById('send');if(!teacher||!period||!date){msg.className='msg err';msg.textContent='أكملي اسم المعلمة والحصة والتاريخ.';return}btn.disabled=true;btn.textContent='جارٍ الإرسال...';msg.textContent='';try{const r=await fetch(API,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({teacher_name:teacher,period,lesson_date:date,item_bank:x[0].checked,item_hots:x[1].checked,item_keys_feedback:x[2].checked,item_diagnosis:x[3].checked})});if(!r.ok){const detail=await r.text();throw new Error(detail)}msg.className='msg ok';msg.textContent='✓ تم إرسال المتابعة وحفظها بنجاح';document.getElementById('period').value='';document.getElementById('date').value='';x.forEach(i=>i.checked=false)}catch(e){console.error(e);msg.className='msg err';msg.textContent='تعذر الإرسال. حدّثي الصفحة وحاولي مرة أخرى.'}finally{btn.disabled=false;btn.textContent='إرسال المتابعة'}}</script></body></html>
