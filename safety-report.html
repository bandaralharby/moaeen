<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير الأمن والسلامة</title><style>*{box-sizing:border-box}body{margin:0;background:#e8eff0;font-family:Tahoma,Arial,sans-serif;color:#073b55}.tools{position:sticky;top:0;z-index:20;background:#073e5c;padding:12px;text-align:center}.tools button{border:0;border-radius:24px;background:#fff;color:#073e5c;padding:11px 28px;font-weight:900}.poster{width:210mm;min-height:297mm;margin:14px auto;background:#fff;position:relative;overflow:hidden;padding:8mm 10mm 10mm;box-shadow:0 8px 28px #82999d55}.poster:before{content:'';position:absolute;right:0;left:0;top:0;height:34mm;background:linear-gradient(110deg,#056f7e,#08a087,#07527a);clip-path:ellipse(78% 70% at 50% 0)}.poster:after{content:'';position:absolute;right:-15%;left:-15%;bottom:-22mm;height:30mm;border-radius:50%;background:linear-gradient(90deg,#0b9a79,#075679,#18a76f)}.content{position:relative;z-index:2}.head{height:72px;display:flex;align-items:flex-start;justify-content:space-between}.logo{width:135px;max-height:62px;object-fit:contain}.org{color:#fff;text-align:center;font-size:13px;font-weight:900;line-height:1.6;padding-top:3px}.spacer{width:135px}.title{text-align:center;margin:3px 0 10px}.ribbon{display:inline-block;min-width:62%;padding:8px 28px;border-radius:28px;background:linear-gradient(90deg,#06486e,#07838b);color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 10px #164e5c33}.schoolName{display:inline-block;margin-top:7px;padding:5px 28px;border-radius:18px;background:#159c76;color:#fff;font-size:15px;font-weight:900}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}.fact{border:1.5px solid #c7e2df;border-radius:11px;padding:8px 9px;background:#f9fdfc;min-height:55px}.fact small{display:block;color:#628087;font-size:9px;margin-bottom:3px}.fact b{font-size:12px}.photosTitle{display:flex;align-items:center;gap:10px;margin:11px 0 8px}.photosTitle:before,.photosTitle:after{content:'';height:2px;background:#138b8b;flex:1}.photosTitle span{background:#07577a;color:#fff;border-radius:24px;padding:6px 30px;font-size:17px;font-weight:900}.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.photo{height:205px;border:3px solid #11937f;border-radius:13px;overflow:hidden;background:#edf5f4;position:relative}.photo img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;background:#07577a;color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900}.caption{position:absolute;right:0;left:0;bottom:0;background:#064664dc;color:#fff;text-align:center;padding:4px;font-size:9px}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;color:#8aa1a4;font-weight:800}.result{margin-top:9px;border:1.5px solid #b7dad6;border-radius:12px;background:#f6fbfa;padding:9px 12px}.result h3{margin:0 0 4px;color:#087a7c;font-size:13px}.result p{margin:0;font-size:10px;line-height:1.65}.sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:10px}.signBox{text-align:center;border-top:1px solid #d3e4e2;padding-top:6px;font-size:10px}.signBox b{display:block;color:#07577a;font-size:11px;margin-bottom:3px}.signName{font-weight:900;min-height:18px}.line{width:65%;height:15px;border-bottom:1px solid #55777d;margin:auto}.foot{text-align:center;color:#fff;font-size:9px;font-weight:900;margin-top:8px}@media(max-width:800px){.poster{width:100%;min-height:100vh;margin:0;padding:12px 10px 42px}.head{height:65px}.logo{width:100px}.spacer{width:100px}.org{font-size:10px}.ribbon{font-size:18px;min-width:80%}.info{grid-template-columns:1fr 1fr}.photo{height:175px}.sign{gap:10px}}@media print{body{background:#fff}.tools{display:none}.poster{width:210mm;height:297mm;min-height:297mm;margin:0;box-shadow:none}.photo{height:205px}@page{size:A4;margin:0}}</style></head><body><div class="tools"><button onclick="window.print()">طباعة / حفظ PDF</button></div><main class="poster"><div class="content"><header class="head"><img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/7/76/Ministry_of_Education_%28Saudi_Arabia%29_%28logo%29.png"><div class="org">وزارة التعليم<br>الأمن والسلامة المدرسية</div><div class="spacer"></div></header><div class="title"><div class="ribbon" id="title"></div><br><div class="schoolName" id="schoolName"></div></div><section class="info" id="facts"></section><div class="photosTitle"><span>شواهد التنفيذ 📷</span></div><section class="photos" id="photos"></section><section class="result"><h3>النتيجة والتوصيات</h3><p id="resultText"></p></section><div class="sign"><div class="signBox"><b>منسق الأمن والسلامة</b><div class="signName" id="coordinator"></div><div class="line"></div></div><div class="signBox"><b>مدير/ة المدرسة</b><div class="signName" id="principal"></div><div class="line"></div></div></div><div class="foot">الأمن والسلامة مسؤولية الجميع</div></div></main><script>const esc=s=>String(s||'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const p=new URLSearchParams(location.search),idx=+(p.get('plan')||0),names=['خطة الإخلاء الأولى','خطة الإخلاء الثانية','خطة الإخلاء الثالثة','خطة الإخلاء الرابعة'];let s={},d={};try{s=JSON.parse(localStorage.getItem('anjz_safety_school')||'{}');d=JSON.parse(localStorage.getItem('anjz_evac_'+idx)||'{}');const live=JSON.parse(sessionStorage.getItem('anjz_evac_report_'+idx)||'null');if(live)d={...d,...live}}catch(e){}title.textContent='تقرير تنفيذ '+names[idx];schoolName.textContent=s.school||'اسم المدرسة';coordinator.textContent=s.coordinator||'—';principal.textContent=s.principal||'—';const fi=[['المرحلة',s.stage],['العام الدراسي',s.year],['تاريخ التنفيذ',d.date],['طريقة التنبيه',d.alarm],['نقطة التجمع',d.assembly],['مدة الإخلاء',(d.duration||'—')+' دقيقة'],['الفئة المشاركة',d.audience],['نتيجة التنفيذ',d.result],['نوع المدرسة',s.schoolType]];facts.innerHTML=fi.map(x=>`<div class="fact"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join('');const ev=(d.evidence||[]).filter(f=>f&&f.data).slice(0,4);photos.innerHTML=[0,1,2,3].map(i=>ev[i]?`<div class="photo"><img src="${ev[i].data}"><span class="badge">${i+1}</span><span class="caption">شاهد من تنفيذ ${esc(names[idx])}</span></div>`:`<div class="photo"><div class="placeholder">شاهد ${i+1}</div><span class="badge">${i+1}</span></div>`).join('');resultText.innerHTML='تم تنفيذ <b>'+esc(names[idx])+'</b> وكانت النتيجة: <b>'+esc(d.result)+'</b>. '+(d.notes?esc(d.notes):'تم تطبيق إجراءات الإخلاء والوصول إلى نقطة التجمع، ويوصى باستمرار التدريب الدوري ورفع مستوى الجاهزية.');</script></body></html>
