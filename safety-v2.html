<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأمن والسلامة | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}button,input,select,textarea{font:inherit}.wrap{max-width:1120px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,#4430a9,#7058e6);color:#fff;border-radius:22px;padding:28px;margin:18px 0}.panel,.card{background:#fff;border:1px solid #e7e3f1;border-radius:17px;padding:17px}.meta,.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.field{margin-bottom:11px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd9e9;border-radius:10px;background:#fff}.field textarea{min-height:75px}.card{cursor:pointer;min-height:120px}.card b{display:block;margin:7px 0}.card small{color:#777286}.screen{display:none}.screen.on{display:block}.sectionTop{display:flex;gap:12px;align-items:center;margin:15px 0}.return{border:0;background:#eee9ff;color:#5538c8;border-radius:11px;padding:10px 14px;font-weight:900}.plans,.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.formgrid{grid-template-columns:repeat(3,1fr)}.plan{border:1px solid #ddd8eb;border-radius:12px;padding:13px;cursor:pointer}.plan.on{border:2px solid #5b3fd6;background:#f7f5ff}.evidence{border:2px dashed #cfc8e8;border-radius:14px;padding:15px;margin-top:12px}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.preview img{width:100%;height:120px;object-fit:cover;border-radius:9px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:900}.primary{background:#5b3fd6;color:#fff}.ghost{background:#eee9ff;color:#4936a6}.saved{display:none;background:#eef9f3;color:#286443;padding:11px;border-radius:10px;margin-top:10px}.hint{background:#fff8df;border:1px solid #efdf9f;padding:11px;border-radius:10px;margin-bottom:12px}@media(max-width:700px){.meta,.cards,.plans,.formgrid{grid-template-columns:1fr 1fr}.preview{grid-template-columns:1fr 1fr}}@media(max-width:480px){.meta,.cards,.plans,.formgrid{grid-template-columns:1fr}.sectionTop{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI — الأمن والسلامة</div><a class="back" href="index.html">← الرئيسية</a></div><div id="home" class="screen on"><div class="hero"><h1>🛡️ ملف الأمن والسلامة المدرسية</h1><div>إدارة المتطلبات والشواهد والتقارير من مكان واحد.</div></div><div class="meta panel"><div class="field"><label>اسم المدرسة</label><input id="school"></div><div class="field"><label>العام الدراسي</label><select id="year"><option>1448 هـ</option><option>1449 هـ</option></select></div><div class="field"><label>نوع المدرسة</label><select id="schoolType"><option>بنين</option><option>بنات</option><option>طفولة مبكرة</option></select></div><div class="field"><label>المرحلة</label><select id="stage"><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option><option>متعدد المراحل</option></select></div></div><h2>متطلبات الأمن والسلامة</h2><div class="cards" id="cards"></div></div><div id="detail" class="screen"><div class="sectionTop"><button class="return" onclick="goHome()">← العودة للأقسام</button><h2 id="sectionName"></h2></div><div class="panel" id="work"></div></div></div><script>const mods=[['annual','🗓️','الخطة السنوية'],['evac','🚨','الإخلاء والطوارئ'],['inspect','✅','التفقد وتقويم السلامة'],['risks','⚠️','سجل المخاطر والمعالجة'],['equipment','🧯','معدات وأجهزة السلامة'],['maintenance','🔧','الصيانة والمتابعة'],['training','🎓','التدريب والتوعية'],['incidents','📝','الحوادث والطوارئ'],['team','👥','فريق الأمن والسلامة'],['visitors','🚪','الأمن المدرسي والزوار'],['evidence','📷','الشواهد والإنجاز'],['final','📊','التقرير النهائي']],names=['خطة الإخلاء الأولى','خطة الإخلاء الثانية','خطة الإخلاء الثالثة','خطة الإخلاء الرابعة'];let cur=0,fileData=[];cards.innerHTML=mods.map(m=>`<div class="card" onclick="openM('${m[0]}')"><div style="font-size:27px">${m[1]}</div><b>${m[2]}</b><small>${m[0]=='evac'?'أربع خطط مستقلة مع شواهد وتقارير.':'حفظ ومتابعة وتقرير.'}</small></div>`).join('');const sk='anjz_safety_school',ek=i=>'anjz_evac_'+i;function saveSchool(){localStorage.setItem(sk,JSON.stringify({school:school.value,year:year.value,schoolType:schoolType.value,stage:stage.value}))}function loadSchool(){const s=JSON.parse(localStorage.getItem(sk)||'{}');school.value=s.school||'';year.value=s.year||'1448 هـ';schoolType.value=s.schoolType||'بنين';stage.value=s.stage||'ابتدائي'}function goHome(){detail.classList.remove('on');home.classList.add('on');scrollTo(0,0)}function show(t){saveSchool();home.classList.remove('on');detail.classList.add('on');sectionName.textContent=t;scrollTo(0,0)}function evac(){return `<div class="hint">اختر خطة الإخلاء، أدخل بياناتها وارفع الصور. سيتم ضغط الصور تلقائيًا حتى تحفظ وتظهر في التقرير.</div><div class="plans" id="plans"></div><h3 id="evTitle"></h3><div class="formgrid"><div class="field"><label>تاريخ التنفيذ</label><input id="date" type="date"></div><div class="field"><label>طريقة التنبيه</label><select id="alarm"><option>جرس الإنذار</option><option>نداء داخلي</option><option>تنبيه يدوي</option></select></div><div class="field"><label>نقطة التجمع</label><select id="assembly"><option>الساحة الخارجية</option><option>الملعب</option><option>الفناء المحدد</option><option>موقع آمن خارج المبنى</option></select></div><div class="field"><label>نتيجة الخطة</label><select id="result"><option>ناجحة دون ملاحظات</option><option>ناجحة مع ملاحظات بسيطة</option><option>تحتاج إعادة تنفيذ</option></select></div><div class="field"><label>مدة الإخلاء بالدقائق</label><input id="duration" type="number" step="0.1"></div><div class="field"><label>الفئة المشاركة</label><select id="audience"><option>جميع منسوبي المدرسة</option><option>الطلاب</option><option>الطالبات</option><option>الهيئة التعليمية والإدارية</option></select></div></div><div class="field"><label>ملاحظات إضافية</label><textarea id="notes"></textarea></div><div class="evidence"><b>📷 شواهد التنفيذ</b><p>اختر الصور؛ ستظهر معاينتها هنا ثم داخل التقرير.</p><input id="evidence" type="file" multiple accept="image/*" onchange="readImages(this.files)"><div class="preview" id="preview"></div></div><div class="actions"><button class="btn primary" onclick="saveEv()">حفظ الخطة</button><button class="btn ghost" onclick="openReport()">إنشاء التقرير الاحترافي</button></div><div class="saved" id="saved"></div>`}function draw(){plans.innerHTML=names.map((n,i)=>`<div class="plan ${i==cur?'on':''}" onclick="openEv(${i})"><b>${n}</b><small>${localStorage.getItem(ek(i))?'✓ محفوظة':'لم تستكمل'}</small></div>`).join('')}function openEv(i){cur=i;const d=JSON.parse(localStorage.getItem(ek(i))||'{}');evTitle.textContent=names[i];date.value=d.date||'';alarm.value=d.alarm||'جرس الإنذار';assembly.value=d.assembly||'الساحة الخارجية';result.value=d.result||'ناجحة دون ملاحظات';duration.value=d.duration||'';audience.value=d.audience||'جميع منسوبي المدرسة';notes.value=d.notes||'';fileData=d.evidence||[];render();saved.style.display='none';draw()}function render(){preview.innerHTML=fileData.map(x=>`<img src="${x.data}">`).join('')}function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,max=1200;if(w>max||h>max){const q=Math.min(max/w,max/h);w=Math.round(w*q);h=Math.round(h*q)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve({name:file.name,type:'image/jpeg',data:c.toDataURL('image/jpeg',.72)})};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}async function readImages(fs){saved.style.display='block';saved.textContent='جاري تجهيز الصور...';fileData=[];for(const f of [...fs]){try{fileData.push(await compress(f))}catch(e){}}render();saved.textContent='✓ تم تجهيز '+fileData.length+' صورة. اضغط حفظ الخطة.'}function saveEv(){saveSchool();const o={date:date.value,alarm:alarm.value,assembly:assembly.value,result:result.value,duration:duration.value,audience:audience.value,notes:notes.value,evidence:fileData};try{localStorage.setItem(ek(cur),JSON.stringify(o));saved.style.display='block';saved.textContent='✓ تم حفظ الخطة والشواهد بنجاح.';draw();return true}catch(e){saved.style.display='block';saved.textContent='تعذر حفظ كل الصور بسبب سعة المتصفح. قلل عدد الصور ثم حاول مرة أخرى.';return false}}function openReport(){if(!saveEv())return;location.href='safety-report.html?plan='+cur}function generic(m){return `<div class="formgrid"><div class="field"><label>الحالة</label><select id="gs"><option>مكتمل</option><option>قيد التنفيذ</option><option>يحتاج متابعة</option></select></div><div class="field"><label>الأولوية</label><select id="gp"><option>عادية</option><option>عالية</option><option>عاجلة</option></select></div><div class="field"><label>المسؤول</label><select id="go"><option>منسق الأمن والسلامة</option><option>فريق الأمن والسلامة</option><option>إدارة المدرسة</option><option>الصيانة</option></select></div></div><div class="field"><label>ملاحظات إضافية</label><textarea id="gn"></textarea></div><div class="actions"><button class="btn primary" onclick="saveG('${m[0]}')">حفظ</button></div><div class="saved" id="gSaved"></div>`}function saveG(id){saveSchool();localStorage.setItem('anjz_safety_'+id,JSON.stringify({status:gs.value,priority:gp.value,owner:go.value,notes:gn.value}));gSaved.style.display='block';gSaved.textContent='✓ تم الحفظ'}function loadG(id){const d=JSON.parse(localStorage.getItem('anjz_safety_'+id)||'{}');gs.value=d.status||'مكتمل';gp.value=d.priority||'عادية';go.value=d.owner||'منسق الأمن والسلامة';gn.value=d.notes||''}function openM(id){const m=mods.find(x=>x[0]==id);show(m[1]+' '+m[2]);if(id=='evac'){work.innerHTML=evac();draw();openEv(0)}else{work.innerHTML=generic(m);loadG(id)}}loadSchool();</script></body></html>
