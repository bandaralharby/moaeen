<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خطط الإخلاء | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;background:#f7f7fc;color:#19172b}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:23px;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero{margin:18px 0;padding:28px;border-radius:22px;background:linear-gradient(135deg,#4430a9,#7058e6);color:#fff}.hero h1{margin:0 0 8px}.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.plan{background:#fff;border:1px solid #e6e2f0;border-radius:16px;padding:18px;cursor:pointer}.plan.active{border:2px solid #6244dc;background:#faf8ff}.panel{margin-top:18px;background:#fff;border:1px solid #e6e2f0;border-radius:20px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd9e9;border-radius:10px;background:#fff}.field textarea{min-height:80px}.evidence{margin-top:18px;border:2px dashed #cfc8e8;border-radius:16px;padding:18px;background:#fcfbff}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.preview img{width:100%;height:120px;object-fit:cover;border-radius:10px}.file{padding:10px;background:#f0edfa;border-radius:10px;font-size:12px}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:#5b3fd6;color:#fff}.ghost{background:#f0edfa;color:#4936a6}.saved{margin-top:12px;padding:12px;background:#eef9f3;border-radius:10px;color:#286443;display:none}@media(max-width:750px){.plans{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.preview{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI — الأمن والسلامة</div><a class="back" href="safety.html">← الأمن والسلامة</a></div><div class="hero"><h1>🚨 خطط الإخلاء</h1><div>أربع خطط مستقلة، لكل خطة بيانات التنفيذ والشواهد الخاصة بها.</div></div><div class="plans" id="plans"></div><div class="panel"><h2 id="title"></h2><div class="grid"><div class="field"><label>تاريخ التنفيذ</label><input id="date" type="date"></div><div class="field"><label>طريقة التنبيه</label><select id="alarm"><option>جرس الإنذار</option><option>نداء داخلي</option><option>تنبيه يدوي</option></select></div><div class="field"><label>نقطة التجمع</label><select id="assembly"><option>الساحة الخارجية</option><option>الملعب</option><option>الفناء المحدد</option><option>موقع آمن خارج المبنى</option></select></div><div class="field"><label>نتيجة الخطة</label><select id="result"><option>ناجحة دون ملاحظات</option><option>ناجحة مع ملاحظات بسيطة</option><option>تحتاج إعادة تنفيذ</option></select></div><div class="field"><label>مدة الإخلاء بالدقائق</label><input id="duration" type="number" min="0" step="0.1"></div><div class="field"><label>الفئة المشاركة</label><select id="audience"><option>جميع منسوبي المدرسة</option><option>الطلاب</option><option>الطالبات</option><option>الهيئة التعليمية والإدارية</option></select></div></div><div class="field" style="margin-top:12px"><label>ملاحظات إضافية — اختياري</label><textarea id="notes"></textarea></div><div class="evidence"><b>📷 رفع الشواهد</b><p>يمكن رفع عدة صور أو ملفات لكل خطة.</p><input id="evidence" type="file" multiple accept="image/*,.pdf,.doc,.docx" onchange="showFiles()"><div class="preview" id="preview"></div></div><div class="actions"><button class="btn primary" onclick="savePlan()">حفظ الخطة</button><button class="btn ghost" onclick="window.print()">طباعة / PDF</button></div><div class="saved" id="savedMsg">✓ تم حفظ بيانات الخطة في هذا الجهاز.</div></div></div><script>const names=['خطة الإخلاء الأولى','خطة الإخلاء الثانية','خطة الإخلاء الثالثة','خطة الإخلاء الرابعة'];let current=0,files=[];function key(i){return'anjz_evac_'+i}function draw(){plans.innerHTML=names.map((n,i)=>'<div class="plan '+(i===current?'active':'')+'" onclick="openPlan('+i+')"><b>'+n+'</b><div style="margin-top:7px;color:#777">'+(localStorage.getItem(key(i))?'✓ محفوظة':'لم تُستكمل')+'</div></div>').join('');title.textContent=names[current]}function openPlan(i){current=i;files=[];preview.innerHTML='';const d=JSON.parse(localStorage.getItem(key(i))||'{}');date.value=d.date||'';alarm.value=d.alarm||'جرس الإنذار';assembly.value=d.assembly||'الساحة الخارجية';result.value=d.result||'ناجحة دون ملاحظات';duration.value=d.duration||'';audience.value=d.audience||'جميع منسوبي المدرسة';notes.value=d.notes||'';savedMsg.style.display='none';draw()}function showFiles(){files=[...evidence.files];preview.innerHTML=files.map(f=>f.type.startsWith('image/')?'<img src="'+URL.createObjectURL(f)+'">':'<div class="file">📎 '+f.name+'</div>').join('')}function savePlan(){const d={date:date.value,alarm:alarm.value,assembly:assembly.value,result:result.value,duration:duration.value,audience:audience.value,notes:notes.value,evidenceNames:files.map(f=>f.name)};localStorage.setItem(key(current),JSON.stringify(d));savedMsg.style.display='block';draw()}draw();openPlan(0)</script></body></html>
