<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأمن والسلامة | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,#4430a9,#7058e6);color:#fff;border-radius:24px;padding:30px;margin:18px 0}.hero h1{margin:0 0 8px}.meta,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e7e3f1;border-radius:18px;padding:18px}.card{cursor:pointer;min-height:135px}.card:hover{border-color:#6244dc}.card b{display:block;margin:8px 0}.card small{color:#716d83;line-height:1.6}.ico{font-size:28px}.section{margin:20px 0}.field{margin-bottom:12px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd9e9;border-radius:10px;background:#fff}.field textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:900;cursor:pointer}.primary{background:#5b3fd6;color:#fff}.ghost{background:#f0edfa;color:#4936a6}.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.plan{border:1px solid #ded9ed;border-radius:14px;padding:15px;background:#fff;cursor:pointer}.plan.on{border:2px solid #6244dc;background:#f8f6ff}.plan small{display:block;color:#777;margin-top:5px}.evidence{border:2px dashed #cfc8e8;border-radius:16px;padding:17px;background:#fcfbff;margin-top:14px}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.preview img{width:100%;height:110px;object-fit:cover;border-radius:10px}.file{background:#f0edfa;padding:10px;border-radius:10px;font-size:12px}.saved{display:none;margin-top:12px;background:#eef9f3;color:#286443;padding:12px;border-radius:10px}.hint{background:#fff8df;border:1px solid #f0df9b;padding:12px;border-radius:11px;margin:10px 0;color:#65541d}@media(max-width:800px){.meta,.grid,.plans,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.meta,.grid,.plans,.formgrid{grid-template-columns:1fr}.preview{grid-template-columns:1fr 1fr}.actions .btn{width:100%}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI — الأمن والسلامة</div><a class="back" href="index.html">← الرئيسية</a></div><div class="hero"><h1>🛡️ ملف الأمن والسلامة المدرسية</h1><div>متطلبات منظمة باختيارات جاهزة، مع توثيق الشواهد والتقارير.</div></div><div class="meta panel"><div class="field"><label>اسم المدرسة</label><input></div><div class="field"><label>العام الدراسي</label><select><option>1448 هـ</option><option>1449 هـ</option></select></div><div class="field"><label>نوع المدرسة</label><select><option>بنين</option><option>بنات</option><option>طفولة مبكرة</option></select></div><div class="field"><label>المرحلة</label><select><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option><option>متعدد المراحل</option></select></div></div><section class="section"><h2>متطلبات الأمن والسلامة</h2><div class="grid" id="cards"></div></section><div class="panel" id="workspace"><h2>اختر أحد المتطلبات</h2></div></div><script>const mods=[['annual','🗓️','الخطة السنوية'],['evac','🚨','الإخلاء والطوارئ'],['inspect','✅','التفقد وتقويم السلامة'],['risks','⚠️','سجل المخاطر والمعالجة'],['equipment','🧯','معدات وأجهزة السلامة'],['maintenance','🔧','الصيانة والمتابعة'],['training','🎓','التدريب والتوعية'],['incidents','📝','الحوادث والطوارئ'],['team','👥','فريق الأمن والسلامة'],['visitors','🚪','الأمن المدرسي والزوار'],['evidence','📷','الشواهد والإنجاز'],['final','📊','التقرير النهائي']];cards.innerHTML=mods.map(m=>`<div class="card" onclick="openM('${m[0]}')"><span class="ico">${m[1]}</span><b>${m[2]}</b><small>${m[0]==='evac'?'أربع خطط إخلاء مستقلة مع رفع الشواهد.':'اختيارات جاهزة وحفظ وطباعة.'}</small></div>`).join('');const names=['خطة الإخلاء الأولى','خطة الإخلاء الثانية','خطة الإخلاء الثالثة','خطة الإخلاء الرابعة'];let cur=0,files=[];function key(i){return'anjz_evac_'+i}function draw(){plans.innerHTML=names.map((n,i)=>`<div class="plan ${i===cur?'on':''}" onclick="openEv(${i})"><b>${n}</b><small>${localStorage.getItem(key(i))?'✓ محفوظة':'لم تستكمل'}</small></div>`).join('')}function evac(){return `<h2>🚨 الإخلاء والطوارئ</h2><div class="hint">اختر إحدى خطط الإخلاء الأربع. لكل خطة بيانات تنفيذ وشواهد مستقلة.</div><div class="plans" id="plans"></div><h3 id="evTitle"></h3><div class="formgrid"><div class="field"><label>تاريخ التنفيذ</label><input id="date" type="date"></div><div class="field"><label>طريقة التنبيه</label><select id="alarm"><option>جرس الإنذار</option><option>نداء داخلي</option><option>تنبيه يدوي</option></select></div><div class="field"><label>نقطة التجمع</label><select id="assembly"><option>الساحة الخارجية</option><option>الملعب</option><option>الفناء المحدد</option><option>موقع آمن خارج المبنى</option></select></div><div class="field"><label>نتيجة الخطة</label><select id="result"><option>ناجحة دون ملاحظات</option><option>ناجحة مع ملاحظات بسيطة</option><option>تحتاج إعادة تنفيذ</option></select></div><div class="field"><label>مدة الإخلاء بالدقائق</label><input id="duration" type="number" step="0.1"></div><div class="field"><label>الفئة المشاركة</label><select id="audience"><option>جميع منسوبي المدرسة</option><option>الطلاب</option><option>الطالبات</option><option>الهيئة التعليمية والإدارية</option></select></div></div><div class="field"><label>ملاحظات إضافية — اختياري</label><textarea id="notes"></textarea></div><div class="evidence"><b>📷 رفع شواهد هذه الخطة</b><p>يمكن رفع عدة صور أو ملفات.</p><input id="evidence" type="file" multiple accept="image/*,.pdf,.doc,.docx" onchange="showFiles()"><div class="preview" id="preview"></div></div><div class="actions"><button class="btn primary" onclick="saveEv()">حفظ الخطة</button><button class="btn ghost" onclick="window.print()">طباعة / PDF</button></div><div class="saved" id="saved">✓ تم حفظ بيانات الخطة.</div>`}function openEv(i){cur=i;files=[];const d=JSON.parse(localStorage.getItem(key(i))||'{}');evTitle.textContent=names[i];date.value=d.date||'';alarm.value=d.alarm||'جرس الإنذار';assembly.value=d.assembly||'الساحة الخارجية';result.value=d.result||'ناجحة دون ملاحظات';duration.value=d.duration||'';audience.value=d.audience||'جميع منسوبي المدرسة';notes.value=d.notes||'';preview.innerHTML=(d.evidenceNames||[]).map(x=>`<div class="file">📎 ${x}</div>`).join('');saved.style.display='none';draw()}function showFiles(){files=[...evidence.files];preview.innerHTML=files.map(f=>f.type.startsWith('image/')?`<img src="${URL.createObjectURL(f)}">`:`<div class="file">📎 ${f.name}</div>`).join('')}function saveEv(){const old=JSON.parse(localStorage.getItem(key(cur))||'{}');localStorage.setItem(key(cur),JSON.stringify({date:date.value,alarm:alarm.value,assembly:assembly.value,result:result.value,duration:duration.value,audience:audience.value,notes:notes.value,evidenceNames:files.length?files.map(f=>f.name):(old.evidenceNames||[])}));saved.style.display='block';draw()}function generic(m){return `<h2>${m[1]} ${m[2]}</h2><div class="formgrid"><div class="field"><label>الحالة</label><select><option>مكتمل</option><option>قيد التنفيذ</option><option>يحتاج متابعة</option></select></div><div class="field"><label>الأولوية</label><select><option>عادية</option><option>عالية</option><option>عاجلة</option></select></div><div class="field"><label>المسؤول</label><select><option>منسق الأمن والسلامة</option><option>فريق الأمن والسلامة</option><option>إدارة المدرسة</option><option>الصيانة</option></select></div></div><div class="field"><label>ملاحظات إضافية — اختياري</label><textarea></textarea></div><div class="actions"><button class="btn primary" onclick="alert('تم الحفظ')">حفظ</button><button class="btn ghost" onclick="window.print()">طباعة / PDF</button></div>`}function openM(id){if(id==='evac'){workspace.innerHTML=evac();draw();openEv(0);return}const m=mods.find(x=>x[0]===id);workspace.innerHTML=generic(m)}</script></body></html>
