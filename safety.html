n" class="screen"><div class="sectionTop"><button class="returnBtn" onclick="goHome()">← العودة إلى أقسام الأمن والسلامة</button><h2 id="sectionName"></h2></div><div class="panel" id="workspace"></div></div></div><script>const mods=[['annual','🗓️','الخطة السنوية'],['evac','🚨','الإخلاء والطوارئ'],['inspect','✅','التفقد وتقويم السلامة'],['risks','⚠️','سجل المخاطر والمعالجة'],['equipment','🧯','معدات وأجهزة السلامة'],['maintenance','🔧','الصيانة والمتابعة'],['training','🎓','التدريب والتوعية'],['incidents','📝','الحوادث والطوارئ'],['team','👥','فريق الأمن والسلامة'],['visitors','🚪','الأمن المدرسي والزوار'],['evidence','📷','الشواهد والإنجاز'],['final','📊','التقرير النهائي']];const names=['خطة الإخلاء الأولى','خطة الإخلاء الثانية','خطة الإخلاء الثالثة','خطة الإخلاء الرابعة'];const logo='https://upload.wikimedia.org/wikipedia/commons/7/76/Ministry_of_Education_%28Saudi_Arabia%29_%28logo%29.png';let cur=0,fileData=[];cards.innerHTML=mods.map(m=>`<div class="card" onclick="openM('${m[0]}')"><span class="ico">${m[1]}</span><b>${m[2]}</b><small>${m[0]==='evac'?'أربع خطط إخلاء مستقلة مع رفع الشواهد.':'اختيارات جاهزة وحفظ وتقرير.'}</small></div>`).join('');function key(i){return'anjz_evac_'+i}function schoolKey(){return'anjz_safety_school'}function saveSchool(){localStorage.setItem(schoolKey(),JSON.stringify({school:school.value,year:year.value,schoolType:schoolType.value,stage:stage.value}))}function loadSchool(){const d=JSON.parse(localStorage.getItem(schoolKey())||'{}');school.value=d.school||'';year.value=d.year||'1448 هـ';schoolType.value=d.schoolType||'بنين';stage.value=d.stage||'ابتدائي'}function goHome(){detailScreen.classList.remove('on');homeScreen.classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}function showDetail(t){saveSchool();homeScreen.classList.remove('on');detailScreen.classList.add('on');sectionName.textContent=t;window.scrollTo({top:0,behavior:'smooth'})}function draw(){plans.innerHTML=names.map((n,i)=>`<div class="plan ${i===cur?'on':''}" onclick="openEv(${i})"><b>${n}</b><small>${localStorage.getItem(key(i))?'✓ محفوظة':'لم تستكمل'}</small></div>`).join('')}function evac(){return `<div class="hint">اختر إحدى خطط الإخلاء الأربع. لكل خطة بيانات وشواهد مستقلة.</div><div class="plans" id="plans"></div><h3 id="evTitle"></h3><div class="formgrid"><div class="field"><label>تاريخ التنفيذ</label><input id="date" type="date"></div><div class="field"><label>طريقة التنبيه</label><select id="alarm"><option>جرس الإنذار</option><option>نداء داخلي</option><option>تنبيه يدوي</option></select></div><div class="field"><label>نقطة التجمع</label><select id="assembly"><option>الساحة الخارجية</option><option>الملعب</option><option>الفناء المحدد</option><option>موقع آمن خارج المبنى</option></select></div><div class="field"><label>نتيجة الخطة</label><select id="result"><option>ناجحة دون ملاحظات</option><option>ناجحة مع ملاحظات بسيطة</option><option>تحتاج إعادة تنفيذ</option></select></div><div class="field"><label>مدة الإخلاء بالدقائق</label><input id="duration" type="number" step="0.1"></div><div class="field"><label>الفئة المشاركة</label><select id="audience"><option>جميع منسوبي المدرسة</option><option>الطلاب</option><option>الطالبات</option><option>الهيئة التعليمية والإدارية</option></select></div></div><div class="field"><label>ملاحظات إضافية — اختياري</label><textarea id="notes"></textarea></div><div class="evidence"><b>📷 شواهد التنفيذ</b><p>ارفع الصور لتظهر داخل التقرير نفسه.</p><input id="evidence" type="file" multiple accept="image/*,.pdf,.doc,.docx" onchange="showFiles()"><div class="preview" id="preview"></div></div><div class="actions"><button class="btn primary" onclick="saveEv()">حفظ الخطة</button><button class="btn ghost" onclick="printEv()">إنشاء التقرير الاحترافي</button></div><div class="saved" id="saved"></div>`}function openEv(i){cur=i;const d=JSON.parse(localStorage.getItem(key(i))||'{}');evTitle.textContent=names[i];date.value=d.date||'';alarm.value=d.alarm||'جرس الإنذار';assembly.value=d.assembly||'الساحة الخارجية';result.value=d.result||'ناجحة دون ملاحظات';duration.value=d.duration||'';audience.value=d.audience||'جميع منسوبي المدرسة';notes.value=d.notes||'';fileData=d.evidence||[];renderEvidence();saved.style.display='none';draw()}function renderEvidence(){preview.innerHTML=fileData.map(f=>f.type&&f.type.startsWith('image/')&&f.data?`<img src="${f.data}">`:`<div class="file">📎 ${esc(f.name)}</div>`).join('')}function showFiles(){const fs=[...evidence.files];fileData=[];let p=fs.length;if(!p)return renderEvidence();fs.forEach(f=>{if(f.type.startsWith('image/')){const r=new FileReader();r.onload=()=>{fileData.push({name:f.name,type:f.type,data:r.result});if(!--p)renderEvidence()};r.onerror=()=>{fileData.push({name:f.name,type:f.type});if(!--p)renderEvidence()};r.readAsDataURL(f)}else{fileData.push({name:f.name,type:f.type});if(!--p)renderEvidence()}})}function saveEv(){saveSchool();const o={date:date.value,alarm:alarm.value,assembly:assembly.value,result:result.value,duration:duration.value,audience:audience.value,notes:notes.value,evidence:fileData};try{localStorage.setItem(key(cur),JSON.stringify(o));saved.style.display='block';saved.textContent='✓ تم حفظ '+names[cur]+' بنجاح.';draw();return true}catch(e){try{o.evidence=[];localStorage.setItem(key(cur),JSON.stringify(o));saved.style.display='block';saved.textContent='✓ حفظت البيانات. الصور الكبيرة ستظهر في التقرير الحالي فقط.';return true}catch(x){alert('تعذر الحفظ');return false}}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function reportPage(title,subtitle,content){const w=window.open('','_blank');if(!w){alert('اسمح بالنوافذ المنبثقة ثم حاول مرة أخرى.');return}w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eef2;color:#18333b;font-family:Tahoma,Ari 0}.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:34px;text-align:center}.sign b{display:block;color:#315d64}.line{border-bottom:1px solid #6f8589;height:34px}.foot{position:absolute;bottom:7mm;right:16mm;left:16mm;border-top:1px solid #e1e9ea;padding-top:5px;display:flex;justify-content:space-between;color:#87999d;font-size:9px}.accent{position:absolute;bottom:-35px;left:-35px;width:110px;height:110px;border-radius:50%;border:18px solid #e3f2ef}@media(max-width:800px){.page{width:100%;min-height:100vh;margin:0;padding:22px 16px 70px;box-shadow:none}.info,.evidenceGrid{grid-template-columns:1fr}.cell:nth-child(odd){border-left:0}.photo img{height:auto;max-height:340px}.sign{gap:20px}.logo{width:105px}}@media print{body{background:#fff}.tools{display:none}.page{margin:0;box-shadow:none;width:210mm;min-height:297mm}.photo img{height:185px}@page{size:A4;margin:0}}</style></head><body><div class="tools"><button onclick="window.print()">طباعة / حفظ PDF</button></div><main class="page"><div class="header"><img class="logo" src="${logo}" alt="وزارة التعليم"><div class="school"><strong>وزارة التعليم</strong>ملف الأمن والسلامة المدرسية</div></div><div class="title"><span class="tag">الأمن والسلامة المدرسية</span><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${content}<div class="sign"><div><b>منسق الأمن والسلامة</b><div class="line"></div></div><div><b>مدير/ة المدرسة</b><div class="line"></div></div></div><div class="foot"><span>وزارة التعليم — المملكة العربية السعودية</span><span>تم إعداد التقرير عبر أنجز AI</span></div><div class="accent"></div></main></body></html>`);w.document.close()}function printEv(){const current={date:date.value,alarm:alarm.value,assembly:assembly.value,result:result.value,duration:duration.value,audience:audience.value,notes:notes.value,evidence:fileData};saveEv();const s=JSON.parse(localStorage.getItem(schoolKey())||'{}');const imgs=(current.evidence||[]).map((f,i)=>f.type&&f.type.startsWith('image/')&&f.data?`<div class="photo"><img src="${f.data}"><small>شاهد ${i+1}</small></div>`:`<div class="attachment">📎 ${esc(f.name)}</div>`).join('');const objective='تنفيذ خطة إخلاء تدريبية لرفع مستوى الجاهزية وتعزيز الاستجابة المنظمة والآمنة لدى منسوبي المدرسة عند حالات الطوارئ.';reportPage('تقرير تنفيذ '+names[cur],s.school||'تقرير الأمن والسلامة',`<section class="sec"><h2>بيانات المدرسة</h2><div class="info"><div class="cell"><b>اسم المدرسة</b><span>${esc(s.school||'—')}</span></div><div class="cell"><b>العام الدراسي</b><span>${esc(s.year||'—')}</span></div><div class="cell"><b>المرحلة</b><span>${esc(s.stage||'—')}</span></div><div class="cell"><b>نوع المدرسة</b><span>${esc(s.schoolType||'—')}</span></div></div></section><section class="sec"><h2>هدف التنفيذ</h2><div class="summary">${objective}</div></section><section class="sec"><h2>بيانات التنفيذ</h2><div class="info"><div class="cell"><b>تاريخ التنفيذ</b><span>${esc(current.date||'—')}</span></div><div class="cell"><b>طريقة التنبيه</b><span>${esc(current.alarm)}</span></div><div class="cell"><b>نقطة التجمع</b><span>${esc(current.assembly)}</span></div><div class="cell"><b>مدة الإخلاء</b><span>${esc(current.duration||'—')} دقيقة</span></div><div class="cell"><b>الفئة المشاركة</b><span>${esc(current.audience)}</span></div><div class="cell"><b>نتيجة التنفيذ</b><span>${esc(current.result)}</span></div></div></section><section class="sec"><h2>النتائج والملاحظات</h2><div class="summary">تم تنفيذ ${names[cur]} وفق إجراءات الإخلاء المحددة، وكانت نتيجة التنفيذ: <b>${esc(current.result)}</b>. ${current.notes?'الملاحظات: '+esc(current.notes):'لم تسجل ملاحظات إضافية.'}</div></section>${imgs?`<section class="sec"><h2>شواهد التنفيذ</h2><div class="evidenceGrid">${imgs}</div></section>`:''}`)}function generic(m){return `<div class="formgrid"><div class="field"><label>الحالة</label><select id="gStatus"><option>مكتمل</option><option>قيد التنفيذ</option><option>يحتاج متابعة</option></select></div><div class="field"><label>الأولوية</label><select id="gPriority"><option>عادية</option><option>عالية</option><option>عاجلة</option></select></div><div class="field"><label>المسؤول</label><select id="gOwner"><option>منسق الأمن والسلامة</option><option>فريق الأمن والسلامة</option><option>إدارة المدرسة</option><option>الصيانة</option></select></div></div><div class="field"><label>ملاحظات إضافية — اختياري</label><textarea id="gNotes"></textarea></div><div class="actions"><button class="btn primary" onclick="saveGeneric('${m[0]}')">حفظ</button><button class="btn ghost" onclick="printGeneric('${m[0]}')">إنشاء التقرير الاحترافي</button></div><div class="saved" id="gSaved"></div>`}function saveGeneric(id){saveSchool();localStorage.setItem('anjz_safety_'+id,JSON.stringify({status:gStatus.value,priority:gPriority.value,owner:gOwner.value,notes:gNotes.value}));gSaved.style.display='block';gSaved.textContent='✓ تم الحفظ بنجاح.'}function loadGeneric(id){const d=JSON.parse(localStorage.getItem('anjz_safety_'+id)||'{}');gStatus.value=d.status||'مكتمل';gPriority.value=d.priority||'عادية';gOwner.value=d.owner||'منسق الأمن والسلامة';gNotes.value=d.notes||''}function printGeneric(id){saveGeneric(id);const m=mods.find(x=>x[0]===id),d=JSON.parse(localStorage.getItem('anjz_safety_'+id)||'{}'),s=JSON.parse(localStorage.getItem(schoolKey())||'{}');reportPage('تقرير '+m[2],s.school||'ملف الأمن والسلامة',`<section class="sec"><h2>بيانات المدرسة</h2><div class="info"><div class="cell"><b>اسم المدرسة</b><span>${esc(s.school||'—')}</span></div><div class="cell"><b>العام الدراسي</b><span>${esc(s.year||'—')}</span></div><div class="cell"><b>المرحلة</b><span>${esc(s.stage||'—')}</span></div><div class="cell"><b>نوع المدرسة</b><span>${esc(s.schoolType||'—')}</span></div></div></section><section class="sec"><h2>بيانات المتابعة</h2><div class="info"><div class="cell"><b>الحالة</b><span>${esc(d.status)}</span></div><div class="cell"><b>الأولوية</b><span>${esc(d.priority)}</span></div><div class="cell"><b>المسؤول</b><span>${esc(d.owner)}</span></div><div class="cell"><b>الملاحظات</b><span>${esc(d.notes||'لا توجد')}</span></div></div></section><section class="sec"><h2>الخلاصة</h2><div class="summary">تم توثيق ومتابعة متطلب «${esc(m[2])}» ضمن ملف الأمن والسلامة المدرسية، وحالته الحالية: <b>${esc(d.status)}</b>.</div></section>`)}function openM(id){const m=mods.find(x=>x[0]===id);showDetail(m[1]+' '+m[2]);if(id==='evac'){workspace.innerHTML=evac();draw();openEv(0)}else{workspace.innerHTML=generic(m);loadGeneric(id)}}loadSchool();</script></body></html>
