<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأمن والسلامة | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,#4430a9,#7058e6);color:white;border-radius:24px;padding:30px;margin:18px 0}.hero h1{margin:0 0 8px}.hero p{margin:0;line-height:1.8}.meta,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:white;border:1px solid #e7e3f1;border-radius:18px;padding:18px}.card{cursor:pointer;min-height:140px}.card:hover{border-color:#6244dc}.card b{display:block;margin:8px 0}.card small{color:#716d83;line-height:1.6}.ico{font-size:28px}.field{margin-bottom:12px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd9e9;border-radius:10px;background:white}.field textarea{min-height:85px}.section{margin:20px 0}.panel{display:none}.panel.show{display:block}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #eee}.row select{padding:9px;border:1px solid #ddd9e9;border-radius:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.primary,.ghost{border:0;border-radius:12px;padding:12px 17px;font-weight:900;cursor:pointer}.primary{background:#5b3fd6;color:white}.ghost{background:#f0edfa;color:#4936a6}.status{padding:12px;border-radius:10px;background:#f4f2fb;margin-top:12px;line-height:1.8}.hint{background:#fff8df;border:1px solid #f0df9b;padding:12px;border-radius:11px;margin:10px 0;color:#65541d}.report{margin-top:14px;background:#faf9fe;border:1px solid #ebe8f4;border-radius:14px;padding:16px}.pill{display:inline-block;background:#eee9ff;color:#5538c8;border-radius:20px;padding:5px 9px;margin:3px;font-size:12px}@media(max-width:800px){.meta,.grid,.formgrid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}@media(max-width:520px){.meta,.grid,.formgrid,.row{grid-template-columns:1fr}.actions button{width:100%}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI — الأمن والسلامة</div><a class="back" href="index.html">← الرئيسية</a></div><div class="hero"><h1>🛡️ ملف الأمن والسلامة المدرسية</h1><p>أنجز المتطلبات بالاختيار من قوائم جاهزة بدل الكتابة. اكتب فقط الملاحظات الخاصة بمدرستك عند الحاجة.</p></div><div class="meta panel" style="display:grid"><div class="field"><label>اسم المدرسة</label><input id="school"></div><div class="field"><label>العام الدراسي</label><select id="year"><option>1448 هـ</option><option>1449 هـ</option><option>1450 هـ</option></select></div><div class="field"><label>نوع المدرسة</label><select id="schoolType"><option>بنين</option><option>بنات</option><option>طفولة مبكرة</option></select></div><div class="field"><label>المرحلة</label><select id="stage"><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option><option>متعدد المراحل</option></select></div></div><div class="section"><h2>متطلبات الأمن والسلامة</h2><div class="grid" id="cards"></div></div><div id="workspace"></div></div><script>const modules=[['annual','🗓️','الخطة السنوية','برامج وأهداف ومسؤوليات ومؤشرات جاهزة للاختيار.'],['evac','🚨','الإخلاء والطوارئ','نوع الفرضية ونقطة التجمع والنتيجة والإجراءات.'],['inspect','✅','التفقد وتقويم السلامة','تقييم كل متطلب: سليم، يحتاج معالجة، غير متوفر، لا ينطبق.'],['risks','⚠️','سجل المخاطر والمعالجة','اختر الخطر والدرجة والحالة ويقترح أنجز المعالجة.'],['equipment','🧯','معدات وأجهزة السلامة','حالة الطفايات والإنذار والإضاءة والإسعافات.'],['maintenance','🔧','الصيانة والمتابعة','نوع الصيانة وحالة الطلب والجهة والأولوية.'],['training','🎓','التدريب والتوعية','برامج توعوية جاهزة وفئات مستهدفة ونتيجة التنفيذ.'],['incidents','📝','الحوادث والطوارئ','نوع الحالة والإجراء الفوري وحالة الإغلاق.'],['team','👥','فريق الأمن والسلامة','تشكيل الفريق والمهام والاجتماعات والمتابعة.'],['visitors','🚪','الأمن المدرسي والزوار','إجراءات الدخول والخروج والحراسة.'],['evidence','📷','الشواهد والإنجاز','نوع الشاهد وحالة التوثيق ونسبة الإنجاز.'],['final','📊','التقرير النهائي','تجميع النتائج والتوصيات في تقرير للطباعة.']];const req=['مخارج الطوارئ خالية من العوائق','لوحات مخارج الطوارئ واضحة','نقاط التجمع محددة','أجهزة الإنذار جاهزة','طفايات الحريق متوفرة وصالحة','معدات السلامة مفحوصة دورياً','التمديدات الكهربائية سليمة ظاهرياً','الممرات والسلالم خالية من العوائق','حقيبة الإسعافات الأولية متوفرة','أرقام الطوارئ واضحة','منسوبو المدرسة على معرفة بإجراءات الطوارئ','تم تنفيذ فرضية إخلاء وتوثيقها'];let saved={},risks=[];cards.innerHTML=modules.map(m=>'<div class="card" onclick="openP(\''+m[0]+'\')"><span class="ico">'+m[1]+'</span><b>'+m[2]+'</b><small>'+m[3]+'</small></div>').join('');function sel(id,label,opts){return '<div class="field"><label>'+label+'</label><select id="'+id+'">'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'}function input(id,label,type='text'){return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+type+'"></div>'}function note(){return '<div class="field"><label>ملاحظات إضافية — اختياري</label><textarea id="notes" placeholder="اكتب فقط ما لا تغطيه الاختيارات..."></textarea></div>'}function buttons(title){return '<div class="actions"><button class="primary" onclick="generate(\''+title+'\')">إنشاء التقرير</button><button class="ghost" onclick="window.print()">طباعة / PDF</button></div><div id="out"></div>'}function openP(id){let h='';if(id==='annual')h='<h2>🗓️ الخطة السنوية</h2><div class="formgrid">'+sel('goal','الهدف',['رفع مستوى الجاهزية','الوقاية من المخاطر','رفع الوعي بالسلامة','تحسين سرعة الاستجابة للطوارئ'])+sel('program','البرنامج',['فرضية إخلاء','جولة تفقدية','برنامج توعوي','فحص معدات السلامة','تدريب على الإسعافات الأولية','معالجة مخاطر المبنى'])+sel('freq','التكرار',['مرة واحدة','شهري','كل فصل دراسي','مرتان سنوياً','حسب الحاجة'])+sel('owner','المسؤول',['منسق الأمن والسلامة','فريق الأمن والسلامة','إدارة المدرسة','الحارس','جهة الصيانة'])+sel('indicator','مؤشر الإنجاز',['تم التنفيذ','نسبة الجاهزية','عدد المستفيدين','إغلاق الملاحظات','زمن الإخلاء'])+'</div>'+note()+buttons('الخطة السنوية للأمن والسلامة');if(id==='evac')h='<h2>🚨 الإخلاء والطوارئ</h2><div class="formgrid">'+sel('case','نوع الفرضية',['حريق','تماس كهربائي','تسرب غاز','زلزال','أمطار وسيول','حالة طبية طارئة','حالة أخرى'])+sel('alarm','طريقة التنبيه',['جرس الإنذار','نداء داخلي','تنبيه يدوي'])+sel('assembly','نقطة التجمع',['الساحة الخارجية','الملعب','الفناء المحدد','موقع آمن خارج المبنى'])+sel('result','نتيجة الفرضية',['ناجحة دون ملاحظات','ناجحة مع ملاحظات بسيطة','تحتاج إعادة تنفيذ'])+input('duration','مدة الإخلاء بالدقائق','number')+sel('count','الفئة المشاركة',['جميع منسوبي المدرسة','الطلاب','الطالبات','الهيئة التعليمية والإدارية'])+'</div>'+note()+buttons('تقرير فرضية الإخلاء');if(id==='inspect')h='<h2>✅ التفقد وتقويم السلامة</h2><div class="hint">اختر حالة كل بند. سيحسب أنجز الجاهزية ويحدد ما يحتاج معالجة.</div>'+req.map((x,i)=>'<div class="row"><b>'+x+'</b><select id="r'+i+'"><option>سليم</option><option>يحتاج معالجة</option><option>غير متوفر</option><option>لا ينطبق</option></select><select id="p'+i+'"><option>أولوية عادية</option><option>أولوية عالية</option><option>عاجل</option></select></div>').join('')+'<div class="actions"><button class="primary" onclick="inspectReport()">حساب الجاهزية وإنشاء التقرير</button><button class="ghost" onclick="window.print()">طباعة / PDF</button></div><div id="out"></div>';if(id==='risks')h='<h2>⚠️ سجل المخاطر والمعالجة</h2><div class="formgrid">'+sel('risk','نوع الخطر',['مخرج طوارئ مغلق أو معاق','طفاية غير صالحة','جهاز إنذار غير جاهز','تمديد كهربائي مكشوف','أرضية زلقة','سلم أو حاجز غير آمن','ازدحام عند المداخل','تسرب مياه','تخزين غير آمن','خطر آخر'])+sel('level','درجة الخطورة',['منخفض','متوسط','مرتفع','حرج'])+sel('status','حالة المعالجة',['جديد','تحت المعالجة','تمت المعالجة','مؤجل لمسوغ'])+sel('owner2','المسؤول',['إدارة المدرسة','منسق الأمن والسلامة','الصيانة','الحارس','جهة خارجية'])+'</div><div class="actions"><button class="primary" onclick="addRisk()">إضافة الخطر</button></div><div id="riskList"></div>'+buttons('سجل المخاطر وخطة المعالجة');if(id==='equipment')h=checkModule('معدات وأجهزة السلامة',['طفايات الحريق','نظام الإنذار','إضاءة الطوارئ','لوحات المخارج','خراطيم/شبكة الإطفاء','كاشفات الدخان','حقيبة الإسعافات الأولية']);if(id==='maintenance')h='<h2>🔧 الصيانة والمتابعة</h2><div class="formgrid">'+sel('maint','نوع الصيانة',['كهرباء','إنذار','طفايات','أبواب ومخارج','إنارة طوارئ','تسرب مياه','تكييف وتهوية','مبنى وممرات'])+sel('mstatus','الحالة',['تم الرصد','تم رفع الطلب','جاري التنفيذ','تم الإغلاق'])+sel('priority','الأولوية',['عادية','عالية','عاجلة'])+sel('provider','الجهة',['صيانة المدرسة','شركة متعاقدة','إدارة التعليم','جهة أخرى'])+'</div>'+note()+buttons('تقرير الصيانة والمتابعة');if(id==='training')h='<h2>🎓 التدريب والتوعية</h2><div class="formgrid">'+sel('training','البرنامج',['السلامة من الحريق','الإخلاء والطوارئ','استخدام طفاية الحريق','الإسعافات الأولية','السلامة الكهربائية','السلامة أثناء الأمطار','التوعية بالمخاطر'])+sel('audience','الفئة',['الطلاب','الطالبات','المعلمون','المعلمات','الإداريون','جميع منسوبي المدرسة'])+sel('method','طريقة التنفيذ',['لقاء توعوي','ورشة عمل','تطبيق عملي','منشورات ولوحات','إذاعة مدرسية'])+sel('tresult','النتيجة',['تم بنجاح','تم مع ملاحظات','يحتاج إعادة/استكمال'])+'</div>'+note()+buttons('تقرير التدريب والتوعية');if(id==='incidents')h='<h2>📝 الحوادث والحالات الطارئة</h2><div class="formgrid">'+sel('incident','نوع الحالة',['إصابة بسيطة','حالة صحية طارئة','حريق/دخان','تماس كهربائي','سقوط/انزلاق','تسرب مياه','مشكلة إنشائية','حالة أخرى'])+sel('action','الإجراء الفوري',['إسعاف أولي','إخلاء الموقع','فصل مصدر الخطر','الاتصال بالطوارئ','إبلاغ الإدارة','عزل المنطقة'])+sel('notify','الجهة المبلغة',['إدارة المدرسة','ولي الأمر','الهلال الأحمر','الدفاع المدني','الصيانة','لا يلزم'])+sel('closed','الحالة',['تم الإغلاق','تحت المتابعة','تحتاج إجراء إضافي'])+'</div>'+note()+buttons('تقرير حالة طارئة');if(id==='team')h='<h2>👥 فريق الأمن والسلامة</h2><div class="formgrid">'+sel('teamTask','المهمة',['التفقد الدوري','الإخلاء','الإسعافات الأولية','متابعة المعدات','التوعية والتدريب','متابعة المخاطر'])+sel('meeting','الاجتماع',['بداية العام','اجتماع دوري','قبل فرضية الإخلاء','بعد حادث/ملاحظة','نهاية الفصل'])+sel('decision','القرار',['اعتماد الخطة','معالجة ملاحظات','تنفيذ تدريب','رفع طلب صيانة','متابعة إجراء سابق'])+sel('follow','المتابعة',['مكتمل','قيد التنفيذ','متأخر'])+'</div>'+note()+buttons('محضر فريق الأمن والسلامة');if(id==='visitors')h=checkModule('الأمن المدرسي والزوار',['تنظيم الدخول والخروج','التحقق من هوية الزائر وفق الإجراء المعتمد','توثيق الزيارة','معرفة الحارس بالمخارج ومعدات السلامة','الإبلاغ عن مصادر الخطر','التحقق من خلو المبنى بعد الدوام']);if(id==='evidence')h='<h2>📷 الشواهد والإنجاز</h2><div class="formgrid">'+sel('evidenceType','نوع الشاهد',['صورة تنفيذ','محضر','نموذج تفقد','طلب صيانة','شهادة تدريب','تقرير إخلاء','تعميم/توعية'])+sel('evidenceStatus','حالة التوثيق',['موثق','ينقصه شاهد','بانتظار الاعتماد'])+sel('completion','نسبة الإنجاز',['100%','75%','50%','25%'])+'</div>'+note()+buttons('تقرير الشواهد والإنجاز');if(id==='final')h='<h2>📊 التقرير النهائي</h2><p>يجمع ملخص الأعمال المسجلة في هذه الجلسة ويولد توصيات عامة.</p><div class="actions"><button class="primary" onclick="finalReport()">إنشاء التقرير النهائي</button><button class="ghost" onclick="window.print()">طباعة / PDF</button></div><div id="out"></div>';workspace.innerHTML='<div class="panel show section">'+h+'</div>';workspace.scrollIntoView({behavior:'smooth'})}function checkModule(title,items){return '<h2>'+title+'</h2>'+items.map((x,i)=>'<div class="row"><b>'+x+'</b><select><option>سليم/متوفر</option><option>يحتاج معالجة</option><option>غير متوفر</option><option>لا ينطبق</option></select><select><option>فحص حديث</option><option>يحتاج فحص</option><option>يحتاج صيانة</option></select></div>').join('')+note()+buttons(title)}function values(){return [...workspace.querySelectorAll('select')].map(s=>s.previousElementSibling?.tagName==='LABEL'?'<span class="pill">'+s.previousElementSibling.textContent+': '+s.value+'</span>':'').join('')}function generate(title){out.innerHTML='<div class="report"><h3>'+title+'</h3><p><b>المدرسة:</b> '+school.value+' — <b>العام:</b> '+year.value+'</p>'+values()+'<p><b>الملاحظات:</b> '+(document.getElementById('notes')?.value||'لا توجد ملاحظات إضافية.')+'</p><p><b>التوصية:</b> الاستمرار في المتابعة الدورية وإغلاق أي ملاحظات حسب الأولوية وتوثيق التنفيذ بالشواهد.</p></div>';saved[title]=out.innerHTML}function inspectReport(){let ok=0,need=[];req.forEach((x,i)=>{let v=document.getElementById('r'+i).value;if(v==='سليم'||v==='لا ينطبق')ok++;else need.push(x+' — '+v+' — '+document.getElementById('p'+i).value)});let pct=Math.round(ok/req.length*100);out.innerHTML='<div class="report"><h3>نتيجة تقويم السلامة</h3><h2>'+pct+'% جاهزية</h2><p>البنود السليمة/غير المنطبقة: '+ok+' من '+req.length+'.</p><h4>تحتاج متابعة:</h4><ul>'+(need.length?need.map(x=>'<li>'+x+'</li>').join(''):'<li>لا توجد ملاحظات.</li>')+'</ul></div>';saved.inspect=out.innerHTML}const fixes={'مخرج طوارئ مغلق أو معاق':'إزالة العائق فوراً وضمان بقاء مسار الخروج مفتوحاً.','طفاية غير صالحة':'عزل الطفاية غير الصالحة ورفع طلب فحص/استبدال.','جهاز إنذار غير جاهز':'رفع طلب صيانة وفحص نظام الإنذار.','تمديد كهربائي مكشوف':'عزل الموقع ورفع طلب صيانة كهربائية عاجل.','أرضية زلقة':'تجفيف/عزل الموقع ووضع تنبيه حتى إزالة السبب.','سلم أو حاجز غير آمن':'منع الاستخدام مؤقتاً ورفع طلب معالجة.','ازدحام عند المداخل':'تنظيم مسارات الدخول والخروج وتوزيع الإشراف.','تسرب مياه':'عزل مصدر الخطر ورفع طلب صيانة.','تخزين غير آمن':'إعادة ترتيب المواد وإبعادها عن المخارج ومصادر الحرارة.','خطر آخر':'تقييم الخطر وتحديد إجراء تصحيحي مناسب.'};function addRisk(){let r={name:risk.value,level:level.value,status:status.value,owner:owner2.value,fix:fixes[risk.value]};risks.push(r);riskList.innerHTML=risks.map((x,i)=>'<div class="status"><b>'+x.name+'</b> — '+x.level+' — '+x.status+'<br><b>الإجراء المقترح:</b> '+x.fix+'<br><b>المسؤول:</b> '+x.owner+'</div>').join('')}function finalReport(){let r=risks.length?risks.map(x=>'<li>'+x.name+' — '+x.level+' — '+x.status+' — '+x.fix+'</li>').join(''):'<li>لا توجد مخاطر مسجلة في الجلسة.</li>';out.innerHTML='<div class="report"><h2>التقرير النهائي للأمن والسلامة</h2><p><b>المدرسة:</b> '+school.value+' | <b>العام:</b> '+year.value+' | <b>المرحلة:</b> '+stage.value+'</p><h3>المخاطر المسجلة</h3><ul>'+r+'</ul><h3>الأعمال المنجزة</h3><p>'+Object.keys(saved).length+' تقرير/إجراء تم إنشاؤه خلال الجلسة.</p><h3>التوصيات</h3><p>استمرار التفقد الدوري، معالجة الملاحظات ذات الأولوية، متابعة جاهزية معدات السلامة، تنفيذ فرضيات الإخلاء والتدريب، وتوثيق الصيانة والشواهد.</p></div>'}</script></body></html>
