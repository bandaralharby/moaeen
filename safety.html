<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأمن والسلامة | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}button,input,select,textarea{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero{background:linear-gradient(135deg,#4430a9,#7058e6);color:#fff;border-radius:24px;padding:30px;margin:18px 0}.hero h1{margin:0 0 8px}.meta,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e7e3f1;border-radius:18px;padding:18px}.card{cursor:pointer;min-height:135px}.card:hover{border-color:#6244dc}.card b{display:block;margin:8px 0}.card small{color:#716d83;line-height:1.6}.ico{font-size:28px}.section{margin:20px 0}.field{margin-bottom:12px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd9e9;border-radius:10px;background:#fff}.field textarea{min-height:80px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:900;cursor:pointer}.primary{background:#5b3fd6;color:#fff}.ghost{background:#f0edfa;color:#4936a6}.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.plan{border:1px solid #ded9ed;border-radius:14px;padding:15px;background:#fff;cursor:pointer}.plan.on{border:2px solid #6244dc;background:#f8f6ff}.plan small{display:block;color:#777;margin-top:5px}.evidence{border:2px dashed #cfc8e8;border-radius:16px;padding:17px;background:#fcfbff;margin-top:14px}.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.preview img{width:100%;height:110px;object-fit:cover;border-radius:10px}.file{background:#f0edfa;padding:10px;border-radius:10px;font-size:12px}.saved{display:none;margin-top:12px;background:#eef9f3;color:#286443;padding:12px;border-radius:10px}.hint{background:#fff8df;border:1px solid #f0df9b;padding:12px;border-radius:11px;margin:10px 0;color:#65541d}.screen{display:none}.screen.on{display:block}.sectionTop{display:flex;align-items:center;gap:12px;margin:10px 0 18px}.sectionTop h2{margin:0}.returnBtn{border:0;background:#eee9ff;color:#5538c8;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer}@media(max-width:800px){.meta,.grid,.plans,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.meta,.grid,.plans,.formgrid{grid-template-columns:1fr}.preview{grid-template-columns:1fr 1fr}.actions .btn{width:100%}.sectionTop{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI — الأمن والسلامة</div><a class="back" href="index.html">← الرئيسية</a></div><div id="homeScreen" class="screen on"><div class="hero"><h1>🛡️ ملف الأمن والسلامة المدرسية</h1><div>متطلبات منظمة باختيارات جاهزة، مع توثيق الشواهد والتقارير.</div></div><div class="meta panel"><div class="field"><label>اسم المدرسة</label><input id="school"></div><div class="field"><label>العام الدراسي</label><select id="year"><option>1448 هـ</option><option>1449 هـ</option></select></div><div class="field"><label>نوع المدرسة</label><select id="schoolType"><option>بنين</option><option>بنات</option><option>طفولة مبكرة</option></select></div><div class="field"><label>المرحلة</label><select id="stage"><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option><option>متعدد المراحل</option></select></div></div><section class="section"><h2>متطلبات الأمن والسلامة</h2><div class="grid" id="cards"></div></section></div><div id="detailScreen" class="screen"><div class="sectionTop"><button class="returnBtn" onclick="goHome()">← العودة إلى أقسام الأمن والسلامة</button><h2 id="sectionName"></h2></div><div class="panel" id="workspace"></div></div></div><script>const mods=[['annual','🗓️','الخطة السنوية'],['evac','🚨','الإخلاء والطوارئ'],['inspect','✅','التفقد وتقويم السلامة'],['risks','⚠️','سجل المخاطر والمعالجة'],['equipment','🧯','معدات وأجهزة السلامة'],['maintenance','🔧','الصيانة والمتابعة'],['training','🎓','التدريب والتوعية'],['incidents','📝','الحوادث والطوارئ'],['team','👥','فريق الأمن والسلامة'],['visitors','🚪','الأمن المدرسي والزوار'],['evidence','📷','الشواهد والإنجاز'],['final','📊','التقرير النهائي']];const names=['خطة الإخلاء الأولى','خطة الإخلاء الثانية','خطة الإخلاء الثالثة','خطة الإخلاء الرابعة'];let cur=0,fileData=[];cards.innerHTML=mods.map(m=>`<div class="card" onclick="openM('${m[0]}')"><span class="ico">${m[1]}</span><b>${m[2]}</b><small>${m[0]==='evac'?'أربع خطط إخلاء مستقلة مع رفع الشواهد.':'اختيارات جاهزة وحفظ وطباعة.'}</small></div>`).join('');function key(i){return'anjz_evac_'+i}function schoolKey(){return'anjz_safety_school'}function saveSchool(){localStorage.setItem(schoolKey(),JSON.stringify({school:school.value,year:year.value,schoolType:schoolType.value,stage:stage.value}))}function loadSchool(){const d=JSON.parse(localStorage.getItem(schoolKey())||'{}');school.value=d.school||'';year.value=d.year||'1448 هـ';schoolType.value=d.schoolType||'بنين';stage.value=d.stage||'ابتدائي'}function goHome(){detailScreen.classList.remove('on');homeScreen.classList.add('on');window.scrollTo({top:0,behavior:'smooth'})}function showDetail(title){saveSchool();homeScreen.classList.remove('on');detailScreen.classList.add('on');sectionName.textContent=title;window.scrollTo({top:0,behavior:'smooth'})}function draw(){plans.innerHTML=names.map((n,i)=>`<div class="plan ${i===cur?'on':''}" onclick="openEv(${i})"><b>${n}</b><small>${localStorage.getItem(key(i))?'✓ محفوظة':'لم تستكمل'}</small></div>`).join('')}function evac(){return `<div class="hint">اختر إحدى خطط الإخلاء الأربع. لكل خطة بيانات تنفيذ وشواهد مستقلة.</div><div class="plans" id="plans"></div><h3 id="evTitle"></h3><div class="formgrid"><div class="field"><label>تاريخ التنفيذ</label><input id="date" type="date"></div><div class="field"><label>طريقة التنبيه</label><select id="alarm"><option>جرس الإنذار</option><option>نداء داخلي</option><option>تنبيه يدوي</option></select></div><div class="field"><label>نقطة التجمع</label><select id="assembly"><option>الساحة الخارجية</option><option>الملعب</option><option>الفناء المحدد</option><option>موقع آمن خارج المبنى</option></select></div><div class="field"><label>نتيجة الخطة</label><select id="result"><option>ناجحة دون ملاحظات</option><option>ناجحة مع ملاحظات بسيطة</option><option>تحتاج إعادة تنفيذ</option></select></div><div class="field"><label>مدة الإخلاء بالدقائق</label><input id="duration" type="number" step="0.1"></div><div class="field"><label>الفئة المشاركة</label><select id="audience"><option>جميع منسوبي المدرسة</option><option>الطلاب</option><option>الطالبات</option><option>الهيئة التعليمية والإدارية</option></select></div></div><div class="field"><label>ملاحظات إضافية — اختياري</label><textarea id="notes"></textarea></div><div class="evidence"><b>📷 رفع شواهد هذه الخطة</b><p>يمكن رفع عدة صور. الصور الصغيرة تحفظ مع الخطة في هذا الجهاز.</p><input id="evidence" type="file" multiple accept="image/*,.pdf,.doc,.docx" onchange="showFiles()"><div class="preview" id="preview"></div></div><div class="actions"><button class="btn primary" onclick="saveEv()">حفظ الخطة</button><button class="btn ghost" onclick="printEv()">طباعة / حفظ PDF</button></div><div class="saved" id="saved"></div>`}function openEv(i){cur=i;fileData=[];const d=JSON.parse(localStorage.getItem(key(i))||'{}');evTitle.textContent=names[i];date.value=d.date||'';alarm.value=d.alarm||'جرس الإنذار';assembly.value=d.assembly||'الساحة الخارجية';result.value=d.result||'ناجحة دون ملاحظات';duration.value=d.duration||'';audience.value=d.audience||'جميع منسوبي المدرسة';notes.value=d.notes||'';fileData=d.evidence||[];renderEvidence();saved.style.display='none';draw()}function renderEvidence(){preview.innerHTML=fileData.map(f=>f.type&&f.type.startsWith('image/')&&f.data?`<img src="${f.data}" alt="شاهد">`:`<div class="file">📎 ${esc(f.name)}</div>`).join('')}function showFiles(){const fs=[...evidence.files];fileData=[];let p=fs.length;if(!p)return renderEvidence();fs.forEach(f=>{if(f.type.startsWith('image/')&&f.size<1200000){const r=new FileReader();r.onload=()=>{fileData.push({name:f.name,type:f.type,data:r.result});if(!--p)renderEvidence()};r.onerror=()=>{fileData.push({name:f.name,type:f.type});if(!--p)renderEvidence()};r.readAsDataURL(f)}else{fileData.push({name:f.name,type:f.type});if(!--p)renderEvidence()}})}function saveEv(){try{saveSchool();localStorage.setItem(key(cur),JSON.stringify({date:date.value,alarm:alarm.value,assembly:assembly.value,result:result.value,duration:duration.value,audience:audience.value,notes:notes.value,evidence:fileData}));saved.style.display='block';saved.textContent='✓ تم حفظ '+names[cur]+' بنجاح.';draw();return true}catch(e){alert('تعذر الحفظ. قد يكون حجم الشواهد كبيرًا. جرّب صورًا أقل أو أصغر.');return false}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function printDoc(title,body){const w=window.open('','_blank');if(!w){alert('تعذر فتح نافذة الطباعة. اسمح بالنوافذ المنبثقة لهذا الموقع ثم حاول مرة أخرى.');return}w.document.open();w.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>body{font-family:Tahoma,Arial,sans-serif;color:#111;max-width:800px;margin:auto;padding:24px;line-height:1.9}h1{text-align:center;color:#4430a9;border-bottom:2px solid #4430a9;padding-bottom:12px}.pr{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0;break-inside:avoid}.ev img{max-width:45%;max-height:260px;object-fit:contain;margin:7px;border-radius:8px}@page{size:A4;margin:12mm}@media print{body{padding:0}}</style></head><body><h1>${esc(title)}</h1>${body}<script>window.onload=function(){setTimeout(function(){window.print()},350)}<\/script></body></html>`);w.document.close()}function printEv(){if(!saveEv())return;const d=JSON.parse(localStorage.getItem(key(cur))||'{}'),s=JSON.parse(localStorage.getItem(schoolKey())||'{}');const ev=(d.evidence||[]).map(f=>f.type&&f.type.startsWith('image/')&&f.data?`<img src="${f.data}" alt="شاهد">`:`<div>📎 ${esc(f.name)}</div>`).join('');printDoc('تقرير '+names[cur],`<div class="pr"><b>المدرسة:</b> ${esc(s.school||'—')} &nbsp; | &nbsp; <b>العام:</b> ${esc(s.year||'—')}<br><b>المرحلة:</b> ${esc(s.stage||'—')} &nbsp; | &nbsp; <b>نوع المدرسة:</b> ${esc(s.schoolType||'—')}</div><div class="pr"><b>تاريخ التنفيذ:</b> ${esc(d.date||'—')}<br><b>طريقة التنبيه:</b> ${esc(d.alarm)}<br><b>نقطة التجمع:</b> ${esc(d.assembly)}<br><b>النتيجة:</b> ${esc(d.result)}<br><b>مدة الإخلاء:</b> ${esc(d.duration||'—')} دقيقة<br><b>الفئة المشاركة:</b> ${esc(d.audience)}<br><b>الملاحظات:</b> ${esc(d.notes||'لا توجد')}</div>${ev?`<div class="pr ev"><h3>الشواهد</h3>${ev}</div>`:''}<div class="pr" style="margin-top:35px"><b>منسق الأمن والسلامة:</b> ____________________<br><b>مدير/ة المدرسة:</b> ____________________</div>`)}function generic(m){return `<div class="formgrid"><div class="field"><label>الحالة</label><select id="gStatus"><option>مكتمل</option><option>قيد التنفيذ</option><option>يحتاج متابعة</option></select></div><div class="field"><label>الأولوية</label><select id="gPriority"><option>عادية</option><option>عالية</option><option>عاجلة</option></select></div><div class="field"><label>المسؤول</label><select id="gOwner"><option>منسق الأمن والسلامة</option><option>فريق الأمن والسلامة</option><option>إدارة المدرسة</option><option>الصيانة</option></select></div></div><div class="field"><label>ملاحظات إضافية — اختياري</label><textarea id="gNotes"></textarea></div><div class="actions"><button class="btn primary" onclick="saveGeneric('${m[0]}')">حفظ</button><button class="btn ghost" onclick="printGeneric('${m[0]}')">طباعة / حفظ PDF</button></div><div class="saved" id="gSaved"></div>`}function saveGeneric(id){try{saveSchool();localStorage.setItem('anjz_safety_'+id,JSON.stringify({status:gStatus.value,priority:gPriority.value,owner:gOwner.value,notes:gNotes.value}));gSaved.style.display='block';gSaved.textContent='✓ تم الحفظ بنجاح.';return true}catch(e){alert('تعذر الحفظ');return false}}function loadGeneric(id){const d=JSON.parse(localStorage.getItem('anjz_safety_'+id)||'{}');gStatus.value=d.status||'مكتمل';gPriority.value=d.priority||'عادية';gOwner.value=d.owner||'منسق الأمن والسلامة';gNotes.value=d.notes||''}function printGeneric(id){if(!saveGeneric(id))return;const m=mods.find(x=>x[0]===id),d=JSON.parse(localStorage.getItem('anjz_safety_'+id)||'{}'),s=JSON.parse(localStorage.getItem(schoolKey())||'{}');printDoc(m[2],`<div class="pr"><b>المدرسة:</b> ${esc(s.school||'—')} | <b>العام:</b> ${esc(s.year||'—')} | <b>المرحلة:</b> ${esc(s.stage||'—')}</div><div class="pr"><b>الحالة:</b> ${esc(d.status)}<br><b>الأولوية:</b> ${esc(d.priority)}<br><b>المسؤول:</b> ${esc(d.owner)}<br><b>الملاحظات:</b> ${esc(d.notes||'لا توجد')}</div>`)}function openM(id){const m=mods.find(x=>x[0]===id);showDetail(m[1]+' '+m[2]);if(id==='evac'){workspace.innerHTML=evac();draw();openEv(0)}else{workspace.innerHTML=generic(m);loadGeneric(id)}}loadSchool();</script></body></html>
