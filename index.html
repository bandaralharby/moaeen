function fill(id,items,selected){var el=document.getElementById(id);el.innerHTML=items.map(function(x){return '<option'+(x===selected?' selected':'')+'>'+x+'</option>';}).join('');}
function updateStage(){var st=document.getElementById('stage').value;fill('grade',curriculum[st].grades,st==='متوسط'?'ثالث متوسط':curriculum[st].grades[0]);updateTrackAndSubjects();} function updateTrackAndSubjects(){var st=document.getElementById('stage').value,gr=document.getElementById('grade').value,tw=document.getElementById('trackWrap');if(st==='ثانوي'&&gr!=='السنة الأولى المشتركة'){tw.style.display='block';fill('track',secondaryTracks,secondaryTracks[0]);fill('subject',subjectsForSecondaryGradeTrack(gr,document.getElementById('track').value));}else{tw.style.display='none';fill('subject',curriculum[st].subjects,st==='متوسط'?'المهارات الرقمية':curriculum[st].subjects[0]);}updateSubject();} function updateTrack(){var st=document.getElementById('stage').value;if(st==='ثانوي'){var gr=document.getElementById('grade').value;fill('subject',subjectsForSecondaryGradeTrack(gr,document.getElementById('track').value));updateSubject();}}
function currentCatalog(){var key=[document.getElementById('stage').value,document.getElementById('grade').value,document.getElementById('subject').value,document.getElementById('term').value].join('|');return verifiedSecondaryCatalog[key]||catalog[key]||{"بيانات الوحدات والدروس لهذا المقرر قيد الإدخال والمراجعة":["لم تُعتمد وحدات ودروس هذا المقرر بعد"]};}
function updateSubject(){var c=currentCatalog();fill('unit',Object.keys(c));updateUnit();}
function updateUnit(){var c=currentCatalog(),u=document.getElementById('unit').value;fill('lesson',c[u]||['الدرس الأول']);}
function initCurriculumUI(){
  fill('stage',Object.keys(curriculum),'متوسط'); updateStage();
  document.getElementById('stage').addEventListener('change',updateStage);
  document.getElementById('grade').addEventListener('change',updateTrackAndSubjects);

<script>
(function(){
  window.secondaryCurriculumMeta = window.secondaryCurriculumMeta || {};

  window.secondaryCurriculumMeta.officialReference = 'وزارة التعليم - دليل الخطط الدراسية الإصدار الخامس';

  // لا نعدّ أي مقرر مكتملاً إذا احتوى على عبارات مؤقتة بدل أسماء دروس موثقة.
  function isPlaceholder(v){
    return /قيد (الإدخال|الاستكمال|التحقق|المراجعة)|محتوى الوحدة وفق الفهرس المعتمد|بيانات الدروس/.test(String(v||''));
  }
  function auditCurriculum(){
    var report={complete:[],needsReview:[],empty:[]};
    if(typeof curriculumData==='undefined') return report;
    Object.keys(curriculumData).forEach(function(subject){
      var terms=curriculumData[subject]||{}, hasData=false, bad=false;
      Object.keys(terms).forEach(function(term){
        var units=terms[term]||{};
        Object.keys(units).forEach(function(unit){
          var lessons=units[unit]||[];
          if(lessons.length) hasData=true;
          if(!lessons.length || lessons.some(isPlaceholder)) bad=true;
        });
      });
      if(!hasData) report.empty.push(subject);
      else if(bad) report.needsReview.push(subject);
      else report.complete.push(subject);
    });
    return report;
  }
  window.auditSecondaryCurriculum=auditCurriculum;
  window.secondaryCurriculumAudit=auditCurriculum();

  // تحسين واجهة الثانوية: تنبيه واضح يمنع اعتبار البيانات المؤقتة مكتملة.

    note.id='secondary-status';

    note.textContent='الثانوية: تتم مراجعة المقررات والوحدات والدروس، ولن تُعتمد البيانات المؤقتة كمحتوى مكتمل.';
    card.appendChild(note);
    function sync(){ note.style.display=(stage && stage.value==='ثانوي')?'block':'none'; }
    if(stage) stage.addEventListener('change',sync); sync();
  });
})();
