<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17365D">
<title>مُعين المعلم</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:#17365D;background:#f4f7fb}
*{box-sizing:border-box} body{margin:0;background:#f4f7fb;padding:16px}
.wrap{max-width:850px;margin:auto}.hero{padding:12px 2px 18px}.hero h1{font-size:34px;margin:0}.hero p{color:#64748b}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(15,23,42,.08);margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:800;margin:12px 0 6px}
select,input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:13px;background:#fff;font-size:16px}
button{width:100%;border:0;border-radius:14px;padding:15px;background:#2F75B5;color:#fff;font-size:18px;font-weight:800;margin-top:15px}
.secondary{background:#e7eef6;color:#17365D}.hidden{display:none!important}.status{text-align:center;color:#64748b;margin-top:10px}
.sheet-head{text-align:center;border-bottom:2px solid #17365D;padding-bottom:12px;margin-bottom:16px}
.sheet-head h2{margin:5px}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#475569}
.q{padding:14px;border:1px solid #dbe3ec;border-radius:12px;margin:10px 0;break-inside:avoid}.ans{margin-top:8px;color:#475569}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.grid,.actions{grid-template-columns:1fr}}
@media print{body{background:#fff;padding:0}.no-print{display:none!important}.card{box-shadow:none;padding:0}.wrap{max-width:none}}
</style>
</head>
<body>
<main class="wrap">
<div class="hero"><h1>مُعين المعلم</h1><p>أنشئ ملفك التعليمي خلال ثوانٍ</p></div>

<section class="card no-print">
<div class="grid">
<div><label>المرحلة</label><select id="stage"><option>المتوسطة</option></select></div>
<div><label>الصف</label><select id="grade"><option>ثالث متوسط</option></select></div>
<div><label>المادة</label><select id="subject"><option>المهارات الرقمية</option></select></div>
<div><label>الفصل الدراسي</label><select id="term"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option><option>الفصل الدراسي الثالث</option></select></div>
<div><label>الوحدة</label><select id="unit"><option>الأمن السيبراني</option></select></div>
<div><label>الدرس</label><select id="lesson"><option>مقدمة في الأمن السيبراني</option><option>حماية الأجهزة والبيانات</option><option>التصيد والهندسة الاجتماعية</option></select></div>
<div><label>نوع الملف</label><select id="type"><option value="worksheet">ورقة عمل</option><option value="quiz">اختبار قصير</option><option value="bank">بنك أسئلة</option><option value="activity">نشاط صفي</option><option value="homework">واجب منزلي</option><option value="summary">ملخص درس</option></select></div>
<div><label>عدد الأسئلة</label><select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></div>
<div><label>مستوى الصعوبة</label><select id="difficulty"><option>سهل</option><option selected>متوسط</option><option>متقدم</option><option>متنوع</option></select></div>
<div><label>نموذج الإجابة</label><select id="answers"><option value="true">نعم</option><option value="false">لا</option></select></div>
<div><label>اسم المعلم/ـة</label><input id="teacher" placeholder="اختياري"></div>
<div><label>المدرسة</label><input id="school" placeholder="اختياري"></div>
</div>
<button id="generate">إنشاء الملف ✨</button><div id="status" class="status"></div>
</section>

<section id="result" class="card hidden">
<div class="sheet-head"><h2 id="docTitle"></h2><h3 id="lessonTitle"></h3>
<div class="meta"><span id="schoolLine"></span><span id="teacherLine"></span><span id="difficultyLine"></span></div></div>
<div id="questions"></div>
<div class="actions no-print"><button id="print">طباعة / حفظ PDF</button><button id="edit" class="secondary">تعديل الخيارات</button></div>
</section>
</main>
<script>
const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/moaeen-generate';
const $=id=>document.getElementById(id);
const labels={worksheet:'ورقة عمل',quiz:'اختبار قصير',bank:'بنك أسئلة',activity:'نشاط صفي',homework:'واجب منزلي',summary:'ملخص درس'};
$('generate').onclick=async()=>{
 $('status').textContent='جاري إنشاء الملف...'; $('generate').disabled=true;
 const payload={lesson:$('lesson').value,file_type:$('type').value,count:Number($('count').value),include_answers:$('answers').value==='true',teacher_name:$('teacher').value.trim()};
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json(); if(!r.ok||!d.ok)throw Error();
  $('docTitle').textContent=labels[$('type').value]||'ملف تعليمي';
  $('lessonTitle').textContent=$('subject').value+' — '+$('lesson').value;
  $('schoolLine').textContent=$('school').value?'المدرسة: '+$('school').value:'';
  $('teacherLine').textContent=$('teacher').value?'المعلم/ـة: '+$('teacher').value:'';
  $('difficultyLine').textContent='المستوى: '+$('difficulty').value;
  $('questions').innerHTML=d.questions.map(q=>`<div class="q"><b>${q.number}. ${q.question}</b>${q.answer?`<div class="ans">الإجابة: ${q.answer}</div>`:''}</div>`).join('');
  $('result').classList.remove('hidden'); $('status').textContent=''; $('result').scrollIntoView({behavior:'smooth'});
 }catch(e){$('status').textContent='تعذر إنشاء الملف. أعد المحاولة.'}finally{$('generate').disabled=false}
};
$('print').onclick=()=>window.print();
$('edit').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
</body></html>
