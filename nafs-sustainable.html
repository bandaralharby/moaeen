<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة المستدامة | نافس</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f8fc;color:#172033}.wrap{max-width:920px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:20px;padding:24px}h1{margin:0 0 6px;color:#177344}.hint{color:#667085;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:4px}.field label{display:block;font-weight:800;margin-bottom:7px}.field select{width:100%;border:1px solid #d8deea;border-radius:11px;padding:12px;font:inherit;background:#fff}.full{grid-column:1/-1}.skills{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid #d8deea;border-radius:12px;padding:12px;background:#fbfcfd}.skill{display:flex;gap:8px;align-items:flex-start;padding:9px;border-radius:9px;background:#fff;border:1px solid #edf0f4}.skill input{margin-top:3px}.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;background:#218b55;color:#fff}.back{background:#edf0f5;color:#344054;text-decoration:none}.source{font-size:12px;color:#667085;margin-top:12px}@media(max-width:650px){.grid,.skills{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>خطة نافس المستدامة</h1><p class="hint">المجالات والمهارات مأخوذة من وثيقة نواتج التعلم للاختبارات الوطنية (نافس)، وتتغير حسب الصف والمادة.</p><div class="grid"><div class="field"><label>العام الدراسي</label><select><option>١٤٤٨هـ</option><option>١٤٤٩هـ</option></select></div><div class="field"><label>الصف المستهدف</label><select id="grade" onchange="renderSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6">الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط</option></select></div><div class="field"><label>المادة</label><select id="subject" onchange="renderSkills()"></select></div><div class="field"><label>الفئة المستهدفة</label><select><option>جميع الطلاب</option><option>الطلاب المتقنون</option><option>الطلاب مرتفعو الأداء</option><option>مجموعة مستهدفة</option></select></div><div class="field full"><label>مجالات / مهارات نافس المستهدفة</label><div class="skills" id="skills"></div></div><div class="field"><label>هدف الاستدامة</label><select><option>المحافظة على مستوى الإتقان</option><option>رفع نسبة الإتقان</option><option>تعزيز نواتج التعلم المتقنة</option><option>استمرار التحسن في نتائج نافس</option></select></div><div class="field"><label>نوع البرنامج</label><select><option>تدريب إثرائي</option><option>مراجعة دورية</option><option>مسابقات تعليمية</option><option>تدريب إلكتروني</option><option>اختبارات قصيرة دورية</option><option>تعلم تعاوني</option></select></div><div class="field"><label>آلية التنفيذ</label><select><option>أسبوعيًا</option><option>كل أسبوعين</option><option>شهريًا</option><option>حسب الخطة الزمنية</option></select></div><div class="field"><label>مسؤول التنفيذ</label><select><option>معلم/ـة المادة</option><option>منسق/ـة نافس</option><option>فريق نافس</option><option>وكيل/ـة المدرسة</option></select></div><div class="field"><label>مدة التنفيذ</label><select><option>شهر</option><option>فصل دراسي</option><option>العام الدراسي</option></select></div><div class="field"><label>أداة القياس</label><select><option>اختبار قبلي وبعدي</option><option>اختبارات قصيرة</option><option>نتائج التدريبات</option><option>تحليل نتائج الطلاب</option><option>نماذج محاكاة نافس</option></select></div><div class="field"><label>مؤشر النجاح</label><select><option>المحافظة على نسبة الإتقان</option><option>ارتفاع نسبة الإتقان</option><option>تحسن متوسط الأداء</option><option>استمرار تحقيق المستوى المستهدف</option></select></div><div class="field"><label>المتابعة</label><select><option>أسبوعية</option><option>شهرية</option><option>نهاية كل فترة</option><option>نهاية الفصل الدراسي</option></select></div></div><p class="source">المرجع: وثيقة نواتج التعلم للاختبارات الوطنية – هيئة تقويم التعليم والتدريب.</p><div class="actions"><button class="btn" onclick="window.print()">طباعة الخطة</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><script>const subjects={g3:[['reading','القراءة'],['math','الرياضيات']],g6:[['reading','القراءة'],['math','الرياضيات'],['science','العلوم الطبيعية']],g9:[['reading','القراءة'],['math','الرياضيات'],['science','العلوم الطبيعية']]};const data={reading:['اكتساب المفردات وتوظيف الدلالات اللفظية','فهم المقروء وتحليله وتقويمه'],math:['الأعداد والعمليات عليها','الجبر','الهندسة والقياس','الإحصاء والاحتمالات'],science:['التركيب والوظيفة في المخلوقات الحية','تنظيم المخلوقات الحية وتنوّعها','الأنظمة البيئية وتفاعلاتها','الوراثة','المادة وتفاعلاتها','الحركة والقوى','الطاقة','الموجات والاهتزازات','الكهرومغناطيسية','الكون والنظام الشمسي','النظام الأرضي']};function renderSubjects(){const g=document.getElementById('grade').value,s=document.getElementById('subject');s.innerHTML='';subjects[g].forEach(x=>{const o=document.createElement('option');o.value=x[0];o.textContent=x[1];s.appendChild(o)});renderSkills()}function renderSkills(){const box=document.getElementById('skills'),key=document.getElementById('subject').value;box.innerHTML='';data[key].forEach(x=>{const l=document.createElement('label');l.className='skill';l.innerHTML='<input type="checkbox" value="'+x+'"><span>'+x+'</span>';box.appendChild(l)})}renderSubjects();</script></body></html>
