<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة المستدامة | نافس</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f8fc;color:#172033}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:20px;padding:24px}h1{margin:0 0 8px;color:#177344}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.tab{padding:14px;border-radius:12px;border:1px solid #dce3ea;background:#fff;font-weight:800;text-align:center}.tab.active{background:#218b55;color:#fff}.tab.disabled{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;background:#fff;font:inherit}.full{grid-column:1/-1}.group{border:1px solid #dfe6e2;border-radius:14px;margin-top:12px;overflow:hidden}.group h3{margin:0;padding:13px;background:#f1f8f4;color:#17653e;font-size:16px}.outcome{padding:12px;border-top:1px solid #edf1ef}.outcome b{display:block;margin-bottom:8px}.skill{display:flex;gap:8px;padding:7px 3px;line-height:1.6}.skill input{margin-top:5px}.note{color:#667085;font-size:13px}.actions{display:flex;gap:10px;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#218b55;color:#fff;font-weight:800;text-decoration:none}.back{background:#edf0f5;color:#344054}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>خطة نافس المستدامة</h1><div class="tabs"><div class="tab active">المهارات</div><div class="tab disabled">البرامج — لاحقًا</div><div class="tab disabled">المبادرات — لاحقًا</div></div><div class="grid"><div class="field"><label>الصف</label><select id="grade" onchange="renderSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6">الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط (التاسع)</option></select></div><div class="field"><label>المادة</label><select id="subject" onchange="render()"></select></div><div class="field full"><div id="skills"></div></div></div><p class="note">المهارات والنواتج والمؤشرات من وثيقة نواتج التعلم للاختبارات الوطنية 2026. بدأنا بإدخال القراءة بالتفصيل، وستضاف الرياضيات والعلوم بنفس بنية الوثيقة.</p><div class="actions"><button class="btn" onclick="window.print()">طباعة</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><script>const subjects={g3:[['reading','القراءة'],['math','الرياضيات']],g6:[['reading','القراءة'],['math','الرياضيات'],['science','العلوم الطبيعية']],g9:[['reading','القراءة'],['math','الرياضيات'],['science','العلوم الطبيعية']]};const R={g3:[{g:'اكتساب المفردات وتوظيف الدلالات اللفظية',o:'تحديد معاني المفردات الواردة في النص ومرادفاتها وأضدادها، وتصنيفها حسب معانيها وأنواعها، واستخدامها في جمل مفيدة وسياقات جديدة.',i:['يحدد مرادفات وأضداد المفردات الواردة في النص، ويوضح معانيها.','يصنف المفردات حسب معانيها ونوعها وعددها.','يستخدم المفردات في جمل مفيدة وسياقات لغوية جديدة.']},{g:'الفهم القرائي',o:'تحديد الأفكار الصريحة للنص المقروء، واستنتاج حقائقه، وتفسيرها، وتحليلها، وتمييز نوع النص.',i:['يستنتج الهدف العام للنص المقروء، ويحدد فكرته الرئيسة أو أحد فقراته.','يستخرج معلومات مباشرة من النص المقروء، ويحدد نوعه.','يحدد مكونات وعناصر النص المقروء، ويرتب الأحداث أو الأفكار أو المعلومات حسب ورودها.','يحدد الأسباب والنتائج والعلاقات، ويصف الدوافع والأفعال للشخصيات الواردة في النص.','يستنتج أوجه الشبه والاختلاف في النص المقروء، ويربط الأسباب بالنتائج.']},{g:'الفهم القرائي',o:'التمييز بين عبارات النص المقروء، وإبداء الرأي حول وجهات النظر، واستنتاج القيم واقتراح البدائل.',i:['يحدد العبارات والتعبيرات الجمالية، ويبدي رأيه فيها، ويميز بين تعبيرات معطاة في النص المقروء.','يبدي رأيه حول موضوع النص المقروء مع التعليل لذلك، ويوظف النص أو أجزاء منه في مواقف حياتية.','يقوم احتمال حقيقة وقوع الأحداث التي وصفها الكاتب وإمكانية حدوثها.','يستنتج القيم والاتجاهات الواردة في النص المقروء، ويقومها.','يقترح عنوانًا، ونهاية مغايرة لنهاية النص المقروء، وحلولًا لمشكلات أو قضايا وردت فيه.'] }],g6:[{g:'اكتساب المفردات وتوظيف الدلالات اللفظية',o:'استنتاج مرادفات المفردات الواردة في النص المقروء ومعانيها، وتمييز المفردات المتشابهة في المعنى وتصنيفها والتمثيل لها، واستخدامها ومرادفاتها وأضدادها في جمل مفيدة.',i:['يستنتج مرادفات المفردات الواردة في النص المقروء، ويوضح معاني مفردات تغيرت دلالاتها بتغير السياق.','يميز المفردات المتشابهة في المعنى، ويمثل لها في جمل مفيدة وسياقات قرائية مختلفة.','يصنف المترادفات والأضداد للمفردات المتشابهة في المعنى حسب معانيها في النص المقروء.','يستخدم المفردات ومرادفاتها وأضدادها في جمل مفيدة وسياقات قرائية مختلفة.']},{g:'الفهم القرائي',o:'تمييز الأفكار الرئيسة والفرعية للنص المقروء واستخراج المعلومات الواردة فيه، وتفسيرها، وتحليلها، وتحديد نوع النص وغرضه وموضوعه.',i:['يميز الأفكار الرئيسة والفرعية والضمنية، ويقارن العلاقات والروابط بينها، ويستنتج أوجه التشابه والاختلاف.','يستخرج المعلومات والحقائق المباشرة الواردة في النص، ويميز نوع النص ويحدد غرضه وموضوعه.','يقارن بين مفهومين أو أكثر في النص المقروء، ويستنتج أوجه التشابه والاختلاف بينهما.','يصف الشخصيات والأحداث الواردة في النص المقروء، ويميز العلاقات بين الشخصيات، ويرتب الأحداث.','يوضح العلاقة بين فقرات النص المقروء وجمله وعباراته، ويستدل من النص على تفسير الظواهر والأحداث ويربطها بواقعه.']},{g:'الفهم القرائي',o:'إبداء الرأي في وجهة نظر الكاتب والقيم والاتجاهات، واقتراح البدائل والحلول، واستخدام أساليب الإقناع والتعليل.',i:['يحدد العبارات والتعبيرات الجمالية في النص المقروء، ويبدي رأيه فيها، ويصف عاطفة الكاتب.','يبدي رأيه حول اكتمال أو وضوح المعلومات الواردة في النص.','يستنتج القيم والاتجاهات الواردة في النص المقروء، ويقومها، ويبدي رأيه حولها مع التعليل، ويحدد وجهة نظر الكاتب.','يقترح عنوانًا أو بداية أو خاتمة مغايرة للنص، ويعيد صياغة النص أو فقرة منه بلغته وأسلوبه، وينظم معلومات النص في منظمات بيانية.','يستخدم أساليب الإقناع والتعليل لدعم فكرة أو رأي آخر، ويوظف مغزى النص وأفكاره في اقتراح حلول لمشكلات مدرسية أو حياتية أو مجتمعية.'] }],g9:[{g:'اكتساب المفردات وتوظيف الدلالات اللفظية',o:'استنتاج دلالات المفردات وتصنيفها، من خلال الترادف والتضاد والسياق والتفسير والتعريف والتصنيف والتمثيل، وتوظيفها في سياقات جديدة.',i:['يستنتج معاني المفردات من خلال توظيف خبراته السابقة.','يستنتج التعريفات لمصطلحات جديدة وردت في النص المقروء.','يصنف المفردات والعلاقة بينها بحسب دلالاتها.','يميز المفردات المختلفة الواردة في النص المقروء.','يوظف المفردات الجديدة والمفردات متنوعة المعاني في سياقات ومواقف قرائية مختلفة لحل المشكلات.']},{g:'الفهم القرائي',o:'استخراج الأفكار الرئيسة والفرعية لنص طويل ومعقد، واستنتاج الأفكار الضمنية، وتمييزها وتفسيرها وتحليلها.',i:['يستخرج الأفكار الرئيسة والفرعية من النص أو فقرة من فقراته، ويحلل النصوص المقروءة.','يستخرج معلومات النص غير المباشرة، ويحدد موضوعه، ويستنتج الأفكار الضمنية، ويطرح أسئلة توضيحية أو تعليلية أو استنتاجية أو تحليلية أو نقدية.','يحدد نقاط التشابه والاختلاف في النص المقروء، ويقارن بين نصين أو أكثر.','يميز بين الحقائق والآراء والتعبيرات المباشرة وغير المباشرة.','يفسر العلاقات والروابط بين أجزاء النص، ويستدل منه على بعض الظواهر أو الأحداث ويربطها بمواقف حياتية.']},{g:'الفهم القرائي',o:'تقويم النص المقروء ونقده، وإبداء الرأي في وجهة نظر الكاتب والقيم والاتجاهات، واقتراح البدائل، واستخدام أساليب الإقناع والتعليل، وتلخيص النص وتوظيف معطياته في مواقف حياتية مختلفة.',i:['يحدد التعابير التي تشير إلى مشاعر ودوافع الكاتب، ويبدي رأيه حول توظيف الكاتب لتراكيب لغوية محددة.','يبدي وجهة نظره حول الأحداث أو المعلومات أو الأفكار الواردة في النص ويقوم مصداقيتها واكتمالها.','يبدي رأيه حول القيم والاتجاهات الواردة في النص، ويوضح أثرها على الفرد والمجتمع ويربطها بواقعه.','يستنبط الحجج والبراهين من النص، ويقوم الآراء ووجهات النظر.','يلخص النص في عبارات قصيرة، ويعيد صياغته وينظم معلوماته وأفكاره.','يقدم أمثلة لمشكلة من واقعه وردت في النص، ويوظف معطياته في حل مشكلات فردية أو أسرية أو مجتمعية.']}]};function renderSubjects(){let s=document.getElementById('subject');s.innerHTML='';subjects[grade.value].forEach(x=>s.add(new Option(x[1],x[0])));render()}function render(){let b=document.getElementById('skills'),g=grade.value,s=subject.value;b.innerHTML='';if(s!=='reading'){b.innerHTML='<div class="group"><h3>قيد الإدخال من الوثيقة الرسمية</h3><div class="outcome">سيتم إدخال هذه المادة بنفس تفرعات نواتج التعلم والمؤشرات.</div></div>';return}R[g].forEach((x,n)=>{let d=document.createElement('div');d.className='group';d.innerHTML='<h3>'+x.g+'</h3><div class="outcome"><b>ناتج التعلم: '+x.o+'</b>'+x.i.map((z,i)=>'<label class="skill"><input type="checkbox"><span>'+(i+1)+'. '+z+'</span></label>').join('')+'</div>';b.appendChild(d)})}renderSubjects();</script></body></html>
