<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المجتمع المهني | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:24px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:700}.hero,.card{background:#fff;border:1px solid #e9e6f3;border-radius:20px;padding:24px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#fff,#f1edff)}h1{margin:6px 0 8px;font-size:34px}p{color:#716d83;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}label{display:block;font-weight:800;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #ddd8ed;border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:#5b3fd6;color:#fff}.soft{background:#eee9ff;color:#5538c8}.report{display:none}.report h2{color:#5538c8}.box{border:1px solid #e7e2f2;border-radius:12px;padding:14px;margin:10px 0}.box b{display:block;margin-bottom:6px}.muted{color:#777286}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:14px}h1{font-size:28px}}@media print{body{background:#fff}.top,.hero,.formcard,.actions{display:none!important}.report{display:block!important;border:0}.wrap{max-width:none;padding:0}.box{break-inside:avoid}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI</div><a class="back" href="index.html">← الرئيسية</a></div><section class="hero"><div>👥 المجتمع المهني</div><h1>أنشئ مجتمعًا مهنيًا متكاملًا</h1><p>أدخل البيانات الأساسية، ثم يولّد أنجز خطة ومحاور ومحضرًا وقياس أثر وتقريرًا جاهزًا للطباعة.</p></section><section class="card formcard"><div class="grid"><div class="field"><label>عنوان المجتمع المهني</label><input id="title" placeholder="مثال: رفع مستوى التحصيل الدراسي"></div><div class="field"><label>المجال</label><select id="area"><option>التحصيل الدراسي</option><option>استراتيجيات التدريس</option><option>التقويم وأساليبه</option><option>علاج الفاقد التعليمي</option><option>تبادل الخبرات</option><option>التقنية في التعليم</option><option>أخرى</option></select></div><div class="field"><label>اسم المدرسة</label><input id="school" placeholder="اسم المدرسة"></div><div class="field"><label>منسق/قائد المجتمع</label><input id="leader" placeholder="الاسم"></div><div class="field"><label>التاريخ</label><input id="date" type="date"></div><div class="field"><label>الفئة المستهدفة</label><input id="target" placeholder="مثال: معلمو ومعلمات المادة"></div></div><div class="field"><label>التحدي أو الاحتياج</label><textarea id="need" placeholder="ما المشكلة أو الاحتياج الذي سيعمل عليه المجتمع؟"></textarea></div><div class="field"><label>الأعضاء</label><textarea id="members" placeholder="اكتب أسماء الأعضاء، كل اسم في سطر"></textarea></div><div class="actions"><button class="btn primary" onclick="generate()">✨ إنشاء المجتمع المهني</button><button class="btn soft" onclick="fillExample()">تعبئة مثال</button></div></section><section class="card report" id="report"><h2 id="rtitle"></h2><p class="muted" id="meta"></p><div class="box"><b>الاحتياج المهني</b><span id="rneed"></span></div><div class="box"><b>الهدف العام</b><span id="goal"></span></div><div class="box"><b>الأهداف التفصيلية</b><div id="goals"></div></div><div class="box"><b>محاور اللقاء</b><div id="axes"></div></div><div class="box"><b>محضر المجتمع المهني</b><div id="minutes"></div></div><div class="box"><b>التوصيات والإجراءات</b><div id="recommend"></div></div><div class="box"><b>قياس الأثر</b><div id="impact"></div></div><div class="box"><b>الأعضاء</b><div id="rmembers"></div></div><div class="actions"><button class="btn primary" onclick="window.print()">🖨️ طباعة التقرير</button><button class="btn soft" onclick="document.querySelector('.formcard').scrollIntoView({behavior:'smooth'})">تعديل البيانات</button></div></section></div><script>function v(id){return document.getElementById(id).value.trim()}function generate(){let t=v('title')||'مجتمع مهني لتطوير الممارسات التعليمية',a=v('area'),n=v('need')||'الحاجة إلى تطوير الممارسات المهنية وتحسين نواتج التعلم.';document.getElementById('rtitle').textContent=t;document.getElementById('meta').textContent=[v('school'),v('date'),v('leader')&&'المنسق: '+v('leader'),v('target')&&'الفئة المستهدفة: '+v('target')].filter(Boolean).join(' • ');document.getElementById('rneed').textContent=n;document.getElementById('goal').textContent='رفع جودة الممارسات المهنية في مجال '+a+' وتحويل تبادل الخبرات إلى إجراءات قابلة للتطبيق والقياس.';document.getElementById('goals').innerHTML='• تشخيص الاحتياج وتحديد أسبابه.<br>• تبادل الممارسات والخبرات الفاعلة بين الأعضاء.<br>• الاتفاق على إجراءات تحسين واضحة وقابلة للتنفيذ.<br>• متابعة التطبيق وقياس أثره على الأداء ونواتج التعلم.';document.getElementById('axes').innerHTML='1. عرض الاحتياج والبيانات المرتبطة به.<br>2. مناقشة الأسباب والتحديات.<br>3. مشاركة الممارسات والحلول المقترحة.<br>4. اختيار إجراءات التحسين وتحديد المسؤوليات.<br>5. تحديد مؤشرات المتابعة وموعد قياس الأثر.';document.getElementById('minutes').innerHTML='تم عقد لقاء المجتمع المهني بعنوان «'+t+'»، وتمت مناقشة الاحتياج المحدد، واستعراض خبرات الأعضاء والممارسات المناسبة، ثم الاتفاق على مجموعة من إجراءات التحسين ومؤشرات المتابعة، مع التأكيد على توثيق التطبيق ومراجعة النتائج في اللقاء اللاحق.';document.getElementById('recommend').innerHTML='• تطبيق الإجراءات المتفق عليها خلال الفترة المحددة.<br>• تبادل الشواهد والنماذج بين الأعضاء.<br>• متابعة مؤشرات الأداء بصورة دورية.<br>• عقد لقاء متابعة لمناقشة النتائج وإجراء التحسينات اللازمة.';document.getElementById('impact').innerHTML='يُقاس الأثر من خلال مقارنة الوضع قبل وبعد التنفيذ، ومراجعة نتائج الطلاب أو مؤشرات الأداء المرتبطة بالمجال، ورصد مدى تطبيق الممارسات المتفق عليها، مع توثيق التحسن والتوصيات اللاحقة.';document.getElementById('rmembers').innerHTML=(v('members')||'لم تُدخل أسماء الأعضاء').replace(/\n/g,'<br>');document.getElementById('report').style.display='block';document.getElementById('report').scrollIntoView({behavior:'smooth'})}function fillExample(){document.getElementById('title').value='رفع مستوى التحصيل الدراسي';document.getElementById('school').value='';document.getElementById('leader').value='';document.getElementById('target').value='معلمو ومعلمات المادة';document.getElementById('need').value='وجود تفاوت في نتائج الطلاب والحاجة إلى تحليل مواطن الضعف وتبادل الممارسات الفاعلة لرفع مستوى التحصيل.'}</script></body></html>
