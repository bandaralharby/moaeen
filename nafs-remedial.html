<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة العلاجية | نافس</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f8fc;color:#172033}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:20px;padding:24px}h1{margin:0;color:#a82c2c}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.tab{padding:14px;border:1px solid #e3dada;border-radius:12px;text-align:center;font-weight:800}.active{background:#b73535;color:#fff}.disabled{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field select{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;background:#fff;font:inherit}.full{grid-column:1/-1}.branch{border:1px solid #eadede;border-radius:14px;margin:14px 0;overflow:hidden}.branch h3{margin:0;padding:13px;background:#fff2f2;color:#8f2929;font-size:17px}.outcome{padding:13px 14px;background:#fffafa;border-top:1px solid #f0e4e4;font-weight:800;line-height:1.7}.skill{display:flex;gap:9px;padding:10px 14px;border-top:1px solid #f1e8e8;line-height:1.65;background:#fff}.skill input{margin-top:5px;min-width:17px;min-height:17px}.note{font-size:13px;color:#667085}.actions{display:flex;gap:10px;margin-top:18px}.btn{padding:12px 18px;border:0;border-radius:10px;background:#b73535;color:#fff;font-weight:800;text-decoration:none}.back{background:#edf0f5;color:#344054}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><h1>خطة نافس العلاجية</h1><div class="tabs"><div class="tab active">المهارات</div><div class="tab disabled">البرامج — لاحقًا</div><div class="tab disabled">المبادرات — لاحقًا</div></div><div class="grid"><div class="field"><label>الصف</label><select id="grade" onchange="renderSubjects()"><option value="g3">الصف الثالث الابتدائي</option><option value="g6">الصف السادس الابتدائي</option><option value="g9">الصف الثالث المتوسط (التاسع)</option></select></div><div class="field"><label>المادة</label><select id="subject" onchange="render()"></select></div><div class="field full" id="skills"></div></div><p class="note">اختر المؤشرات التي تحتاج إلى معالجة. الرياضيات والعلوم مأخوذة من وثيقة نواتج التعلم للاختبارات الوطنية 2026.</p><div class="actions"><button class="btn" onclick="window.print()">طباعة</button><a class="btn back" href="nafs.html">رجوع</a></div></div></div><script src="nafs-ms-data.js"></script><script>const subjects={g3:[['reading','القراءة'],['math','الرياضيات']],g6:[['reading','القراءة'],['math','الرياضيات'],['science','العلوم الطبيعية']],g9:[['reading','القراءة'],['math','الرياضيات'],['science','العلوم الطبيعية']]};const reading={g3:[['اكتساب المفردات وتوظيف الدلالات اللفظية','تحديد معاني المفردات ومرادفاتها وأضدادها وتصنيفها واستخدامها في سياقات جديدة'],['الفهم القرائي','تحديد الأفكار الصريحة واستنتاج الحقائق وتفسيرها وتحليلها وتمييز نوع النص'],['الفهم القرائي','التمييز بين عبارات النص وإبداء الرأي واستنتاج القيم واقتراح البدائل']],g6:[['اكتساب المفردات وتوظيف الدلالات اللفظية','استنتاج مرادفات المفردات ومعانيها وتمييز المتشابه منها وتصنيفها وتوظيفها'],['الفهم القرائي','تمييز الأفكار الرئيسة والفرعية واستخراج المعلومات وتفسيرها وتحليلها وتحديد نوع النص وغرضه'],['الفهم القرائي','إبداء الرأي في وجهة نظر الكاتب والقيم والاتجاهات واقتراح البدائل والحلول']],g9:[['اكتساب المفردات وتوظيف الدلالات اللفظية','استنتاج دلالات المفردات وتصنيفها وتوظيفها في سياقات جديدة'],['الفهم القرائي','استخراج الأفكار الرئيسة والفرعية واستنتاج الأفكار الضمنية وتفسيرها وتحليلها'],['الفهم القرائي','تقويم النص ونقده وتلخيصه وتوظيف معطياته في مواقف حياتية']]};function renderSubjects(){subject.innerHTML='';subjects[grade.value].forEach(x=>subject.add(new Option(x[1],x[0])));render()}function render(){const g=grade.value,s=subject.value,b=skills;b.innerHTML='';let rows=[];if(s==='reading'){rows=reading[g].map(x=>[x[0],x[1],[x[1]]])}else{rows=(window.NAFS_MS&&NAFS_MS[s]&&NAFS_MS[s][g])||[]}if(!rows.length){b.innerHTML='<div class="branch"><h3>لا توجد بيانات لهذا الاختيار</h3></div>';return}let last='';rows.forEach(x=>{let box;if(x[0]!==last){box=document.createElement('div');box.className='branch';box.innerHTML='<h3>'+x[0]+'</h3>';b.appendChild(box);last=x[0]}else box=[...b.querySelectorAll('.branch')].pop();let o=document.createElement('div');o.innerHTML='<div class="outcome">ناتج التعلم: '+x[1]+'</div>'+x[2].map(z=>'<label class="skill"><input type="checkbox" name="skill"><span>'+z+'</span></label>').join('');box.appendChild(o)})}renderSubjects();</script></body></html>
