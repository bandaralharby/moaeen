<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}.wrap{max-width:1080px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero{margin:18px 0;background:linear-gradient(135deg,#5036c7,#735be4);color:#fff;border-radius:24px;padding:28px}.panel{background:#fff;border:1px solid #e7e3f1;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin-bottom:12px}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd9e9;border-radius:10px;background:#fff}.field textarea{min-height:85px}.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:900;cursor:pointer;background:#5b3fd6;color:#fff}.ghost{background:#eee9ff;color:#4e39b0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.subjectRow{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:center;padding:11px;border-bottom:1px solid #eee}.status{font-weight:900}.wait{color:#a27613}.share{background:#f3f9f7;border:1px solid #cce8df;border-radius:13px;padding:13px;margin-top:12px;word-break:break-all}.screen{display:none}.screen.on{display:block}.note{color:#706c81;line-height:1.7}.pill{display:inline-block;background:#eee9ff;color:#5538c8;padding:6px 11px;border-radius:99px;font-weight:800;font-size:12px}.lessonBox{background:#faf9ff;border:1px solid #e6e1f5;border-radius:14px;padding:14px;margin:12px 0}.lessonList{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lesson{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid #ebe7f4;border-radius:10px;padding:10px}.lesson input{width:auto;margin-top:3px}.unit{grid-column:1/-1;font-weight:900;color:#5538c8;padding-top:6px}.manual{display:none}.manual.on{display:block}@media(max-width:700px){.grid,.lessonList{grid-template-columns:1fr}.subjectRow{grid-template-columns:1fr 1fr}.subjectRow>*:first-child{grid-column:1/-1}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI</div><a class="back" href="index.html">← الرئيسية</a></div><div id="owner" class="screen on"><div class="hero"><span class="pill">عمل تشاركي</span><h1>📅 الخطة الأسبوعية للمدرسة</h1><p>أنشئ الخطة ثم شارك الرابط مع المعلمين والمعلمات لتجميع مواد الأسبوع في خطة واحدة.</p></div><div class="panel"><h2>إنشاء الخطة</h2><div class="grid"><div class="field"><label>اسم المدرسة</label><input id="school"></div><div class="field"><label>الأسبوع</label><input id="week" placeholder="مثال: الأسبوع الخامس"></div><div class="field"><label>المرحلة</label><select id="stage" onchange="fillGrades()"><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option></select></div><div class="field"><label>الصف</label><select id="grade" onchange="renderSubjects()"></select></div><div class="field"><label>الفصل الدراسي</label><select id="term"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div class="field"><label>تاريخ بداية الأسبوع</label><input id="start" type="date"></div></div><div class="actions"><button class="btn" onclick="createPlan()">إنشاء رابط المشاركة</button></div><div id="shareBox"></div></div><div class="panel"><h2>مواد الصف</h2><div id="subjects"></div></div></div><div id="participant" class="screen"><div class="hero"><h1>✍️ تعبئة الخطة الأسبوعية</h1><p id="planTitle"></p></div><div class="panel"><div class="grid"><div class="field"><label>اسم المعلم/ة</label><input id="teacher"></div><div class="field"><label>المادة</label><select id="subject" onchange="renderLessons()"></select></div><div class="field"><label>الصف</label><input id="pgrade" readonly></div></div><div class="lessonBox"><b>الدروس / الموضوعات لهذا الأسبوع</b><p class="note" id="lessonHint"></p><div class="lessonList" id="lessonList"></div><div class="manual" id="manualWrap"><textarea id="manualLessons" placeholder="اكتب الدروس لهذا الأسبوع"></textarea></div></div><div class="grid"><div class="field"><label>الواجبات والتكليفات</label><textarea id="homework"></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes"></textarea></div></div><button class="btn" onclick="submitPart()">حفظ مشاركتي</button><div id="msg"></div></div></div></div><script>const primaryCommon=['القرآن الكريم والدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];const curriculum={ابتدائي:{'الأول الابتدائي':primaryCommon,'الثاني الابتدائي':primaryCommon,'الثالث الابتدائي':primaryCommon,'الرابع الابتدائي':[...primaryCommon,'الدراسات الاجتماعية','المهارات الرقمية'],'الخامس الابتدائي':[...primaryCommon,'الدراسات الاجتماعية','المهارات الرقمية'],'السادس الابتدائي':[...primaryCommon,'الدراسات الاجتماعية','المهارات الرقمية']},متوسط:{'الأول المتوسط':['الدراسات الإسلامية','لغتي الخالدة','الرياضيات','العلوم','اللغة الإنجليزية','الدراسات الاجتماعية','المهارات الرقمية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'],'الثاني المتوسط':['الدراسات الإسلامية','لغتي الخالدة','الرياضيات','العلوم','اللغة الإنجليزية','الدراسات الاجتماعية','المهارات الرقمية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'],'الثالث المتوسط':['الدراسات الإسلامية','لغتي الخالدة','الرياضيات','العلوم','اللغة الإنجليزية','الدراسات الاجتماعية','المهارات الرقمية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس']},ثانوي:{'الأول الثانوي':['القرآن الكريم وتفسيره','الكفايات اللغوية','الرياضيات','الأحياء','الكيمياء','الفيزياء','اللغة الإنجليزية','التقنية الرقمية','الدراسات الاجتماعية','التفكير الناقد']}};const firstLessons={'لغتي':{'الوحدة الأولى: أسرتي':['حرف (م)','حرف (ب)','حرف (ل)','حرف (د)','حرف (ن)','حرف (ر)'],'الوحدة الثانية: مدرستي':['حرف (ص)','حرف (ف)']},'العلوم':{'الوحدة الأولى: النباتات من حولنا':['المخلوقات الحية','النباتات وأجزاؤها','نمو النباتات','تعيش النباتات في أماكن كثيرة'],'الوحدة الثانية: الحيوانات ومساكنها':['أنواع الحيوانات','الحيوانات وحاجاتها','مواطن على اليابسة','مواطن في الماء'],'الوحدة الثالثة: أرضنا':['موارد الأرض','الاستفادة من موارد الأرض','المحافظة على موارد الأرض']},'الرياضيات':{'الفصل الأول: المقارنة والتصنيف':['التصنيف وفق خاصية واحدة','التصنيف وفق أكثر من خاصية','يساوي','أكثر من، أقل من'],'الفصل الثاني: الأعداد حتى ٥':['الأعداد ١، ٢، ٣','قراءة الأعداد ١، ٢، ٣ وكتابتها','العددان ٤، ٥','قراءة العددين ٤، ٥ وكتابتهما','قراءة العدد صفر وكتابته'],'الفصل الثالث: الموقع والنمط':['فوق، تحت','أعلى، أوسط، أسفل','قبل، بعد','تحديد الأنماط','إنشاء الأنماط'],'الفصل الرابع: الأعداد حتى ١٠':['الأعداد ٦، ٧، ٨','قراءة الأعداد ٦، ٧، ٨ وكتابتها','العددان ٩، ١٠','قراءة العددين ٩، ١٠ وكتابتهما','مقارنة الأعداد حتى ١٠','ترتيب الأعداد حتى ١٠']}};let plan=null;function fillGrades(){grade.innerHTML=Object.keys(curriculum[stage.value]).map(x=>`<option>${x}</option>`).join('');renderSubjects()}function getSubs(){return curriculum[stage.value]?.[grade.value]||[]}function renderSubjects(){subjects.innerHTML=getSubs().map(s=>`<div class="subjectRow"><b>${s}</b><span class="status wait">○ بانتظار المشاركة</span><span>${stage.value==='ابتدائي'&&grade.value==='الأول الابتدائي'&&firstLessons[s]?'✓ الدروس مضافة':'المادة مضافة'}</span></div>`).join('')}function createPlan(){plan={id:Math.random().toString(36).slice(2,9),school:school.value,week:week.value,stage:stage.value,grade:grade.value,term:term.value,start:start.value,subs:getSubs()};localStorage.setItem('anjz_weekly_'+plan.id,JSON.stringify(plan));const url=location.origin+location.pathname+'?plan='+plan.id;shareBox.innerHTML=`<div class="share"><b>رابط المشاركة:</b><br>${url}<div class="actions"><button class="btn ghost" onclick="navigator.clipboard.writeText('${url}')">نسخ الرابط</button></div></div>`}function loadParticipant(id){plan=JSON.parse(localStorage.getItem('anjz_weekly_'+id)||'null');if(!plan){owner.innerHTML='<div class="panel"><h2>الرابط غير متاح على هذا الجهاز في النسخة التجريبية.</h2><p>بعد ربط قاعدة البيانات سيعمل الرابط على جميع الأجهزة.</p></div>';return}owner.classList.remove('on');participant.classList.add('on');planTitle.textContent=(plan.school||'المدرسة')+' — '+(plan.week||'الخطة الأسبوعية');pgrade.value=plan.grade;subject.innerHTML=plan.subs.map(x=>`<option>${x}</option>`).join('');renderLessons()}function renderLessons(){lessonList.innerHTML='';manualWrap.classList.remove('on');const data=plan?.grade==='الأول الابتدائي'?firstLessons[subject.value]:null;if(!data){lessonHint.textContent='الدروس لهذه المادة ستضاف تباعًا. حاليًا يمكنك كتابتها يدويًا.';manualWrap.classList.add('on');return}lessonHint.textContent='اختر درسًا واحدًا أو أكثر مما سيتم تنفيذه هذا الأسبوع.';lessonList.innerHTML=Object.entries(data).map(([u,ls])=>`<div class="unit">${u}</div>${ls.map(l=>`<label class="lesson"><input type="checkbox" name="lesson" value="${l}"><span>${l}</span></label>`).join('')}`).join('')}function submitPart(){const selected=[...document.querySelectorAll('input[name=lesson]:checked')].map(x=>x.value);const lessonText=selected.length?selected.join('، '):(manualLessons?.value||'');const x={teacher:teacher.value,subject:subject.value,lessons:lessonText,homework:homework.value,notes:notes.value,at:new Date().toISOString()};const k='anjz_weekly_parts_'+plan.id,a=JSON.parse(localStorage.getItem(k)||'[]');a.push(x);localStorage.setItem(k,JSON.stringify(a));msg.innerHTML='<div class="share">✓ تم حفظ مشاركتك.</div>'}fillGrades();const pid=new URLSearchParams(location.search).get('plan');if(pid)loadParticipant(pid);</script></body></html>
