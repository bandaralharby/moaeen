ubjects{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand">أنجز AI</div><div id="landing"><div class="hero"><h1>📅 الخطة الأسبوعية للمدرسة</h1><p>اكتب اسم المدرسة للبدء.</p></div><div class="card"><h2>إنشاء مدرسة جديدة</h2><div class="field"><label>اسم المدرسة</label><input id="newSchool" placeholder="اسم المدرسة"></div><button id="createBtn" class="btn" onclick="createSchool()">إنشاء والدخول</button><div id="createMsg"></div></div></div><div id="admin" class="hide"><div class="hero"><h1 id="adminSchool"></h1><p>لوحة إدارة الخطة الأسبوعية</p><span class="weekpill" id="activeWeek"></span></div><div class="card"><h2>الأسبوع الحالي</h2><div class="grid"><div class="field"><label>الفصل الدراسي</label><select id="term"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div class="field"><label>الأسبوع</label><select id="weekSelect"></select></div></div><button class="btn green" onclick="setWeek()">اعتماد الأسبوع الحالي</button></div><div class="card"><h2>مشاركة الخطة مع المعلمات</h2><p>الرابط ثابت للمدرسة ولا يتغير بتغير الأسبوع.</p><div class="row"><button class="btn" onclick="copyShare()">نسخ رابط المعلمات</button><button class="btn ghost" onclick="openShare()">معاينة صفحة المعلمات</button></div><div id="shareLink" class="hide"></div></div><div class="card"><h2>متابعة وأرشيف الخطط</h2><div class="grid"><div class="field"><label>الصف</label><select id="adminGrade" onchange="renderAdmin()"></select></div><div class="field"><label>الأسبوع</label><select id="archiveWeek" onchange="renderAdmin()"></select></div></div><div id="progress" class="ok"></div><div id="adminSubjects" class="subjects"></div><button class="btn green reportBtn" onclick="openReport()">📄 عرض التقرير الأسبوعي</button></div></div><div id="teacherView" class="hide"><div class="hero"><h1 id="teacherSchool"></h1><p>تعبئة الخطة الأسبوعية</p><span class="weekpill" id="teacherWeek"></span></div><div class="card"><div class="grid"><div class="field"><label>الصف</label><select id="grade" onchange="fillSubjects()"></select></div><div class="field"><label>المادة</label><select id="subject" onchange="renderLessons()"></select></div><div class="field"><label>اسم المعلم/ة</label><input id="teacher"></div></div><div id="lessonPicker" class="field hide"><label>الدروس / الموضوعات</label><div class="hint">يمكن اختيار أكثر من درس.</div><div id="lessonChoices" class="lessonBox"></div></div><div id="manualLessonBox" class="field"><label>الدروس / الموضوعات</label><textarea id="lessons" placeholder="اكتب الدروس"></textarea></div><div class="field"><label>الواجبات والتكليفات</label><textarea id="homework"></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes"></textarea></div><button class="btn" onclick="saveEntry()">حفظ / تحديث مشاركتي</button><div id="saveMsg"></div></div></div></div><script>

'التربية الفنية':[{'g':'الوحدة الأولى: مجال الرسم','l':['الألوان ممتعة','مجموعة الألوان','الإنسان والرسم','مدرستي الجميلة']},{'g':'الوحدة الثانية: مجال الزخرفة','l':['أزخرف بالمربع والمستطيل','الزخرفة بالدائرة والمثلث']},{'g':'الوحدة الثالثة: مجال الطباعة','l':['أطبع أشكالاً من الطبيعة','أطبع أشكالاً بألواني']},{'g':'الوحدة الرابعة: مجال التشكيل المسطح والمجسم','l':['التشكيل بالطين','أحفورتي الصغيرة','أسماكي المخططة']}],

function subjects(g){return ['الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'].includes(g)?[...base,'الدراسات الاجتماعية','المهارات الرقمية']:base}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر الاتصال');return d}function weekName(n){const a=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر'];return 'الأسبوع '+(a[n]||n)}function weekOptions(sel){sel.innerHTML=Array.from({length:18},(_,i)=>`<option value="${i+1}">${weekName(i+1)}</option>`).join('')}async function createSchool(){const name=newSchool.value.trim();if(!name)return alert('اكتب اسم المدرسة');createBtn.disabled=true;createBtn.textContent='جاري الإنشاء...';try{const d=await api({action:'create',name});location.replace(location.origin+location.pathname+'?admin='+d.admin_token)}catch(e){createBtn.disabled=false;createBtn.textContent='إنشاء والدخول';createMsg.textContent=e.message}}async function initAdmin(){landing.classList.add('hide');admin.classList.remove('hide');school=await api({action:'school',admin:adminToken});adminSchool.textContent=school.name;activeWeek.textContent=weekName(school.active_week);weekOptions(weekSelect);weekOptions(archiveWeek);weekSelect.value=school.active_week;archiveWeek.value=school.active_week;term.value=school.active_term;adminGrade.innerHTML=grades.map(x=>`<option>${x}</option>`).join('');shareLink.textContent=location.origin+location.pathname+'?school='+school.share_token;renderAdmin()}async function setWeek(){school=await api({action:'week',admin:adminToken,week:Number(weekSelect.value),term:term.value});activeWeek.textContent=weekName(school.active_week);archiveWeek.value=school.active_week;renderAdmin()}async function renderAdmin(){const w=Number(archiveWeek.value||school.active_week);entries=await api({action:'list',admin:adminToken,term:term.value,week:w});const g=adminGrade.value,ss=subjects(g),done=entries.filter(x=>x.grade===g);progress.innerHTML=`<b>${weekName(w)} — ${g}</b><br>تم استلام ${done.length} من ${ss.length} مواد`;adminSubjects.innerHTML=ss.map(s=>{const x=done.find(e=>e.subject===s);return `<div class="subject"><b>${s}</b><br><small>${x?'✓ '+(x.teacher||'تمت المشاركة'):'بانتظار المشاركة'}</small>${x?`<div class="row"><button class="btn danger" onclick="removeEntry('${encodeURIComponent(g)}','${encodeURIComponent(s)}',${w})">حذف</button></div>`:''}</div>`}).join('')}async function removeEntry(g,s,w){if(!confirm('حذف هذه المشاركة؟'))return;await api({action:'remove',admin:adminToken,term:term.value,week:w,grade:decodeURIComponent(g),subject:decodeURIComponent(s)});renderAdmin()}async function copyShare(){try{await navigator.clipboard.writeText(shareLink.textContent);alert('تم نسخ رابط المعلمات ✓')}catch{prompt('انسخ الرابط:',shareLink.textContent)}}function openShare(){window.open(shareLink.textContent,'_blank')}function openReport(){location.href='weekly-report.html?'+new URLSearchParams({admin:adminToken,week:archiveWeek.value,grade:adminGrade.value,term:term.value})}async function initTeacher(){landing.classList.add('hide');teacherView.classList.remove('hide');school=await api({action:'school',share:shareToken});teacherSchool.textContent=school.name;teacherWeek.textContent=weekName(school.active_week)+' — '+school.active_term;grade.innerHTML=grades.map(x=>`<option>${x}</option>`).join('');fillSubjects()}function fillSubjects(){subject.innerHTML=subjects(grade.value).map(x=>`<option>${x}</option>`).join('');renderLessons()}function renderLessons(){const data=lessonData[grade.value]?.[subject.value];if(!data){lessonPicker.classList.add('hide');manualLessonBox.classList.remove('hide');return}manualLessonBox.classList.add('hide');lessonPicker.classList.remove('hide');lessonChoices.innerHTML=data.map(grp=>`<div class="lessonGroup">${grp.g}</div>${grp.l.map(x=>`<label class="lessonChoice"><input type="checkbox" name="lessonPick" value="${x}"><span>${x}</span></label>`).join('')}`).join('')}async function saveEntry(){if(!teacher.value.trim())return alert('اكتب اسم المعلم/ة');const picked=[...document.querySelectorAll('input[name=lessonPick]:checked')].map(x=>x.value),hasPicker=!lessonPicker.classList.contains('hide');if(hasPicker&&!picked.length)return alert('اختر درسًا واحدًا على الأقل');await api({action:'save',share:shareToken,entry:{grade:grade.value,subject:subject.value,teacher:teacher.value.trim(),lessons:hasPicker?picked:[],manualLessons:hasPicker?'':lessons.value.trim(),homework:homework.value.trim(),notes:notes.value.trim()}});saveMsg.innerHTML='<div class="ok">✓ تم حفظ المشاركة بنجاح.</div>'}weekOptions(weekSelect);weekOptions(archiveWeek);if(adminToken)initAdmin().catch(e=>alert(e.message));else if(shareToken)initTeacher().catch(e=>alert(e.message));
