<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f7f7fc;color:#211d35}.wrap{max-width:1000px;margin:auto;padding:18px}.brand{font-size:25px;font-weight:900;color:#563bc7}.hero{background:linear-gradient(135deg,#5036c7,#755ce3);color:#fff;padding:20px;border-radius:20px;margin:14px 0}.hero h1{margin:0 0 8px}.card{background:#fff;border:1px solid #e6e1f0;border-radius:17px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{margin:8px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dcd6ea;border-radius:11px;background:#fff}.field textarea{min-height:80px}.btn{border:0;border-radius:11px;padding:11px 16px;background:#5a3ed2;color:#fff;font-weight:900;cursor:pointer}.green{background:#087a67}.ghost{background:#eeeaff;color:#4d35af}.danger{background:#fff0f0;color:#a9251c;border:1px solid #efc2bd}.hide{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.subject{padding:11px;border:1px solid #e4deef;border-radius:11px}.weekpill{display:inline-block;background:#fff;color:#563bc7;padding:7px 12px;border-radius:20px;font-weight:900}.reportBtn{width:100%;font-size:16px;padding:13px;margin-top:12px}.lessonAccordion{background:#faf9ff;border:1px solid #e4def4;border-radius:13px;overflow:hidden;margin-top:8px}.lessonAccordion summary{cursor:pointer;list-style:none;padding:14px;font-weight:900;color:#563bc7;background:#f4f1ff;display:flex;justify-content:space-between;align-items:center}.lessonAccordion summary::-webkit-details-marker{display:none}.lessonAccordion summary:after{content:'▼';font-size:12px}.lessonBox{padding:8px 12px;max-height:340px;overflow:auto}.lessonGroup{font-weight:900;color:#563bc7;margin:12px 0 6px}.lessonChoice{display:flex;align-items:center;gap:8px;padding:8px 5px;border-bottom:1px solid #eee9f7}.lessonChoice input{width:auto}.hint{font-size:12px;color:#6e6780;margin:5px 0 10px}.smart{background:#eefaf6;border:1px solid #b9e5d4;padding:12px;border-radius:11px;margin:10px 0;color:#12604b}.adminTop{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.adminTop .field{flex:1;min-width:170px}.linksBox summary{cursor:pointer;font-weight:900;color:#563bc7}.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}.weekCard{border:1px solid #e5e0ee;background:#fff;border-radius:12px;padding:9px 5px;text-align:center;cursor:pointer;font-size:12px}.weekCard.active{border:2px solid #5a3ed2;background:#f7f4ff}.dots{display:flex;justify-content:center;gap:4px;margin-top:7px}.dot{width:11px;height:11px;border-radius:50%;background:#d9d9df}.dot.green{background:#21a366}.dot.red{background:#df4b4b}.gradeStatus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.gradeBtn{border:1px solid #e2ddec;border-radius:12px;background:#fff;padding:11px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:900}.gradeBtn.active{border:2px solid #5a3ed2;background:#f7f4ff}.bigDot{width:14px;height:14px;border-radius:50%;background:#d9d9df;flex:none}.bigDot.green{background:#21a366}.bigDot.red{background:#df4b4b}.progressSimple{font-size:13px;color:#6e6780;margin:7px 0}.legend{font-size:11px;color:#777;margin-top:8px}.legend span{margin-left:12px}.miniDot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-left:3px}.adminSubjectsTitle{font-weight:900;margin:10px 0 7px}@media(max-width:700px){.grid,.subjects{grid-template-columns:1fr}.weeks{grid-template-columns:repeat(3,1fr)}.gradeStatus{grid-template-columns:repeat(2,1fr)}.brand{font-size:21px}}</style></head><body><div class="wrap"><div class="brand">أنجز AI</div><div id="landing"><div class="hero"><h1>الخطة الأسبوعية</h1></div><div class="card"><div class="field"><label>اسم المدرسة</label><input id="newSchool" placeholder="اسم المدرسة"></div><button id="createBtn" class="btn" onclick="createSchool()">إنشاء والدخول</button><div id="createMsg"></div></div></div><div id="admin" class="hide"><div class="hero"><h1 id="adminSchool"></h1><span class="weekpill" id="activeWeek"></span></div><div class="card"><div class="adminTop"><div class="field"><label>الفصل الدراسي</label><select id="term" onchange="renderDashboard()"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div class="field"><label>الأسبوع الحالي</label><select id="weekSelect"></select></div><button class="btn green" onclick="setWeek()">اعتماد</button></div></div><div class="card"><b>حالة الأسابيع</b><div id="weeksStatus" class="weeks"></div><div class="legend"><span><i class="miniDot" style="background:#21a366"></i> مكتمل</span><span><i class="miniDot" style="background:#df4b4b"></i> غير مكتمل</span><span><i class="miniDot" style="background:#d9d9df"></i> لم يبدأ</span></div></div><div class="card"><div id="selectedWeekTitle" style="font-weight:900"></div><div id="gradeStatus" class="gradeStatus"></div><div id="progress" class="progressSimple"></div><div class="adminSubjectsTitle">المواد</div><div id="adminSubjects" class="subjects"></div><button class="btn green reportBtn" onclick="openReport()">عرض التقرير الأسبوعي</button></div><details class="card linksBox"><summary>الروابط</summary><div class="row"><button class="btn" onclick="copyShare()">نسخ رابط المعلمين</button><button class="btn ghost" onclick="openShare()">معاينة</button><button class="btn ghost" onclick="copyAdminLink()">نسخ رابط الإدارة</button></div><div id="shareLink" class="hide"></div><div id="adminLink" class="hide"></div></details><select id="archiveWeek" class="hide"></select><select id="adminGrade" class="hide"></select></div><div id="teacherView" class="hide"><div class="hero"><h1 id="teacherSchool"></h1><span class="weekpill" id="teacherWeek"></span></div><div class="card"><div class="grid"><div class="field"><label>الصف</label><select id="grade" onchange="fillSubjects()"></select></div><div class="field"><label>المادة</label><select id="subject" onchange="renderLessons()"></select></div><div class="field"><label>اسم المعلم/ة</label><input id="teacher"></div></div><div id="smartSuggestion" class="smart hide"></div><div id="lessonPicker" class="field hide"><label>الدروس / الموضوعات</label><div class="hint">أنجز يحدد دروس الأسبوع تلقائيًا، ويمكنك تعديلها.</div><details class="lessonAccordion"><summary id="lessonSummary">اختيار / تغيير الدرس</summary><div id="lessonChoices" class="lessonBox"></div></details><div class="field"><label>تفاصيل إضافية للدرس <small style="font-weight:400;color:#6e6780">(اختياري)</small></label><textarea id="lessonDetails" placeholder="اكتب أي تفصيل للدرس المختار"></textarea></div></div><div id="manualLessonBox" class="field"><label>الدروس / الموضوعات</label><textarea id="lessons" placeholder="اكتب الدروس"></textarea></div><div class="field"><label>الواجبات والتكليفات</label><textarea id="homework"></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes"></textarea></div><button class="btn" onclick="saveEntry()">حفظ / تحديث مشاركتي</button><div id="saveMsg"></div></div></div></div><script src="weekly-plan-data.js?v=20260927-3"></script><script>
const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/weekly-plan-api',qs=new URLSearchParams(location.search);let adminToken=qs.get('admin')||localStorage.getItem('weeklyPlanAdminToken'),shareToken=qs.get('school'),school=null,entries=[],weekCache={},selectedAdminWeek=1,selectedAdminGrade='الأول الابتدائي';const grades=['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],base=['القرآن الكريم','الدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];const lessonData=window.lessonData||{};function subjects(g){const keys=Object.keys(lessonData[g]||{}),old='القرآن الكريم والدراسات الإسلامية';return [...new Set([...base,...keys])].filter(x=>x!==old)}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر الاتصال');return d}function weekName(n){const a=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر'];return 'الأسبوع '+(a[n]||n)}function weekOptions(sel){sel.innerHTML=Array.from({length:18},(_,i)=>`<option value="${i+1}">${weekName(i+1)}</option>`).join('')}async function createSchool(){const name=newSchool.value.trim();if(!name)return alert('اكتب اسم المدرسة');createBtn.disabled=true;try{const d=await api({action:'create',name});localStorage.setItem('weeklyPlanAdminToken',d.admin_token);location.replace(location.origin+location.pathname+'?admin='+d.admin_token)}catch(e){createBtn.disabled=false;createMsg.textContent=e.message}}async function initAdmin(){landing.classList.add('hide');admin.classList.remove('hide');school=await api({action:'school',admin:adminToken});localStorage.setItem('weeklyPlanAdminToken',adminToken);adminSchool.textContent=school.name;activeWeek.textContent=weekName(school.active_week);weekOptions(weekSelect);weekOptions(archiveWeek);weekSelect.value=school.active_week;term.value=school.active_term;selectedAdminWeek=school.active_week;selectedAdminGrade=grades[0];adminGrade.innerHTML=grades.map(x=>`<option>${x}</option>`).join('');shareLink.textContent=location.origin+location.pathname+'?school='+school.share_token;adminLink.textContent=location.origin+location.pathname+'?admin='+adminToken;await renderDashboard()}async function setWeek(){school=await api({action:'week',admin:adminToken,week:Number(weekSelect.value),term:term.value});activeWeek.textContent=weekName(school.active_week);selectedAdminWeek=school.active_week;weekCache={};await renderDashboard()}function normalizedDone(rows,g){const set=new Set(rows.filter(x=>x.grade===g).map(x=>x.subject));if(set.has('القرآن الكريم والدراسات الإسلامية')){set.add('القرآن الكريم');set.add('الدراسات الإسلامية')}return set}function gradeState(rows,g){const ss=subjects(g),done=normalizedDone(rows,g);if(!done.size)return'none';return ss.every(s=>done.has(s))?'green':'red'}async function loadWeek(w){if(weekCache[w])return weekCache[w];weekCache[w]=await api({action:'list',admin:adminToken,term:term.value,week:w});return weekCache[w]}async function renderDashboard(){weekCache={};const calls=Array.from({length:18},(_,i)=>loadWeek(i+1).catch(()=>[]));const all=await Promise.all(calls);weeksStatus.innerHTML=all.map((rows,i)=>{const w=i+1,states=grades.map(g=>gradeState(rows,g));return `<button class="weekCard ${w===selectedAdminWeek?'active':''}" onclick="selectWeek(${w})"><b>${w}</b><div class="dots">${states.map(s=>`<i class="dot ${s}"></i>`).join('')}</div></button>`}).join('');renderSelected(all[selectedAdminWeek-1]||[])}function renderSelected(rows){entries=rows;selectedWeekTitle.textContent=weekName(selectedAdminWeek);gradeStatus.innerHTML=grades.map(g=>`<button class="gradeBtn ${g===selectedAdminGrade?'active':''}" onclick="selectGrade('${g}')"><i class="bigDot ${gradeState(rows,g)}"></i>${g.replace(' الابتدائي','')}</button>`).join('');const ss=subjects(selectedAdminGrade),done=normalizedDone(rows,selectedAdminGrade);progress.textContent=`${done.size} من ${ss.length} مواد مكتملة`;adminSubjects.innerHTML=ss.map(s=>{let x=rows.find(e=>e.grade===selectedAdminGrade&&e.subject===s);if(!x&&['القرآن الكريم','الدراسات الإسلامية'].includes(s))x=rows.find(e=>e.grade===selectedAdminGrade&&e.subject==='القرآن الكريم والدراسات الإسلامية');return `<div class="subject"><b>${s}</b><br><small>${x?'✓ '+(x.teacher||'تمت المشاركة'):'بانتظار المشاركة'}</small>${x&&x.subject===s?`<div class="row"><button class="btn danger" onclick="removeEntry('${encodeURIComponent(selectedAdminGrade)}','${encodeURIComponent(s)}',${selectedAdminWeek})">حذف</button></div>`:''}</div>`}).join('');archiveWeek.value=selectedAdminWeek;adminGrade.value=selectedAdminGrade}async function selectWeek(w){selectedAdminWeek=w;const rows=await loadWeek(w);renderSelected(rows);document.querySelectorAll('.weekCard').forEach((x,i)=>x.classList.toggle('active',i+1===w))}function selectGrade(g){selectedAdminGrade=g;renderSelected(entries)}async function removeEntry(g,s,w){if(!confirm('حذف هذه المشاركة؟'))return;await api({action:'remove',admin:adminToken,term:term.value,week:w,grade:decodeURIComponent(g),subject:decodeURIComponent(s)});delete weekCache[w];await renderDashboard()}async function copyText(v,msg){try{await navigator.clipboard.writeText(v);alert(msg)}catch{prompt('انسخ الرابط:',v)}}function copyShare(){copyText(shareLink.textContent,'تم نسخ رابط المعلمين ✓')}function copyAdminLink(){copyText(adminLink.textContent,'تم نسخ رابط الإدارة ✓')}function openShare(){window.open(shareLink.textContent,'_blank')}function openReport(){location.href='weekly-report.html?'+new URLSearchParams({admin:adminToken,week:selectedAdminWeek,grade:selectedAdminGrade,term:term.value})}async function initTeacher(){landing.classList.add('hide');teacherView.classList.remove('hide');school=await api({action:'school',share:shareToken});teacherSchool.textContent=school.name;teacherWeek.textContent=weekName(school.active_week)+' — '+school.active_term;grade.innerHTML=grades.map(x=>`<option>${x}</option>`).join('');fillSubjects()}function fillSubjects(){subject.innerHTML=subjects(grade.value).map(x=>`<option>${x}</option>`).join('');renderLessons()}function updateLessonSummary(){const summary=document.getElementById('lessonSummary');if(!summary)return;const picked=[...document.querySelectorAll('input[name=lessonPick]:checked')].map(x=>x.value);if(!picked.length){summary.textContent='اختيار / تغيير الدرس';return}summary.textContent='الدرس المقترح: '+(picked.length<=2?picked.join(' + '):picked.slice(0,2).join(' + ')+' + '+(picked.length-2)+' أخرى')+' — تغيير'}function renderLessons(){const data=lessonData[grade.value]?.[subject.value];smartSuggestion.classList.add('hide');const detail=document.getElementById('lessonDetails');if(detail)detail.value='';if(!data){lessonPicker.classList.add('hide');manualLessonBox.classList.remove('hide');return}manualLessonBox.classList.add('hide');lessonPicker.classList.remove('hide');lessonChoices.innerHTML=data.map(grp=>`<div class="lessonGroup">${grp.g}</div>${grp.l.map(x=>`<label class="lessonChoice"><input type="checkbox" name="lessonPick" value="${x}" onchange="updateLessonSummary()"><span>${x}</span></label>`).join('')}`).join('');applySmartSuggestion();updateLessonSummary()}function applySmartSuggestion(){const checks=[...document.querySelectorAll('input[name=lessonPick]')];if(!checks.length||!school)return;checks.forEach(c=>c.checked=false);const wk=Math.max(1,Math.min(18,Number(school.active_week)||1)),active=[1,2,3,5,6,7,8,9,10,11,12,14,15,16,17,18];if([4,13].includes(wk)){smartSuggestion.innerHTML=`<b>✨ اقتراح أنجز — ${weekName(wk)}:</b> أسبوع خفيف/إجازة؛ راجعي الخطة قبل إضافة درس.`;smartSuggestion.classList.remove('hide');updateLessonSummary();return}let pos=active.indexOf(wk);if(pos<0)pos=0;const start=Math.floor(pos*checks.length/active.length),end=Math.max(start+1,Math.floor((pos+1)*checks.length/active.length)),chosen=checks.slice(start,Math.min(checks.length,end));chosen.forEach(c=>c.checked=true);smartSuggestion.innerHTML=`<b>✨ اقتراح أنجز — ${weekName(wk)}:</b> تم تحديد ${chosen.length} من دروس الأسبوع تلقائيًا. يمكنك تعديلها من القائمة.`;smartSuggestion.classList.remove('hide');homework.value=chosen.length?'حل تدريبات دروس الأسبوع ومراجعتها':'';updateLessonSummary()}async function saveEntry(){if(!teacher.value.trim())return alert('اكتب اسم المعلم/ة');const picked=[...document.querySelectorAll('input[name=lessonPick]:checked')].map(x=>x.value),hasPicker=!lessonPicker.classList.contains('hide'),detail=hasPicker?(lessonDetails.value||'').trim():'';if(hasPicker&&!picked.length)return alert('اختر درسًا واحدًا على الأقل');await api({action:'save',share:shareToken,entry:{grade:grade.value,subject:subject.value,teacher:teacher.value.trim(),lessons:hasPicker?picked:[],manualLessons:hasPicker?detail:lessons.value.trim(),homework:homework.value.trim(),notes:notes.value.trim()}});saveMsg.innerHTML='<div style="background:#edf9f4;padding:12px;border-radius:11px;margin-top:10px">✓ تم الحفظ</div>'}weekOptions(weekSelect);weekOptions(archiveWeek);if(shareToken)initTeacher().catch(e=>alert(e.message));else if(adminToken)initAdmin().catch(e=>{localStorage.removeItem('weeklyPlanAdminToken');location.reload()});
</script></body></html>
