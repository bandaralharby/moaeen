<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f7f7fc;color:#211d35}.wrap{max-width:1000px;margin:auto;padding:18px}.brand{font-size:25px;font-weight:900;color:#563bc7}.hero{background:linear-gradient(135deg,#5036c7,#755ce3);color:#fff;padding:20px;border-radius:20px;margin:14px 0}.hero h1{margin:0 0 7px}.card{background:#fff;border:1px solid #e6e1f0;border-radius:17px;padding:16px;margin:12px 0}.field{margin:8px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dcd6ea;border-radius:11px;background:#fff}.field textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:11px 16px;background:#5a3ed2;color:#fff;font-weight:900;cursor:pointer}.green{background:#087a67}.ghost{background:#eeeaff;color:#4d35af}.hide{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.weekpill{display:inline-block;background:#fff;color:#563bc7;padding:7px 12px;border-radius:20px;font-weight:900}.adminTop{display:flex;align-items:end;gap:8px}.adminTop .field{flex:1}.weekStrip{display:flex;gap:9px;overflow-x:auto;padding:7px 2px 10px;scrollbar-width:none}.weekStrip::-webkit-scrollbar{display:none}.weekMini{position:relative;flex:0 0 52px;height:64px;border:1px solid #e5e1ed;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:900;font-size:15px;color:#4f4a5d;cursor:pointer;box-shadow:0 2px 8px rgba(54,44,90,.04);transition:.15s}.weekMini.active{border:2px solid #5a3ed2;background:#f7f5ff;color:#5137c4;box-shadow:0 5px 14px rgba(90,62,210,.12)}.statusDot{width:12px;height:12px;border-radius:50%;background:#d7d9df;border:2px solid #fff;box-shadow:0 0 0 2px #e7e8ec;display:inline-block;flex:none}.statusDot.green{background:#22a06b;box-shadow:0 0 0 2px #d9f1e7}.statusDot.red{background:#df554f;box-shadow:0 0 0 2px #f8dfdd}.sectionTitle{font-size:16px;font-weight:900;margin-bottom:10px}.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gradeCard{border:1px solid #e6e1ed;border-radius:16px;background:#fff;padding:14px;text-align:right;cursor:pointer;min-height:83px;box-shadow:0 2px 8px rgba(54,44,90,.035);transition:.15s}.gradeCard.active{border:2px solid #5a3ed2;background:#faf9ff;box-shadow:0 5px 14px rgba(90,62,210,.09)}.gradeHead{display:flex;align-items:center;justify-content:space-between;font-weight:900;color:#2e69c9}.gradeState{font-size:12px;margin-top:9px;color:#777}.stateBadge{display:inline-flex;align-items:center;gap:7px;margin-top:9px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.stateBadge.none{background:#f2f3f5;color:#7a7e86}.stateBadge.red{background:#fff0ef;color:#b33d38}.stateBadge.green{background:#eaf8f2;color:#087a58}.stateBadge .statusDot{width:8px;height:8px;border:0;box-shadow:none}.missing{margin-top:12px}.missingBox{display:flex;flex-wrap:wrap;gap:7px}.missingTag{background:#fff1f1;color:#a72d2d;border:1px solid #f0cccc;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800}.completeBox{background:#edf9f4;color:#087a67;border:1px solid #c7e7da;border-radius:12px;padding:12px;font-weight:900}.bottomActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.linksBox summary{cursor:pointer;font-weight:900;color:#563bc7}.lessonAccordion{background:#faf9ff;border:1px solid #e4def4;border-radius:13px;overflow:hidden;margin-top:8px}.lessonAccordion summary{cursor:pointer;list-style:none;padding:14px;font-weight:900;color:#563bc7;background:#f4f1ff}.lessonBox{padding:8px 12px;max-height:340px;overflow:auto}.lessonGroup{font-weight:900;color:#563bc7;margin:12px 0 6px}.lessonChoice{display:flex;align-items:center;gap:8px;padding:8px 5px;border-bottom:1px solid #eee9f7}.lessonChoice input{width:auto}.hint{font-size:12px;color:#6e6780;margin:5px 0 10px}.smart{background:#eefaf6;border:1px solid #b9e5d4;padding:12px;border-radius:11px;margin:10px 0;color:#12604b}@media(max-width:700px){.grid{grid-template-columns:1fr}.grades{grid-template-columns:repeat(2,1fr)}.adminTop{align-items:stretch;flex-direction:column}.adminTop .field,.adminTop .btn{width:100%}.wrap{padding:12px}.bottomActions{grid-template-columns:1fr 1fr}.weekMini{flex-basis:54px}}</style></head><body><div class="wrap"><div class="brand">أنجز AI</div><div id="landing"><div class="hero"><h1>الخطة الأسبوعية</h1></div><div class="card"><div class="field"><label>اسم المدرسة</label><input id="newSchool"></div><button id="createBtn" class="btn" onclick="createSchool()">إنشاء والدخول</button><div id="createMsg"></div></div></div><div id="admin" class="hide"><div class="hero"><h1 id="adminSchool"></h1><div id="adminMeta"></div></div><div class="card"><div class="adminTop"><div class="field"><label>الفصل</label><select id="term" onchange="renderDashboard()"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div class="field"><label>الأسبوع المعتمد</label><select id="weekSelect"></select></div><button class="btn green" onclick="setWeek()">اعتماد</button></div></div><div class="card"><div class="sectionTitle">الأسابيع</div><div id="weeksStatus" class="weekStrip"></div></div><div class="card"><div class="sectionTitle">حالة الصفوف</div><div id="gradeStatus" class="grades"></div><div class="missing"><div id="missingTitle" class="sectionTitle"></div><div id="adminSubjects"></div></div><div class="bottomActions"><button class="btn green" onclick="openReport()">عرض التقرير</button><button class="btn ghost" onclick="document.getElementById('links').open=!document.getElementById('links').open">الروابط</button></div></div><details id="links" class="card linksBox"><summary>روابط المدرسة</summary><div class="row"><button class="btn" onclick="copyShare()">نسخ رابط المعلمين</button><button class="btn ghost" onclick="openShare()">معاينة</button><button class="btn ghost" onclick="copyAdminLink()">رابط الإدارة</button></div><div id="shareLink" class="hide"></div><div id="adminLink" class="hide"></div></details></div><div id="teacherView" class="hide"><div class="hero"><h1 id="teacherSchool"></h1><span class="weekpill" id="teacherWeek"></span></div><div class="card"><div class="grid"><div class="field"><label>الصف</label><select id="grade" onchange="fillSubjects()"></select></div><div class="field"><label>المادة</label><select id="subject" onchange="renderLessons()"></select></div><div class="field"><label>اسم المعلم/ة</label><input id="teacher"></div></div><div id="smartSuggestion" class="smart hide"></div><div id="lessonPicker" class="field hide"><label>الدروس / الموضوعات</label><div class="hint">أنجز يحدد دروس الأسبوع تلقائيًا، ويمكنك تعديلها.</div><details class="lessonAccordion"><summary id="lessonSummary">اختيار / تغيير الدرس</summary><div id="lessonChoices" class="lessonBox"></div></details><div class="field"><label>تفاصيل إضافية للدرس <small>(اختياري)</small></label><textarea id="lessonDetails" placeholder="اكتب أي تفصيل للدرس المختار"></textarea></div></div><div id="manualLessonBox" class="field"><label>الدروس / الموضوعات</label><textarea id="lessons"></textarea></div><div class="field"><label>الواجبات والتكليفات</label><textarea id="homework"></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes"></textarea></div><button class="btn" onclick="saveEntry()">حفظ / تحديث مشاركتي</button><div id="saveMsg"></div></div></div></div><script src="weekly-plan-data.js?v=20260927-5"></script><script>
const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/weekly-plan-api',qs=new URLSearchParams(location.search);let adminToken=qs.get('admin')||localStorage.getItem('weeklyPlanAdminToken'),shareToken=qs.get('school'),school=null,entries=[],weekCache={},selectedAdminWeek=1,selectedAdminGrade='الأول الابتدائي';const grades=['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],base=['القرآن الكريم','الدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];const lessonData=window.lessonData||{};function subjects(g){const keys=Object.keys(lessonData[g]||{}),old='القرآن الكريم والدراسات الإسلامية';return [...new Set([...base,...keys])].filter(x=>x!==old)}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر الاتصال');return d}function weekName(n){const a=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر'];return 'الأسبوع '+(a[n]||n)}function weekOptions(sel){sel.innerHTML=Array.from({length:18},(_,i)=>`<option value="${i+1}">${weekName(i+1)}</option>`).join('')}async function createSchool(){const name=newSchool.value.trim();if(!name)return alert('اكتب اسم المدرسة');createBtn.disabled=true;try{const d=await api({action:'create',name});localStorage.setItem('weeklyPlanAdminToken',d.admin_token);location.replace(location.origin+location.pathname+'?admin='+d.admin_token)}catch(e){createBtn.disabled=false;createMsg.textContent=e.message}}async function initAdmin(){landing.classList.add('hide');admin.classList.remove('hide');school=await api({action:'school',admin:adminToken});localStorage.setItem('weeklyPlanAdminToken',adminToken);weekOptions(weekSelect);weekSelect.value=school.active_week;term.value=school.active_term;selectedAdminWeek=school.active_week;adminSchool.textContent=school.name;adminMeta.textContent=school.active_term+' • '+weekName(school.active_week);shareLink.textContent=location.origin+location.pathname+'?school='+school.share_token;adminLink.textContent=location.origin+location.pathname+'?admin='+adminToken;await renderDashboard()}async function setWeek(){school=await api({action:'week',admin:adminToken,week:Number(weekSelect.value),term:term.value});selectedAdminWeek=school.active_week;adminMeta.textContent=school.active_term+' • '+weekName(school.active_week);weekCache={};await renderDashboard()}function normalizedDone(rows,g){const set=new Set(rows.filter(x=>x.grade===g).map(x=>x.subject));if(set.has('القرآن الكريم والدراسات الإسلامية')){set.add('القرآن الكريم');set.add('الدراسات الإسلامية')}return set}function gradeInfo(rows,g){const ss=subjects(g),done=normalizedDone(rows,g),missing=ss.filter(s=>!done.has(s));return{total:ss.length,done:done.size,missing,state:done.size===0?'none':missing.length?'red':'green'}}function weekState(rows){const states=grades.map(g=>gradeInfo(rows,g).state);if(states.every(x=>x==='green'))return'green';if(states.every(x=>x==='none'))return'none';return'red'}async function loadWeek(w){if(weekCache[w])return weekCache[w];weekCache[w]=await api({action:'list',admin:adminToken,term:term.value,week:w});return weekCache[w]}async function renderDashboard(){weekCache={};const all=await Promise.all(Array.from({length:18},(_,i)=>loadWeek(i+1).catch(()=>[])));weeksStatus.innerHTML=all.map((rows,i)=>`<button class="weekMini ${i+1===selectedAdminWeek?'active':''}" onclick="selectWeek(${i+1})"><span>${i+1}</span><i class="statusDot ${weekState(rows)}"></i></button>`).join('');renderSelected(all[selectedAdminWeek-1]||[])}function renderSelected(rows){entries=rows;gradeStatus.innerHTML=grades.map(g=>{const z=gradeInfo(rows,g),txt=z.state==='green'?'مكتمل':z.state==='none'?'لم يبدأ':'ناقص '+z.missing.length;return `<button class="gradeCard ${g===selectedAdminGrade?'active':''}" onclick="selectGrade('${g}')"><div class="gradeHead"><span>${g.replace(' الابتدائي','')}</span></div><div class="stateBadge ${z.state}"><i class="statusDot ${z.state}"></i><span>${txt}</span></div></button>`}).join('');renderMissing(rows)}function renderMissing(rows){const z=gradeInfo(rows,selectedAdminGrade);missingTitle.textContent=selectedAdminGrade.replace(' الابتدائي','')+' — '+(z.missing.length?'المواد الناقصة':'الخطة مكتملة');adminSubjects.innerHTML=z.missing.length?`<div class="missingBox">${z.missing.map(s=>`<span class="missingTag">${s}</span>`).join('')}</div>`:`<div class="completeBox">✓ جميع المواد مكتملة</div>`}async function selectWeek(w){selectedAdminWeek=w;renderSelected(await loadWeek(w));document.querySelectorAll('.weekMini').forEach((x,i)=>x.classList.toggle('active',i+1===w))}function selectGrade(g){selectedAdminGrade=g;document.querySelectorAll('.gradeCard').forEach((x,i)=>x.classList.toggle('active',grades[i]===g));renderMissing(entries)}async function copyText(v,msg){try{await navigator.clipboard.writeText(v);alert(msg)}catch{prompt('انسخ الرابط:',v)}}function copyShare(){copyText(shareLink.textContent,'تم نسخ رابط المعلمين ✓')}function copyAdminLink(){copyText(adminLink.textContent,'تم نسخ رابط الإدارة ✓')}function openShare(){window.open(shareLink.textContent,'_blank')}function openReport(){location.href='weekly-report.html?'+new URLSearchParams({admin:adminToken,week:selectedAdminWeek,grade:selectedAdminGrade,term:term.value})}async function initTeacher(){landing.classList.add('hide');teacherView.classList.remove('hide');school=await api({action:'school',share:shareToken});teacherSchool.textContent=school.name;teacherWeek.textContent=weekName(school.active_week)+' — '+school.active_term;grade.innerHTML=grades.map(x=>`<option>${x}</option>`).join('');fillSubjects()}function fillSubjects(){subject.innerHTML=subjects(grade.value).map(x=>`<option>${x}</option>`).join('');renderLessons()}function updateLessonSummary(){const picked=[...document.querySelectorAll('input[name=lessonPick]:checked')].map(x=>x.value);lessonSummary.textContent=picked.length?'الدرس المقترح: '+picked.join(' + ')+' — تغيير':'اختيار / تغيير الدرس'}function renderLessons(){const data=lessonData[grade.value]?.[subject.value];smartSuggestion.classList.add('hide');lessonDetails.value='';if(!data){lessonPicker.classList.add('hide');manualLessonBox.classList.remove('hide');return}manualLessonBox.classList.add('hide');lessonPicker.classList.remove('hide');lessonChoices.innerHTML=data.map(grp=>`<div class="lessonGroup">${grp.g}</div>${grp.l.map(x=>`<label class="lessonChoice"><input type="checkbox" name="lessonPick" value="${x}" onchange="updateLessonSummary()"><span>${x}</span></label>`).join('')}`).join('');applySmartSuggestion();updateLessonSummary()}function applySmartSuggestion(){const checks=[...document.querySelectorAll('input[name=lessonPick]')];if(!checks.length||!school)return;checks.forEach(c=>c.checked=false);const wk=Math.max(1,Math.min(18,Number(school.active_week)||1)),active=[1,2,3,5,6,7,8,9,10,11,12,14,15,16,17,18];if([4,13].includes(wk)){smartSuggestion.innerHTML=`<b>✨ اقتراح أنجز:</b> أسبوع خفيف/إجازة؛ راجع الخطة.`;smartSuggestion.classList.remove('hide');return}let pos=active.indexOf(wk);if(pos<0)pos=0;const start=Math.floor(pos*checks.length/active.length),end=Math.max(start+1,Math.floor((pos+1)*checks.length/active.length)),chosen=checks.slice(start,Math.min(checks.length,end));chosen.forEach(c=>c.checked=true);smartSuggestion.innerHTML=`<b>✨ اقتراح أنجز:</b> تم تحديد ${chosen.length} من دروس الأسبوع تلقائيًا.`;smartSuggestion.classList.remove('hide');homework.value=chosen.length?'حل تدريبات دروس الأسبوع ومراجعتها':'';updateLessonSummary()}async function saveEntry(){if(!teacher.value.trim())return alert('اكتب اسم المعلم/ة');const picked=[...document.querySelectorAll('input[name=lessonPick]:checked')].map(x=>x.value),hasPicker=!lessonPicker.classList.contains('hide'),detail=hasPicker?lessonDetails.value.trim():'';if(hasPicker&&!picked.length)return alert('اختر درسًا واحدًا على الأقل');await api({action:'save',share:shareToken,entry:{grade:grade.value,subject:subject.value,teacher:teacher.value.trim(),lessons:hasPicker?picked:[],manualLessons:hasPicker?detail:lessons.value.trim(),homework:homework.value.trim(),notes:notes.value.trim()}});saveMsg.innerHTML='<div class="completeBox" style="margin-top:10px">✓ تم الحفظ</div>'}weekOptions(weekSelect);if(shareToken)initTeacher().catch(e=>alert(e.message));else if(adminToken)initAdmin().catch(e=>{localStorage.removeItem('weeklyPlanAdminToken');location.reload()});
</script></body></html>
