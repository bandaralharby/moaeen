<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f7f7fc;color:#211d35}.wrap{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#0f766e,#0b5f69);color:#fff;padding:20px;border-radius:20px;margin:14px 0}.card{background:#fff;border:1px solid #e6e1f0;border-radius:17px;padding:16px;margin:12px 0}.field{margin:8px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dcd6ea;border-radius:11px;background:#fff}.field textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:0;border-radius:11px;padding:11px 16px;background:#0f766e;color:#fff;font-weight:900}.green{background:#087a67}.ghost{background:#eaf5f3;color:#0b655f}.hide{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.weekpill{display:inline-block;background:#fff;color:#0f766e;padding:7px 12px;border-radius:20px;font-weight:900}.adminTop{display:flex;align-items:end;gap:8px}.adminTop .field{flex:1}.weekStrip{display:flex;gap:9px;overflow-x:auto;padding:7px 2px 10px}.weekMini{flex:0 0 52px;height:64px;border:1px solid #e5e1ed;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-weight:900}.weekMini.active{border:2px solid #0f766e;background:#f0f9f7}.statusDot{width:12px;height:12px;border-radius:50%;background:#d7d9df;display:inline-block}.statusDot.green{background:#22a06b}.statusDot.red{background:#df554f}.sectionTitle{font-size:16px;font-weight:900;margin-bottom:10px}.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gradeCard{border:1px solid #e6e1ed;border-radius:16px;background:#fff;padding:14px;text-align:right;min-height:83px}.gradeCard.active{border:2px solid #0f766e;background:#f4fbf9}.gradeHead{font-weight:900;color:#176b79}.stateBadge{display:inline-flex;margin-top:9px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.stateBadge.none{background:#f2f3f5}.stateBadge.red{background:#fff0ef;color:#b33d38}.stateBadge.green{background:#eaf8f2;color:#087a58}.missing{margin-top:12px}.missingBox{display:flex;flex-wrap:wrap;gap:7px}.missingTag{background:#fff1f1;color:#a72d2d;border:1px solid #f0cccc;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800}.completeBox{background:#edf9f4;color:#087a67;border:1px solid #c7e7da;border-radius:12px;padding:12px;font-weight:900}.bottomActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.lessonAccordion{background:#f7fbfa;border:1px solid #d8ebe7;border-radius:13px;overflow:hidden}.lessonBox{padding:8px 12px;max-height:340px;overflow:auto}.lessonGroup{font-weight:900;color:#0f766e;margin:12px 0 6px}.lessonChoice{display:flex;gap:8px;padding:8px 5px}.smart{background:#eefaf6;border:1px solid #b9e5d4;padding:12px;border-radius:11px;margin:10px 0;color:#12604b;font-weight:800}.hint{font-size:12px;color:#6e6780}@media(max-width:700px){.grid{grid-template-columns:1fr}.grades{grid-template-columns:repeat(2,1fr)}.adminTop{flex-direction:column;align-items:stretch}.bottomActions{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div id="landing"><div class="hero"><h1>الخطة الأسبوعية</h1></div><div class="card"><div class="field"><label>اسم المدرسة</label><input id="newSchool"></div><button id="createBtn" class="btn" onclick="createSchool()">إنشاء والدخول</button></div></div><div id="admin" class="hide"><div class="hero"><h1 id="adminSchool"></h1><div id="adminMeta"></div></div><div class="card"><div class="adminTop"><div class="field"><label>الفصل</label><select id="term"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div class="field"><label>الأسبوع المعتمد</label><select id="weekSelect"></select></div><button class="btn green" onclick="setWeek()">اعتماد</button></div></div><div class="card"><div class="sectionTitle">الأسابيع</div><div id="weeksStatus" class="weekStrip"></div></div><div class="card"><div class="sectionTitle">حالة الصفوف</div><div id="gradeStatus" class="grades"></div><div class="missing"><div id="missingTitle" class="sectionTitle"></div><div id="adminSubjects"></div></div><div class="bottomActions"><button class="btn green" onclick="openReport()">عرض التقرير</button><button class="btn ghost" onclick="document.getElementById('links').open=!document.getElementById('links').open">الروابط</button></div></div><details id="links" class="card"><summary>روابط المدرسة</summary><div class="row"><button class="btn" onclick="copyShare()">نسخ رابط المعلمين</button><button class="btn ghost" onclick="openShare()">معاينة</button><button class="btn ghost" onclick="copyAdminLink()">رابط الإدارة</button></div><div id="shareLink" class="hide"></div><div id="adminLink" class="hide"></div></details></div><div id="teacherView" class="hide"><div class="hero"><h1 id="teacherSchool"></h1><span class="weekpill" id="teacherWeek"></span></div><div class="card"><div class="grid"><div class="field"><label>الصف</label><select id="grade" onchange="fillSubjects()"></select></div><div class="field"><label>المادة</label><select id="subject" onchange="renderLessons()"></select></div><div class="field"><label>اسم المعلم/ة</label><input id="teacher"></div></div><div id="smartSuggestion" class="smart hide"></div><div id="lessonPicker" class="field hide"><label>الدروس / الموضوعات</label><div class="hint">تم اختيار دروس الأسبوع تلقائياً حسب الخطة، ويمكن تعديلها عند الحاجة.</div><details class="lessonAccordion"><summary id="lessonSummary">اختيار / تغيير الدرس</summary><div id="lessonChoices" class="lessonBox"></div></details><div class="field"><label>تفاصيل إضافية للدرس</label><textarea id="lessonDetails"></textarea></div></div><div id="manualLessonBox" class="field"><label>الدروس / الموضوعات</label><textarea id="lessons"></textarea></div><div class="field"><label>الواجبات والتكليفات</label><textarea id="homework"></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes"></textarea></div><button class="btn" onclick="saveEntry()">حفظ / تحديث مشاركتي</button><div id="saveMsg"></div></div></div></div><script src="weekly-plan-data.js?v=20260928-1"></script><script>const API='https://cixwjisioawswnnwwswf.supabase.co/functions/v1/weekly-plan-api',qs=new URLSearchParams(location.search);let adminToken=qs.get('admin')||localStorage.getItem('weeklyPlanAdminToken'),shareToken=qs.get('school'),school=null,entries=[],selectedAdminWeek=1,selectedAdminGrade='الأول الابتدائي';const grades=['الأول الابتدائي','الثاني الابتدائي','الثالث الابتدائي','الرابع الابتدائي','الخامس الابتدائي','السادس الابتدائي'],base=['القرآن الكريم','الدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'],lessonData=window.lessonData||{};function subjects(g){return [...new Set([...base,...Object.keys(lessonData[g]||{})])].filter(x=>x!=='القرآن الكريم والدراسات الإسلامية')}async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok||d.error)throw Error(d.error||'تعذر الاتصال');return d}function weekName(n){return 'الأسبوع '+n}function weekOptions(){if(window.weekSelect)weekSelect.innerHTML=Array.from({length:18},(_,i)=>`<option value="${i+1}">${weekName(i+1)}</option>`).join('')}async function createSchool(){const name=newSchool.value.trim();if(!name)return;const d=await api({action:'create',name});localStorage.setItem('weeklyPlanAdminToken',d.admin_token);location.replace(location.pathname+'?admin='+d.admin_token)}async function initAdmin(){landing.classList.add('hide');admin.classList.remove('hide');school=await api({action:'school',admin:adminToken});weekOptions();weekSelect.value=school.active_week;term.value=school.active_term||'الفصل الدراسي الأول';selectedAdminWeek=Number(school.active_week);adminSchool.textContent=school.name;adminMeta.textContent=term.value+' • '+weekName(selectedAdminWeek);shareLink.textContent=location.origin+location.pathname+'?school='+school.share_token;adminLink.textContent=location.origin+location.pathname+'?admin='+adminToken;await renderDashboard()}async function setWeek(){school=await api({action:'week',admin:adminToken,week:Number(weekSelect.value),term:term.value});selectedAdminWeek=Number(weekSelect.value);adminMeta.textContent=term.value+' • '+weekName(selectedAdminWeek);await renderDashboard()}function gradeInfo(rows,g){const ss=subjects(g),set=new Set(rows.filter(x=>x.grade===g).map(x=>x.subject));if(set.has('القرآن الكريم والدراسات الإسلامية')){set.add('القرآن الكريم');set.add('الدراسات الإسلامية')}const missing=ss.filter(s=>!set.has(s));return{missing,state:set.size===0?'none':missing.length?'red':'green'}}async function loadWeek(w){return api({action:'list',admin:adminToken,term:term.value,week:w})}async function renderDashboard(){const all=await Promise.all(Array.from({length:18},(_,i)=>loadWeek(i+1).catch(()=>[])));weeksStatus.innerHTML=all.map((r,i)=>`<button class="weekMini ${i+1===selectedAdminWeek?'active':''}" onclick="selectWeek(${i+1})"><span>${i+1}</span><i class="statusDot ${grades.every(g=>gradeInfo(r,g).state==='green')?'green':r.length?'red':''}"></i></button>`).join('');renderSelected(all[selectedAdminWeek-1]||[])}function renderSelected(rows){entries=rows;gradeStatus.innerHTML=grades.map(g=>{const z=gradeInfo(rows,g);return `<button class="gradeCard ${g===selectedAdminGrade?'active':''}" onclick="selectGrade('${g}')"><div class="gradeHead">${g.replace(' الابتدائي','')}</div><div class="stateBadge ${z.state}">${z.state==='green'?'مكتمل':z.state==='none'?'لم يبدأ':'ناقص '+z.missing.length}</div></button>`}).join('');renderMissing()}function renderMissing(){const z=gradeInfo(entries,selectedAdminGrade);missingTitle.textContent=selectedAdminGrade.replace(' الابتدائي','');adminSubjects.innerHTML=z.missing.length?`<div class="missingBox">${z.missing.map(s=>`<span class="missingTag">${s}</span>`).join('')}</div>`:'<div class="completeBox">✓ جميع المواد مكتملة</div>'}async function selectWeek(w){selectedAdminWeek=w;renderSelected(await loadWeek(w))}function selectGrade(g){selectedAdminGrade=g;renderSelected(entries)}function openReport(){location.href='weekly-report.html?'+new URLSearchParams({admin:adminToken,week:selectedAdminWeek,grade:selectedAdminGrade,term:term.value,v:Date.now()})}function copyShare(){navigator.clipboard.writeText(shareLink.textContent)}function copyAdminLink(){navigator.clipboard.writeText(adminLink.textContent)}function openShare(){window.open(shareLink.textContent,'_blank')}function fillSubjects(){subject.innerHTML=subjects(grade.value).map(x=>`<option>${x}</option>`).join('');renderLessons()}function plannedLessons(data,w){if(!data||!data.length)return[];let explicit=[];data.forEach(grp=>(grp.l||[]).forEach(x=>{if(typeof x==='object'&&Number(x.week)===Number(w))explicit.push(x.title||x.name||x.lesson||'')}));if(explicit.length)return explicit.filter(Boolean);const lessons=data.flatMap(grp=>(grp.l||[]).map(x=>typeof x==='string'?x:(x.title||x.name||x.lesson||''))).filter(Boolean);if(!lessons.length)return[];const totalWeeks=18,start=Math.floor((Number(w)-1)*lessons.length/totalWeeks),end=Math.max(start+1,Math.floor(Number(w)*lessons.length/totalWeeks));return lessons.slice(start,Math.min(end,lessons.length))}function renderLessons(){const data=lessonData[grade.value]?.[subject.value],w=Number(school?.active_week||1);lessonPicker.classList.toggle('hide',!data);manualLessonBox.classList.toggle('hide',!!data);smartSuggestion.classList.toggle('hide',!data);if(!data)return;const auto=plannedLessons(data,w);lessonChoices.innerHTML=data.map(grp=>`<div class="lessonGroup">${grp.g}</div>${(grp.l||[]).map(v=>{const x=typeof v==='string'?v:(v.title||v.name||v.lesson||'');return `<label class="lessonChoice"><input type="checkbox" name="lessonPick" value="${x.replace(/"/g,'&quot;')}" ${auto.includes(x)?'checked':''}><span>${x}</span></label>`}).join('')}`).join('');smartSuggestion.textContent=auto.length?'✓ دروس '+weekName(w)+' حسب الخطة: '+auto.join('، '):'لا يوجد درس محدد لهذا الأسبوع في بيانات الخطة';lessonSummary.textContent=auto.length?auto.join('، '):'اختيار / تغيير الدرس'}async function initTeacher(){landing.classList.add('hide');teacherView.classList.remove('hide');school=await api({action:'school',share:shareToken});teacherSchool.textContent=school.name;teacherWeek.textContent=weekName(school.active_week)+' — '+school.active_term;grade.innerHTML=grades.map(x=>`<option>${x}</option>`).join('');fillSubjects()}async function saveEntry(){const picked=[...document.querySelectorAll('input[name=lessonPick]:checked')].map(x=>x.value);await api({action:'save',share:shareToken,entry:{grade:grade.value,subject:subject.value,teacher:teacher.value.trim(),lessons:picked,manualLessons:lessonDetails.value.trim()||(window.lessons?lessons.value.trim():''),homework:homework.value.trim(),notes:notes.value.trim()}});saveMsg.innerHTML='<div class="completeBox">✓ تم الحفظ</div>'}weekOptions();if(shareToken)initTeacher();else if(adminToken)initAdmin();</script></body></html>
