<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الخطة الأسبوعية | أنجز AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7fc;color:#19172b}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:900;color:#5538c8}.back{color:#5538c8;text-decoration:none;font-weight:800}.hero{margin:18px 0;background:linear-gradient(135deg,#5036c7,#735be4);color:#fff;border-radius:22px;padding:26px}.panel{background:#fff;border:1px solid #e7e3f1;border-radius:17px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.field{margin-bottom:11px}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dcd7ea;border-radius:11px;background:#fff}.field textarea{min-height:80px}.btn{border:0;border-radius:11px;padding:12px 17px;background:#5b3fd6;color:#fff;font-weight:900;cursor:pointer}.ghost{background:#eee9ff;color:#5038b4}.actions{display:flex;gap:9px;flex-wrap:wrap}.share,.ok{margin-top:12px;padding:13px;border-radius:12px;background:#eef9f4;border:1px solid #cbe7db;word-break:break-all}.screen{display:none}.screen.on{display:block}.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.subjectCard{border:1px solid #e5e0f0;border-radius:12px;padding:11px}.subjectCard b{display:block}.subjectCard small{color:#756e86}.preview{background:#f8f6ff;border:1px solid #ddd5f5;border-radius:15px;padding:15px;margin-top:14px}.lessonChecks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.lesson{display:flex;align-items:flex-start;gap:8px;border:1px solid #e5e0f0;border-radius:10px;padding:10px;background:#fff}.lesson input{width:auto;margin-top:3px}.note{color:#706b7d;font-size:13px}.hide{display:none}@media(max-width:700px){.grid,.subjects,.lessonChecks{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">أنجز AI</div><a class="back" href="index.html">← الرئيسية</a></div><div id="owner" class="screen on"><div class="hero"><h1>📅 الخطة الأسبوعية</h1><p>أنشئ خطة للصف ثم شارك الرابط مع المعلمين والمعلمات لتعبئة موادهم ودروسهم.</p></div><div class="panel"><h2>إنشاء الخطة</h2><div class="grid"><div class="field"><label>اسم المدرسة</label><input id="school"></div><div class="field"><label>الأسبوع</label><input id="week" placeholder="مثال: الأسبوع الخامس"></div><div class="field"><label>المرحلة</label><select id="stage" onchange="fillGrades()"><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option></select></div><div class="field"><label>الصف</label><select id="grade" onchange="renderOwnerSubjects();renderOwnerPreview()"></select></div><div class="field"><label>الفصل الدراسي</label><select id="term" onchange="renderOwnerPreview()"><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div><div class="field"><label>بداية الأسبوع</label><input id="start" type="date"></div></div><div class="actions"><button class="btn" onclick="createPlan()">إنشاء رابط المشاركة</button></div><div id="shareBox"></div></div><div class="panel"><h2>مواد الصف</h2><div class="subjects" id="subjects"></div><div class="preview"><h3>معاينة نموذج المعلم/ة</h3><p class="note">هنا تتأكد أن المادة والوحدة والدرس تظهر قبل إنشاء رابط المشاركة.</p><div class="grid"><div class="field"><label>المادة</label><select id="ownerSubject" onchange="fillOwnerUnits()"></select></div><div class="field"><label>الوحدة / الفصل</label><select id="ownerUnit" onchange="fillOwnerLessons()"></select></div><div class="field"><label>الدرس</label><select id="ownerLesson"></select></div></div><div id="ownerManual" class="note"></div></div></div></div><div id="participant" class="screen"><div class="hero"><h1>✍️ تعبئة الخطة الأسبوعية</h1><p id="planTitle"></p></div><div class="panel"><div class="grid"><div class="field"><label>اسم المعلم/ة</label><input id="teacher"></div><div class="field"><label>المادة</label><select id="subject" onchange="fillUnits()"></select></div><div class="field"><label>الصف</label><input id="pgrade" readonly></div><div class="field" id="unitField"><label>الوحدة / الفصل</label><select id="unit" onchange="fillLessons()"></select></div></div><div class="field" id="lessonField"><label>الدروس لهذا الأسبوع</label><div class="lessonChecks" id="lessonChecks"></div></div><div class="field hide" id="manualField"><label>الدروس / الموضوعات</label><textarea id="manualLessons" placeholder="اكتب الدروس لهذا الأسبوع"></textarea></div><div class="grid"><div class="field"><label>الواجبات والتكليفات</label><textarea id="homework"></textarea></div><div class="field"><label>ملاحظات</label><textarea id="notes"></textarea></div></div><button class="btn" onclick="submitPart()">حفظ مشاركتي</button><div id="msg"></div></div></div></div><script>const primary=['القرآن الكريم والدراسات الإسلامية','لغتي','الرياضيات','العلوم','اللغة الإنجليزية','المهارات الحياتية والأسرية','التربية الفنية','التربية البدنية والدفاع عن النفس'];const curriculum={ابتدائي:{'الأول الابتدائي':primary,'الثاني الابتدائي':primary,'الثالث الابتدائي':primary,'الرابع الابتدائي':[...primary,'الدراسات الاجتماعية','المهارات الرقمية'],'الخامس الابتدائي':[...primary,'الدراسات الاجتماعية','المهارات الرقمية'],'السادس الابتدائي':[...primary,'الدراسات الاجتماعية','المهارات الرقمية']},متوسط:{'الأول المتوسط':['الدراسات الإسلامية','لغتي الخالدة','الرياضيات','العلوم','اللغة الإنجليزية','الدراسات الاجتماعية','المهارات الرقمية'],'الثاني المتوسط':['الدراسات الإسلامية','لغتي الخالدة','الرياضيات','العلوم','اللغة الإنجليزية','الدراسات الاجتماعية','المهارات الرقمية'],'الثالث المتوسط':['الدراسات الإسلامية','لغتي الخالدة','الرياضيات','العلوم','اللغة الإنجليزية','الدراسات الاجتماعية','المهارات الرقمية']},ثانوي:{'الأول الثانوي':['القرآن الكريم وتفسيره','الكفايات اللغوية','الرياضيات','الأحياء','الكيمياء','الفيزياء','اللغة الإنجليزية','التقنية الرقمية']}};const firstLessons={'لغتي':{'الوحدة الأولى: أسرتي':['حرف (م)','حرف (ب)','حرف (ل)','حرف (د)','حرف (ن)','حرف (ر)'],'الوحدة الثانية: مدرستي':['حرف (ص)','حرف (ف)']},'الرياضيات':{'الفصل الأول: المقارنة والتصنيف':['التصنيف وفق خاصية واحدة','التصنيف وفق أكثر من خاصية','يساوي','أكثر من، أقل من'],'الفصل الثاني: الأعداد حتى ٥':['الأعداد ١، ٢، ٣','قراءة الأعداد ١، ٢، ٣ وكتابتها','العددان ٤، ٥','قراءة العددين ٤، ٥ وكتابتهما','قراءة العدد صفر وكتابته'],'الفصل الثالث: الموقع والنمط':['فوق، تحت','أعلى، أوسط، أسفل','قبل، بعد','تحديد الأنماط','إنشاء الأنماط'],'الفصل الرابع: الأعداد حتى ١٠':['الأعداد ٦، ٧، ٨','قراءة الأعداد ٦، ٧، ٨ وكتابتها','العددان ٩، ١٠','مقارنة الأعداد حتى ١٠','ترتيب الأعداد حتى ١٠']},'العلوم':{'الوحدة الأولى: النباتات من حولنا':['المخلوقات الحية','النباتات وأجزاؤها','نمو النباتات','تعيش النباتات في أماكن كثيرة'],'الوحدة الثانية: الحيوانات ومساكنها':['أنواع الحيوانات','الحيوانات وحاجاتها','مواطن على اليابسة','مواطن في الماء'],'الوحدة الثالثة: أرضنا':['موارد الأرض','الاستفادة من موارد الأرض','المحافظة على موارد الأرض']}};let plan=null;const $=id=>document.getElementById(id);function grades(){return Object.keys(curriculum[$('stage').value]||{})}function subs(stageVal,gradeVal){return curriculum[stageVal]?.[gradeVal]||[]}function lessonData(gradeVal,subjectVal,termVal){if(gradeVal==='الأول الابتدائي'&&termVal==='الفصل الدراسي الأول')return firstLessons[subjectVal]||null;return null}function fillGrades(){$('grade').innerHTML=grades().map(x=>`<option>${x}</option>`).join('');renderOwnerSubjects();renderOwnerPreview()}function renderOwnerSubjects(){const a=subs($('stage').value,$('grade').value);$('subjects').innerHTML=a.map(s=>`<div class="subjectCard"><b>${s}</b><small>${lessonData($('grade').value,s,$('term').value)?'✓ المادة والدروس مضافة':'المادة مضافة — الدروس قيد الإضافة'}</small></div>`).join('')}function renderOwnerPreview(){const a=subs($('stage').value,$('grade').value);$('ownerSubject').innerHTML=a.map(x=>`<option>${x}</option>`).join('');fillOwnerUnits()}function fillOwnerUnits(){const d=lessonData($('grade').value,$('ownerSubject').value,$('term').value);if(!d){$('ownerUnit').innerHTML='<option>الدروس قيد الإضافة</option>';$('ownerLesson').innerHTML='<option>يمكن كتابتها يدويًا حاليًا</option>';$('ownerManual').textContent='الدروس المربوطة حاليًا في الأول الابتدائي: لغتي، الرياضيات، العلوم.';return}$('ownerManual').textContent='';$('ownerUnit').innerHTML=Object.keys(d).map(x=>`<option>${x}</option>`).join('');fillOwnerLessons()}function fillOwnerLessons(){const d=lessonData($('grade').value,$('ownerSubject').value,$('term').value),u=$('ownerUnit').value;$('ownerLesson').innerHTML=(d?.[u]||[]).map(x=>`<option>${x}</option>`).join('')}function createPlan(){plan={id:Math.random().toString(36).slice(2,9),school:$('school').value,week:$('week').value,stage:$('stage').value,grade:$('grade').value,term:$('term').value,start:$('start').value,subs:subs($('stage').value,$('grade').value)};localStorage.setItem('anjz_weekly_'+plan.id,JSON.stringify(plan));const url=location.origin+location.pathname+'?plan='+plan.id+'&v=selectors2';$('shareBox').innerHTML=`<div class="share"><b>رابط المشاركة:</b><br>${url}<div class="actions" style="margin-top:8px"><button class="btn ghost" onclick="navigator.clipboard.writeText('${url}')">نسخ الرابط</button><button class="btn ghost" onclick="location.href='${url}'">تجربة الرابط</button></div></div>`}function loadParticipant(id){plan=JSON.parse(localStorage.getItem('anjz_weekly_'+id)||'null');if(!plan){$('owner').innerHTML='<div class="panel"><h2>الرابط غير متاح على هذا الجهاز في النسخة التجريبية.</h2><p>سيعمل من جميع الأجهزة بعد ربط قاعدة البيانات.</p></div>';return}$('owner').classList.remove('on');$('participant').classList.add('on');$('planTitle').textContent=(plan.school||'المدرسة')+' — '+(plan.week||'الخطة الأسبوعية');$('pgrade').value=plan.grade;$('subject').innerHTML=plan.subs.map(x=>`<option>${x}</option>`).join('');fillUnits()}function fillUnits(){const d=lessonData(plan.grade,$('subject').value,plan.term);$('lessonChecks').innerHTML='';if(!d){$('unitField').classList.add('hide');$('lessonField').classList.add('hide');$('manualField').classList.remove('hide');return}$('unitField').classList.remove('hide');$('lessonField').classList.remove('hide');$('manualField').classList.add('hide');$('unit').innerHTML=Object.keys(d).map(x=>`<option>${x}</option>`).join('');fillLessons()}function fillLessons(){const d=lessonData(plan.grade,$('subject').value,plan.term),ls=d?.[$('unit').value]||[];$('lessonChecks').innerHTML=ls.map(x=>`<label class="lesson"><input type="checkbox" name="lesson" value="${x}"><span>${x}</span></label>`).join('')}function submitPart(){const chosen=[...document.querySelectorAll('input[name=lesson]:checked')].map(x=>x.value);const x={teacher:$('teacher').value,subject:$('subject').value,unit:$('unit')?.value||'',lessons:chosen.length?chosen.join('، '):$('manualLessons').value,homework:$('homework').value,notes:$('notes').value,at:new Date().toISOString()};const k='anjz_weekly_parts_'+plan.id,a=JSON.parse(localStorage.getItem(k)||'[]');a.push(x);localStorage.setItem(k,JSON.stringify(a));$('msg').innerHTML='<div class="ok">✓ تم حفظ المشاركة.</div>'}fillGrades();const pid=new URLSearchParams(location.search).get('plan');if(pid)loadParticipant(pid);</script></body></html>
